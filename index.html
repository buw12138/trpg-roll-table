  /* ---------------- 存储 ---------------- */

  function read() {
    try {
      const raw = RT.storage.get(KEY);
      const v = raw ? JSON.parse(raw) : null;
      return v && Array.isArray(v.list) ? v : { list: [] };
    } catch (e) {
      return { list: [] };
    }
  }

  function write(st) {
    RT.storage.set(KEY, JSON.stringify(st));
  }

  /** v1 扁平 layout → v2 树：连续两个 half 合并成一行两列，其余整行 */
  function convertV1(layout) {
    const out = [];
    let halfRow = null;

    function flushHalf() {
      if (!halfRow) return;
      if (halfRow.children.length === 1) {
        halfRow.children[0].start = 1;
        halfRow.children[0].span = 6;
      }
      out.push(halfRow);
      halfRow = null;
    }

    (layout || []).forEach(function (comp) {
      if (!comp || !comp.type) return;
      const node = Object.assign({}, comp, {
        type: 'field',
        comp: comp.type,
        start: 1,
        span: comp.width === 'half' ? 6 : 12,
        id: comp.id || uid('c'),
      });
      delete node.width;

      if (comp.type === 'heading') {
        flushHalf();
        node.start = 1;
        node.span = 12;
        out.push(node);
        return;
      }
      if (comp.width === 'half') {
        if (halfRow && halfRow.children.length < 2) {
          node.start = 7;
          node.span = 6;
          halfRow.children.push(node);
          flushHalf();
        } else {
          flushHalf();
          halfRow = {
            id: uid('r'), type: 'row', start: 1, span: 12, gap: 10, children: [node],
          };
        }
        return;
      }
      flushHalf();
      out.push(node);
    });
    flushHalf();
    return { type: 'root', cols: 12, children: out };
  }

  /** 把旧 key 里的模板迁到新格式；成功后删除旧 key（失败则原样保留） */
  function migrateLegacy() {
    let raw = null;
    try { raw = RT.storage.get(LEGACY_KEY); } catch (e) { return 0; }
    if (!raw) return 0;

    let old = null;
    try {
      old = JSON.parse(raw);
    } catch (e) {
      console.warn('旧模板数据无法解析，已原样保留：', e);
      return 0;
    }
    const list = old && Array.isArray(old.list) ? old.list : [];
    const st = read();
    const have = {};
    st.list.forEach(function (t) { have[t.id] = true; });

    let n = 0;
    list.forEach(function (t) {
      if (!t || !t.id || have[t.id]) return;
      st.list.push({
        id: t.id,
        name: t.name || '未命名模板',
        icon: t.icon || 'layers',
        kind: 'sheet',
        cardKind: null,
        builtin: !!t.builtin,
        version: (t.version || 1) + 1,
        responsive: 'stack',
        layout: Array.isArray(t.layout) ? convertV1(t.layout) : { type: 'root', cols: 12, children: [] },
        sample: {},
        accent: '',
        width: 0,
        ts: t.ts || Date.now(),
      });
      have[t.id] = true;
      n++;
    });

    write(st);
    try { RT.storage.del(LEGACY_KEY); } catch (e) { /* ignore */ }
    return n;
  }

  /** 内置模板（记录表 + 卡片，卡片由 18b 注册） */
  function allBuiltins() {
    let out = builtins().slice();
    if (RT.dmCard && typeof RT.dmCard.builtins === 'function') {
      out = out.concat(RT.dmCard.builtins());
    }
    return out;
  }

  let legacyChecked = false;

  /** 保证内置模板始终存在（用户改过的版本优先） */
  function ensure() {
    if (!legacyChecked) {
      legacyChecked = true;
      migrateLegacy();
    }
    const st = read();
    const have = {};
    st.list.forEach(function (t) { have[t.id] = true; });
    let dirty = false;
    /* 旧版「自定义卡片」分类已合并进特殊卡 */
    st.list.forEach(function (t) {
      if (t && t.kind === 'card' && (!t.cardKind || t.cardKind === 'custom')) {
        t.cardKind = 'special';
        dirty = true;
      }
    });
    allBuiltins().forEach(function (b) {
      const item = clone(b);
      if (!item.sample || typeof item.sample !== 'object') item.sample = {};
      if (!item.responsive) item.responsive = 'stack';
      const i = st.list.findIndex(function (t) { return t.id === b.id; });
      if (i < 0) {
        st.list.push(item);
        dirty = true;
      } else if (st.list[i].builtin && Number(st.list[i].version || 1) < Number(b.version || 1)) {
        /* 内置模板升级：用户自己存过新版（version 已被保存器递增）则不动 */
        st.list[i] = item;
        have[b.id] = true;
        dirty = true;
      }
    });
    if (dirty) write(st);
    return st;
  }

  /* ---------------- 记录表渲染 ---------------- */

  function attrSet(o, path, isCheck) {
    if (o && o.preview) {
      return isCheck
        ? 'data-tb-sample-check="' + path + '"'
        : 'data-tb-sample="' + path + '"';
    }
    return isCheck
      ? 'data-act="sheet-set-check" data-path="' + path + '"'
      : 'data-act="sheet-set" data-path="' + path + '"';
  }

  function inputHtml(comp, path, val, o) {
    const v = val == null ? '' : val;
    const base = attrSet(o, path);
    switch (comp.type) {
      case 'textarea':
        return '<textarea rows="' + (comp.rows || 2) + '" ' + base + ' placeholder="' +
          RT.attr(comp.placeholder || '') + '">' + esc(v) + '</textarea>';
      case 'number':
        return '<input type="number" ' + base + ' value="' + RT.attr(v) + '" placeholder="' +
          RT.attr(comp.placeholder || '') + '">';
      case 'date':
        return '<input type="date" ' + base + ' value="' + RT.attr(v) + '">';
      case 'select': {
        const opts = (comp.options || []).map(function (opt) {
          return '<option value="' + RT.attr(opt) + '"' + (String(v) === String(opt) ? ' selected' : '') + '>' + esc(opt) + '</option>';
        }).join('');
        return '<select ' + base + '><option value="">未选</option>' + opts + '</select>';
      }
      default:
        return '<input type="text" ' + base + ' value="' + RT.attr(v) + '" placeholder="' +
          RT.attr(comp.placeholder || '') + '">';
    }
  }

  function leafHtml(comp, path, val, o) {
    if (comp.type === 'check') {
      const on = val === true || val === 'true';
      return '<label class="sx-check"><input type="checkbox" ' + attrSet(o, path, true) +
        (on ? ' checked' : '') + '><span>' + esc(comp.label || '') + '</span></label>';
    }
    return '<label class="sx-field"><span>' + esc(comp.label || '') + '</span>' +
      inputHtml(comp, path, val, o) + '</label>';
  }

  function listHtml(comp, path, val, o) {
    const preview = !!(o && o.preview);
    const rows = Array.isArray(val) ? val : [];
    const n = Math.max(rows.length, preview ? 2 : 1);
    let html = '<div class="sx-rows">';
    for (let i = 0; i < n; i++) {
      const rowVal = rows[i] || {};
      html += '<div class="sx-rowline">' +
        '<input type="checkbox" ' + attrSet(o, path + '.' + i + '.done', true) + (rowVal.done ? ' checked' : '') +
        (preview ? ' disabled' : '') + '>' +
        '<input type="text" ' + attrSet(o, path + '.' + i + '.text') + ' value="' + RT.attr(rowVal.text || '') +
        '" placeholder="' + (preview ? '清单项' : '') + '"' + (preview ? ' readonly' : '') + '>' +
        (preview ? '' : '<button class="mini danger" data-act="sheet-row-del" data-path="' + path + '" data-i="' + i + '" title="删除">' +
          RT.icon('x', 12) + '</button>') +
        '</div>';
    }
    html += '</div>';
    if (!preview) {
      html += '<button class="btn ghost small" data-act="sheet-row-add" data-path="' + path + '">' +
        RT.icon('plus', 12) + ' 加一行</button>';
    }
    return html;
  }

  function tableHtml(comp, path, val, o) {
    const preview = !!(o && o.preview);
    const rows = Array.isArray(val) ? val : [];
    const cols = comp.columns || [];
    const n = Math.max(rows.length, preview ? 2 : 1);
    let html = '<div class="tablewrap"><table class="sheet-table sx-table"><thead><tr>' +
      cols.map(function (c) { return '<th>' + esc(c.label || c.key) + '</th>'; }).join('') +
      '<th class="row-end"></th></tr></thead><tbody>';
    for (let i = 0; i < n; i++) {
      const rowVal = rows[i] || {};
      html += '<tr>' + cols.map(function (c) {
        const p = path + '.' + i + '.' + c.key;
        if (c.type === 'number') {
          return '<td><input type="number" ' + attrSet(o, p) + ' value="' +
            RT.attr(rowVal[c.key] == null ? '' : rowVal[c.key]) + '"' + (preview ? ' readonly' : '') + '></td>';
        }
        if (c.type === 'check') {
          return '<td class="sx-cell-check"><input type="checkbox" ' + attrSet(o, p, true) +
            (rowVal[c.key] ? ' checked' : '') + (preview ? ' disabled' : '') + '></td>';
        }
        return '<td><input type="text" ' + attrSet(o, p) + ' value="' +
          RT.attr(rowVal[c.key] == null ? '' : rowVal[c.key]) + '"' + (preview ? ' readonly' : '') + '></td>';
      }).join('') +
        '<td class="row-end">' + (preview ? '' :
          '<button class="mini danger" data-act="sheet-row-del" data-path="' + path + '" data-i="' + i + '">' +
          RT.icon('trash', 12) + '</button>') + '</td></tr>';
    }
    html += '</tbody></table></div>';
    if (!preview) {
      html += '<button class="btn ghost small" data-act="sheet-row-add" data-path="' + path + '">' +
        RT.icon('plus', 12) + ' 加一行</button>';
    }
    return html;
  }

  function repeatHtml(comp, path, val, o) {
    const preview = !!(o && o.preview);
    const rows = Array.isArray(val) ? val : [];
    const n = Math.max(rows.length, comp.min || 1, preview ? 1 : 1);
    const fields = comp.fields || [];
    let html = '<div class="sx-repeat">';
    for (let i = 0; i < n; i++) {
      const rowVal = rows[i] || {};
      html += '<div class="sx-repcard">' +
        '<div class="sx-rephead"><span class="dim">' + esc(comp.itemLabel || comp.label || '条目') + ' ' + (i + 1) + '</span>' +
        (preview ? '' : '<button class="mini danger" data-act="sheet-row-del" data-path="' + path + '" data-i="' + i + '" title="删除这组">' +
          RT.icon('x', 12) + '</button>') + '</div>' +
        '<div class="sx-grid">' + fields.map(function (f) {
          return leafHtml(f, path + '.' + i + '.' + f.id, rowVal[f.id], o);
        }).join('') + '</div></div>';
    }
    html += '</div>';
    if (!preview) {
      html += '<button class="btn ghost small" data-act="sheet-row-add" data-path="' + path + '">' +
        RT.icon('plus', 12) + ' 加一组' + esc(comp.itemLabel || '') + '</button>';
    }
    return html;
  }

  /** 模板节点把组件类型放在 comp 上，老渲染函数按 type 分支：先归一化 */
  function asComp(node) {
    if (!node) return node;
    if (node.comp && node.comp !== node.type) return Object.assign({}, node, { type: node.comp });
    return node;
  }

  function renderField(node, path, val, o) {
    const comp = asComp(node);
    if (comp.type === 'heading') {
      return '<div class="sx-section">' + esc(comp.label || '') + '</div>';
    }
    if (comp.type === 'list') {
      return '<div class="sx-item"><div class="sx-itemhd">' + esc(comp.label || '') + '</div>' +
        listHtml(comp, path, val, o) + '</div>';
    }
    if (comp.type === 'table') {
      return '<div class="sx-item"><div class="sx-itemhd">' + esc(comp.label || '') + '</div>' +
        tableHtml(comp, path, val, o) + '</div>';
    }
    if (comp.type === 'repeat') {
      return '<div class="sx-item"><div class="sx-itemhd">' + esc(comp.label || '') + '</div>' +
        repeatHtml(comp, path, val, o) + '</div>';
    }
    return leafHtml(comp, path, val, o);
  }

  function renderNode(node, values, o) {
    if (!node) return '';
    if (node.type === 'row') {
      return '<div class="sx-row" style="' + cellStyle(node) + ';gap:' + num(node.gap, 10) + 'px">' +
        (node.children || []).map(function (c) { return renderNode(c, values, o); }).join('') + '</div>';
    }
    if (node.type === 'group') {
      return '<section class="sx-group' + (node.boxed ? ' boxed' : '') + '" style="' + cellStyle(node) + '">' +
        (node.title ? '<div class="sx-group-head">' + esc(node.title) + '</div>' : '') +
        '<div class="sx-group-body">' +
        (node.children || []).map(function (c) { return renderNode(c, values, o); }).join('') +
        '</div></section>';
    }
    const val = getVal(values, node.id);
    return '<div class="sx-cell" style="' + cellStyle(node) + '">' +
      renderField(node, node.id, val, o) + '</div>';
  }

  /** 渲染一份记录表实例 */
  function renderSheet(template, values, opts) {
    const o = opts || {};
    if (!template || !template.layout || !Array.isArray(template.layout.children)) {
      return '<p class="dim">这个模板还没有组件。</p>';
    }
    const stack = template.responsive === 'stack' ? ' sx-stack' : '';
    return '<div class="sx-form sx-grid12' + stack + '">' +
      template.layout.children.map(function (n) { return renderNode(n, values || {}, o); }).join('') +
      '</div>';
  }

  /** 只渲染一个节点（卡片渲染器 / 编辑器复用） */
  function renderSheetNode(node, values, opts) {
    return renderNode(node, values || {}, opts || {});
  }

  /* ---------------- 迁移：老四张表 → 实例 ---------------- */

  function migrate(raw) {
    const d = raw && typeof raw === 'object' ? raw : {};
    if (d.migratedToTemplates && Array.isArray(d.custom)) return d;

    const custom = Array.isArray(d.custom) ? d.custom.slice() : [];
    const mk = function (templateId, title, values) {
      return { id: RT.ws.uid('si'), templateId: templateId, title: title || '', values: values || {}, ts: Date.now() };
    };

    (d.sessions || []).forEach(function (s, i) {
      const values = { c_no: s.no || '第 ' + (i + 1) + ' 场', c_date: s.date || '' };
      QS.forEach(function (q, qi) {
        const v = (s.a && s.a['q' + (qi + 1)]) || '';
        if (v) values['c_q' + (qi + 1)] = v;
      });
      custom.push(mk('bt_session', s.no || '第 ' + (i + 1) + ' 场', values));
    });

    if (Array.isArray(d.characters) && d.characters.length) {
      custom.push(mk('bt_characters', '角色', {
        c_pc: d.characters.map(function (c) {
          return {
            name: c.name || '', player: c.player || '', raceClass: c.raceClass || '',
            background: c.background || '', details: c.details || '', notes: c.notes || '',
          };
        }),
      }));
    }

    if (Array.isArray(d.npcs) && d.npcs.length) {
      custom.push(mk('bt_npcs', 'NPC', {
        c_npc: d.npcs.map(function (n) {
          return {
            name: n.name || '', archetype: n.archetype || '', raceClass: n.raceClass || '',
            stats: n.stats || '', relation: n.relation || '', notes: n.notes || '',
          };
        }),
      }));
    }

    const p = d.planner;
    if (p && (p.hook || (p.truths || []).some(Boolean) || (p.fronts || []).some(function (f) {
      return f && (f.name || f.goal || f.p1 || f.p2 || f.p3);
    }))) {
      const values = { c_hook: p.hook || '' };
      (p.truths || []).forEach(function (t, i) { if (t) values['c_truth' + (i + 1)] = t; });
      values.c_front = (p.fronts || []).map(function (f) {
        return {
          name: (f && f.name) || '', goal: (f && f.goal) || '',
          p1: (f && f.p1) || '', p2: (f && f.p2) || '', p3: (f && f.p3) || '',
        };
      });
      custom.push(mk('bt_planner', '战役规划', values));
    }

    d.custom = custom;
    d.migratedToTemplates = true;
    if (!d.activeInstanceId && custom[0]) d.activeInstanceId = custom[0].id;
    return d;
  }

  /* ---------------- Markdown 导出 ---------------- */

  function valueText(comp, val) {
    if (comp.type === 'table') {
      const rows = Array.isArray(val) ? val : [];
      if (!rows.length) return '';
      const cols = comp.columns || [];
      const head = '| ' + cols.map(function (c) { return c.label || c.key; }).join(' | ') + ' |';
      const sep = '| ' + cols.map(function () { return '---'; }).join(' | ') + ' |';
      const body = rows.map(function (r) {
        return '| ' + cols.map(function (c) { return String((r && r[c.key]) || '').replace(/\|/g, '/'); }).join(' | ') + ' |';
      }).join('\n');
      return head + '\n' + sep + '\n' + body;
    }
    if (comp.type === 'list') {
      return (Array.isArray(val) ? val : []).map(function (r) {
        return '- ' + (r.done ? '[x] ' : '[ ] ') + (r.text || '');
      }).join('\n');
    }
    if (comp.type === 'repeat') {
      return (Array.isArray(val) ? val : []).map(function (rowVal, i) {
        const bits = (comp.fields || []).map(function (f) {
          const v = rowVal && rowVal[f.id];
          return v ? ('**' + (f.label || f.id) + '** ' + v) : '';
        }).filter(Boolean);
        if (!bits.length) return '';
        return '#### ' + (comp.itemLabel || comp.label || '条目') + ' ' + (i + 1) + '\n' + bits.join('\n');
      }).filter(Boolean).join('\n\n');
    }
    return val == null ? '' : String(val);
  }

  function mdNode(node, values, L) {
    if (!node) return;
    if (node.type === 'row') {
      (node.children || []).forEach(function (c) { mdNode(c, values, L); });
      return;
    }
    if (node.type === 'group') {
      if (node.title) { L.push('### ' + node.title); L.push(''); }
      (node.children || []).forEach(function (c) { mdNode(c, values, L); });
      return;
    }
    if (node.comp === 'heading') {
      L.push('### ' + (node.label || ''));
      L.push('');
      return;
    }
    const v = valueText(asComp(node), getVal(values, node.id));
    if (!v || !String(v).trim()) return;
    if (node.comp === 'table' || node.comp === 'list' || node.comp === 'repeat') {
      L.push('**' + (node.label || '') + '**');
      L.push('');
      L.push(v);
    } else if (node.comp === 'check') {
      L.push('- [x] ' + (node.label || ''));
    } else {
      L.push('**' + (node.label || '') + '**：' + String(v).replace(/\n/g, ' / '));
    }
    L.push('');
  }

  function instanceMd(template, inst) {
    const L = ['## ' + (inst.title || (template ? template.name : '记录'))];
    if (!template) return L.join('\n');
    L.push('');
    (template.layout ? template.layout.children || [] : []).forEach(function (n) {
      mdNode(n, inst.values || {}, L);
    });
    return L.join('\n');
  }

  /* ---------------- 模板库 API ---------------- */

  function listAll() {
    return ensure().list;
  }

  function get(id) {
    return listAll().filter(function (t) { return t.id === id; })[0] || null;
  }

  function save(tpl) {
    const st = ensure();
    const i = st.list.findIndex(function (t) { return t.id === tpl.id; });
    const isCard = tpl.kind === 'card';
    const clean = {
      id: tpl.id || uid('st'),
      name: String(tpl.name || '').trim() || '未命名模板',
      icon: tpl.icon || (isCard ? 'book' : 'layers'),
      kind: isCard ? 'card' : 'sheet',
      cardKind: isCard ? (tpl.cardKind === 'custom' || !tpl.cardKind ? 'special' : tpl.cardKind) : null,
      builtin: !!tpl.builtin,
      version: tpl.version || 1,
      layout: tpl.layout || { type: 'root', cols: 12, children: [] },
      sample: tpl.sample && typeof tpl.sample === 'object' ? tpl.sample : {},
      responsive: tpl.responsive || 'stack',
      accent: tpl.accent || '',
      width: num(tpl.width, 0),
      ts: Date.now(),
    };
    if (i >= 0) st.list[i] = clean;
    else st.list.push(clean);
    write(st);
    return clean;
  }

  function create(kind, name) {
    const isCard = kind === 'card';
    return save({
      id: uid('st'),
      name: name || (isCard ? '新卡片模板' : '新模板'),
      icon: isCard ? 'book' : 'layers',
      kind: isCard ? 'card' : 'sheet',
      cardKind: isCard ? 'special' : null,
      builtin: false,
      version: 1,
      layout: { type: 'root', cols: 12, children: [] },
      sample: {},
      responsive: 'stack',
      width: isCard ? 300 : 0,
      accent: isCard ? '' : '',
    });
  }

  function duplicate(id) {
    const t = get(id);
    if (!t) return null;
    const copy = clone(t);
    copy.id = uid('st');
    copy.name = t.name + '（副本）';
    copy.builtin = false;
    copy.version = 1;
    /* 组件 id 原样保留：新模板没有实例，不会被旧数据引用 */
    return save(copy);
  }

  function remove(id) {
    const st = ensure();
    const t = st.list.filter(function (x) { return x.id === id; })[0];
    if (!t || t.builtin) return false;
    st.list = st.list.filter(function (x) { return x.id !== id; });
    write(st);
    return true;
  }

  function resetBuiltin(id) {
    const st = ensure();
    const src = allBuiltins().filter(function (b) { return b.id === id; })[0];
    if (!src) return false;
    const i = st.list.findIndex(function (t) { return t.id === id; });
    if (i >= 0) st.list[i] = clone(src);
    else st.list.push(clone(src));
    write(st);
    return true;
  }

  function usage(id) {
    let n = 0;
    RT.ws.campaigns().forEach(function (c) {
      const d = RT.ws.store(RT.ws.KEYS.sheets).get(c.id);
      if (d && Array.isArray(d.custom)) {
        n += d.custom.filter(function (i) { return i.templateId === id; }).length;
      }
    });
    return n;
  }

  /** 新建模板：先选种类，再进编辑器 */
  function newTemplate(kind) {

    });
    RT.dialogs.open({

  function manage() {
    const list = listAll();
    const order = KINDS.map(function (k) { return k.key; });
    const groups = {};
    list.forEach(function (t) {
      const k = kindKey(t);
      (groups[k] = groups[k] || []).push(t);
    });
    const blocks = order.filter(function (k) { return groups[k]; }).map(function (k) {
      const meta = KINDS.filter(function (x) { return x.key === k; })[0];
      return '<div class="tpl-group"><div class="tpl-group-head">' + esc(meta.name) +
        '<span class="dim">' + groups[k].length + '</span></div>' +
        groups[k].map(function (t) {
          return '<div class="tpl-row">' +
            '<div class="tpl-info"><strong>' + esc(t.name) + '</strong>' +
            '<span class="dim">' + countFields(t.layout) + ' 个组件 · v' + (t.version || 1) +

            '<button class="btn ghost small" data-edit="' + t.id + '">编辑</button>' +
            '<button class="btn ghost small" data-dup="' + t.id + '">复制</button>' +

            '</div></div>';
        }).join('') + '</div>';
    }).join('');

    RT.dialogs.open({
      title: '模板库',
      wide: true,
      body:
        '<p class="modal-note">模板系统是通用的：记录表与卡片共用同一套模板定义。' +
        '打开编辑器后可以直接在画布上拖组件、拉宽度、实时看到成品。</p>' +

        '<button class="btn ghost small" data-import="1">导入模板 JSON</button>' +
        '</div>',
      onMount: function (modal) {
        modal.querySelectorAll('[data-edit]').forEach(function (b) {
          b.addEventListener('click', function () {
            RT.dialogs.close();
            RT.tplBuilder.open(b.getAttribute('data-edit'));
          });
        });
        modal.querySelectorAll('[data-dup]').forEach(function (b) {
          b.addEventListener('click', function () {
            duplicate(b.getAttribute('data-dup'));
            RT.toast('已复制模板');
            RT.dialogs.close();
            manage();
          });
        });
        modal.querySelectorAll('[data-reset]').forEach(function (b) {
          b.addEventListener('click', function () {
            resetBuiltin(b.getAttribute('data-reset'));
            RT.toast('已还原为内置模板');
            RT.dialogs.close();
            manage();
          });
        });
        modal.querySelectorAll('[data-del]').forEach(function (b) {
          b.addEventListener('click', function () {
            const id = b.getAttribute('data-del');
            const used = usage(id);
            RT.dialogs.confirm('删除模板',
              '模板会被删除' + (used ? '，但已用它的 ' + used + ' 份记录仍保留（之后可能显示不全）' : '') + '。继续？',

          const text = modal.querySelector('#tpl-import-text').value.trim();

          let parsed;
          try { parsed = JSON.parse(text); } catch (e) { RT.toast('JSON 解析失败', 'warn'); return; }
          const arr = Array.isArray(parsed) ? parsed : Array.isArray(parsed.list) ? parsed.list : [parsed];
          let n = 0;
          arr.forEach(function (t) {
            if (!t || !t.name) return;
            const isCard = t.kind === 'card';
            const hasTree = t.layout && !Array.isArray(t.layout) && Array.isArray(t.layout.children);
            const layout = hasTree

              : Array.isArray(t.layout) ? convertV1(t.layout) : null;

            copy.name = t.name + '（导入）';
            copy.layout = layout;
            copy.kind = isCard ? 'card' : 'sheet';
            copy.cardKind = isCard ? (t.cardKind === 'custom' || !t.cardKind ? 'special' : t.cardKind) : null;
            copy.version = 1;
            save(copy);
            n++;

          RT.dialogs.close();
          manage();
          RT.toast(n ? ('已导入 ' + n + ' 个模板') : '没有可导入的模板', n ? undefined : 'warn');
        });
      },
    });
  }

        },
      },
      {
        id: 'bt_special',
        name: '特殊卡',
        icon: 'wand',
        kind: 'card',
        cardKind: 'special',
        builtin: true,
        version: 2,
        width: 220,
        accent: 'gold',
        responsive: 'stack',
        layout: {
          type: 'root', cols: 12, children: [
            field('counter', 'counter', { label: '进度', max: 6 }),
            field('note', 'note', { label: '备注', rows: 2 }),
          ],
        },
      },
    ];
  }

  /* ---------------- 小工具 ---------------- */

  function inlineMd(text) {
    let s = esc(text == null ? '' : text);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    s = s.replace(/\n/g, '<br>');
    return s;
  }

  function obj(v) {
    return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  }

  function arr(v) {
    return Array.isArray(v) ? v : [];
  }

  function sampleAttr(o, key, fallback) {
    return o && o.preview ? ' data-tb-sample="' + fallback + '"' : '';
  }

  /* ---------------- 值 ---------------- */

  function defaultValues(template) {
    const vals = {};
    tpl.walk(template.layout, function (node) {
      if (node.type !== 'field') return;
      switch (node.comp) {
        case 'tracker':
          vals[node.id] = { max: Math.max(1, Number(node.max) || 1), marked: 0 };
          break;
        case 'counter':
          vals[node.id] = { value: 0, max: Math.max(1, Number(node.max) || 6) };
          break;
        case 'dice':
          vals[node.id] = {
            mode: node.mode === 'duality' ? 'duality' : 'normal',
            expr: node.expr || '1d20',
            last: null,
          };
          break;
        case 'chips':
        case 'stats':
        case 'pairs':
          vals[node.id] = {};
          break;
        case 'features':
          vals[node.id] = [];
          break;
        default:
          vals[node.id] = '';
      }
    });
    return vals;
  }

  /* ---------------- 渲染 ---------------- */

  function trackerHtml(node, path, val, o) {
    const v = obj(val);
    const max = Math.max(1, Math.min(40, Number(v.max != null ? v.max : node.max) || 1));
    const marked = Math.max(0, Math.min(max, Number(v.marked) || 0));
    const boxes = [];
    for (let i = 0; i < max; i++) {
      const on = i < marked;
      const attrs = o && o.preview
        ? ' data-tb-sample-box="' + path + ':' + i + '"'
        : ' data-act="dm-box" data-dm-block="' + path + '" data-i="' + i + '"';
      boxes.push('<button type="button" class="dc-box' + (on ? ' on' : '') + '"' + attrs +
        ' aria-label="' + esc(node.label || '标记') + ' ' + (i + 1) + '"></button>');
    }
    return '<div class="dc-tracker">' +
      '<span class="dc-tracker-label">' + esc(node.label || '') + '</span>' +
      '<span class="dc-boxes">' + boxes.join('') + '</span>' +
      '<span class="dc-tracker-count">' + marked + '/' + max + '</span>' +
      '</div>';
  }

  function chipsHtml(node, path, val) {
    const v = obj(val);
    const bits = (node.fields || []).map(function (f) {
      const text = v[f.id];
      if (text == null || text === '') return '';
      return '<span class="dc-chip"><i>' + esc(f.label || '') + '</i>' + esc(text) + '</span>';
    }).filter(Boolean);
    return bits.length ? '<div class="dc-chips">' + bits.join('') + '</div>' : '';
  }

  function paraHtml(node, path, val) {
    const text = val == null ? '' : String(val);
    if (!text.trim() && !(node.label || '').trim()) return '';
    return '<div class="dc-para' + (node.italic ? ' italic' : '') + '">' +
      (node.label ? '<span class="dc-para-label">' + esc(node.label) + '</span>' : '') +
      '<p>' + inlineMd(text) + '</p></div>';
  }

  function pairsHtml(node, path, val) {
    const v = obj(val);
    const bits = (node.fields || []).map(function (f) {
      if (v[f.id] == null || v[f.id] === '') return '';
      return '<span class="dc-pair"><b>' + esc(f.label || '') + '</b>' + esc(v[f.id]) + '</span>';
    }).filter(Boolean);
    return bits.length ? '<div class="dc-pairs">' + bits.join('') + '</div>' : '';
  }

  function statsHtml(node, path, val, o) {
    const v = obj(val);
    return '<div class="dc-stats">' + (node.label ? '<span class="dc-stats-label">' + esc(node.label) + '</span>' : '') +
      (node.fields || []).map(function (f) {
        const p = path + '.' + f.id;
        const inputAttr = o && o.preview
          ? ' data-tb-sample="' + p + '"'
          : ' data-act="dm-num" data-dm-path="' + p + '"';
        return '<label class="dc-stat"><span>' + esc(f.label || '') + '</span>' +
          '<input type="text" inputmode="numeric" value="' + RT.attr(v[f.id] == null ? '' : v[f.id]) + '"' +
          inputAttr + '></label>';
      }).join('') + '</div>';
  }

  function featuresHtml(node, path, val, o) {
    const list = arr(val);
    if (!list.length) return '';
    const preview = !!(o && o.preview);
    return '<div class="dc-features">' +
      (node.label ? '<div class="dc-section">' + esc(node.label) + '</div>' : '') +
      list.map(function (f, i) {
        if (!f) return '';
        const type = f.type || '';
        const open = preview || !!f.open;
        return '<div class="dc-feature' + (open ? ' open' : '') + '">' +
          '<div class="dc-feature-head" data-act="dm-feature-toggle" data-dm-block="' + path +
          '" data-i="' + i + '" title="点击展开 / 收起">' +
          '<span class="dc-feature-caret">▸</span>' +
          '<b>' + esc(f.name || '未命名') + '</b>' +
          (type ? '<span class="dc-badge">' + esc(type) + '</span>' : '') +
          '</div>' +
          '<div class="dc-feature-body">' +
          (f.desc ? '<p>' + inlineMd(f.desc) + '</p>' : '') +
          (f.question ? '<p class="dc-quest">' + inlineMd(f.question) + '</p>' : '') +
          '</div>' +
          '</div>';
      }).join('') + '</div>';
  }

  function noteHtml(node, path, val, o) {
    const text = val == null ? '' : String(val);
    const attr = o && o.preview
      ? ' data-tb-sample="' + path + '"'
      : ' data-act="dm-note" data-dm-path="' + path + '"';
    return '<textarea class="dc-note" rows="' + (node.rows || 2) + '" placeholder="' +
      RT.attr(node.placeholder || node.label || '备注…') + '"' + attr + '>' + esc(text) + '</textarea>';
  }

  function textHtml(node, path, val, o) {
    const v = val == null ? '' : String(val);
    const attr = o && o.preview
      ? ' data-tb-sample="' + path + '"'
      : ' data-act="dm-text" data-dm-path="' + path + '"';
    return '<label class="dc-field"><span>' + esc(node.label || '') + '</span>' +
      '<input type="text" value="' + RT.attr(v) + '" placeholder="' + RT.attr(node.placeholder || '') + '"' + attr + '></label>';
  }

  function numberHtml(node, path, val, o) {
    const v = val == null ? '' : String(val);
    const attr = o && o.preview
      ? ' data-tb-sample="' + path + '"'
      : ' data-act="dm-num" data-dm-path="' + path + '"';
    return '<label class="dc-field"><span>' + esc(node.label || '') + '</span>' +
      '<input type="text" inputmode="numeric" value="' + RT.attr(v) + '" placeholder="' +
      RT.attr(node.placeholder || '') + '"' + attr + '></label>';
  }

  function textareaHtml(node, path, val, o) {
    const v = val == null ? '' : String(val);
    const attr = o && o.preview
      ? ' data-tb-sample="' + path + '"'
      : ' data-act="dm-note" data-dm-path="' + path + '"';
    return '<label class="dc-field"><span>' + esc(node.label || '') + '</span>' +
      '<textarea rows="' + (node.rows || 2) + '"' + attr + ' placeholder="' +
      RT.attr(node.placeholder || '') + '">' + esc(v) + '</textarea></label>';
  }

  function checkHtml(node, path, val, o) {
    const on = val === true || val === 'true';
    const attr = o && o.preview ? ' data-tb-sample-check="' + path + '"' : ' data-act="dm-check" data-dm-path="' + path + '"';
    return '<label class="dc-check"><input type="checkbox"' + attr + (on ? ' checked' : '') + '>' +
      '<span>' + esc(node.label || '') + '</span></label>';
  }

  function counterHtml(node, path, val, o) {
    const v = obj(val);
    const max = Math.max(1, Math.min(99, Number(v.max != null ? v.max : node.max) || 6));
    const value = Math.max(0, Math.min(max, Number(v.value) || 0));
    const pct = Math.round((value / max) * 100);
    const preview = !!(o && o.preview);
    const valAttr = preview
      ? ' data-tb-sample="' + path + '.value"'
      : ' data-act="dm-card-counter-val" data-dm-block="' + path + '"';
    const maxAttr = preview
      ? ' data-tb-sample="' + path + '.max"'
      : ' data-act="dm-card-counter-max" data-dm-block="' + path + '"';
    const stepAttr = function (d) {
      return preview
        ? ' data-tb-counter-step="' + path + ':' + d + '"'
        : ' data-act="dm-card-counter-step" data-dm-block="' + path + '" data-d="' + d + '"';
    };
    return '<div class="dc-counter">' +
      (node.label ? '<span class="dc-counter-label">' + esc(node.label) + '</span>' : '') +
      '<div class="dc-counter-row">' +
      '<button type="button" class="dmb-step"' + stepAttr(-1) + ' aria-label="减一">−</button>' +
      '<input class="dc-counter-val" inputmode="numeric" value="' + value + '"' + valAttr + '>' +
      '<span class="dc-counter-of">/</span>' +
      '<input class="dc-counter-max" inputmode="numeric" value="' + max + '"' + maxAttr + '>' +
      '<button type="button" class="dmb-step"' + stepAttr(1) + ' aria-label="加一">＋</button>' +
      '</div>' +
      '<div class="dc-counter-bar"><i style="width:' + pct + '%"></i></div>' +
      '</div>';
  }

  function diceResultHtml(last) {
    if (!last) return '<span class="dim">还没掷</span>';
    if (last.kind === 'duality') {
      const cls = last.outcome === '希望' ? 'hope' : last.outcome === '恐惧' ? 'fear' : 'crit';
      return '<span class="dc-die hope">希望 ' + esc(String(last.hope)) + '</span>' +
        '<span class="dc-die fear">恐惧 ' + esc(String(last.fear)) + '</span>' +
        '<b class="dc-die-out ' + cls + '">' + esc(last.outcome || '') + '</b>' +
        '<span class="dim">合计 ' + esc(String((last.hope || 0) + (last.fear || 0))) + '</span>';
    }
    return '<b class="dc-dice-total">' + esc(String(last.total)) + '</b>' +
      '<span class="dc-dice-detail">' + esc(last.text || '') + '</span>';
  }

  function diceHtml(node, path, val, o) {
    const v = obj(val);
    const mode = v.mode || node.mode || 'normal';
    const expr = v.expr || node.expr || '1d20';
    const preview = !!(o && o.preview);
    return '<div class="dc-dice">' +
      (node.label ? '<div class="dc-dice-label">' + esc(node.label) + '</div>' : '') +
      '<div class="dc-dice-row">' +
      (mode === 'duality'
        ? '<span class="dc-dice-fixed">2d12（希望 / 恐惧）</span>'
        : '<input class="dc-dice-expr" value="' + RT.attr(expr) + '"' +
        (preview ? ' data-tb-sample="' + path + '.expr"' : ' data-act="dm-dice-expr" data-dm-block="' + path + '"') +
        ' aria-label="骰子表达式">') +
      '<button type="button" class="dc-dice-btn"' +
      (preview ? ' disabled' : ' data-act="dm-dice-roll" data-dm-block="' + path + '"') +
      '>掷</button>' +
      '</div>' +
      '<div class="dc-dice-result">' + diceResultHtml(v.last) + '</div>' +
      '</div>';
  }

  function renderField(node, path, val, o) {
    switch (node.comp) {
      case 'chips': return chipsHtml(node, path, val);
      case 'para': return paraHtml(node, path, val);
      case 'pairs': return pairsHtml(node, path, val);
      case 'stats': return statsHtml(node, path, val, o);
      case 'tracker': return trackerHtml(node, path, val, o);
      case 'counter': return counterHtml(node, path, val, o);
      case 'dice': return diceHtml(node, path, val, o);
      case 'features': return featuresHtml(node, path, val, o);
      case 'note': return noteHtml(node, path, val, o);
      case 'textarea': return textareaHtml(node, path, val, o);
      case 'number': return numberHtml(node, path, val, o);
      case 'check': return checkHtml(node, path, val, o);
      case 'heading': return '<div class="dc-section">' + esc(node.label || '') + '</div>';
      default: return textHtml(node, path, val, o);
    }
  }

  function boxStyle(node) {
    const b = tpl.box(node);
    return 'grid-column:' + b.start + ' / span ' + b.span;
  }

  function renderNode(node, values, o) {
    if (!node) return '';
    if (node.type === 'row') {
      return '<div class="dc-row" style="' + boxStyle(node) + ';gap:' + (Number(node.gap) || 8) + 'px">' +
        (node.children || []).map(function (c) { return renderNode(c, values, o); }).join('') + '</div>';
    }
    if (node.type === 'group') {
      return '<section class="dc-group' + (node.boxed ? ' boxed' : '') + '" style="' + boxStyle(node) + '">' +
        (node.title ? '<div class="dc-section">' + esc(node.title) + '</div>' : '') +
        '<div class="dc-group-body">' +
        (node.children || []).map(function (c) { return renderNode(c, values, o); }).join('') +
        '</div></section>';
    }
    const val = tpl.getVal(values, node.id);
    const inner = renderField(node, node.id, val, o);
    if (!inner) return '';
    return '<div class="dc-cell" style="' + boxStyle(node) + '">' + inner + '</div>';
  }

  /** 卡面（不含白板外壳的标题栏 / 关闭按钮） */
  function renderFace(template, values, opts) {
    const o = opts || {};
    if (!template || !template.layout) return '<p class="dim">模板已删除。</p>';
    const accent = template.accent ? ' dc-accent-' + template.accent : '';
    return '<div class="dc-face' + accent + (o.preview ? ' dc-preview' : '') + '">' +
      '<div class="dc-grid12' + (template.responsive === 'stack' ? ' dc-stack' : '') + '">' +
      (template.layout.children || []).map(function (n) { return renderNode(n, values || {}, o); }).join('') +
      '</div></div>';
  }

  /* ---------------- 按模板编辑数据（库条目 / 白板卡片共用） ---------------- */

  function fieldRow(node, val) {
    const label = esc(node.label || RT.tpl.TYPE_NAME[node.comp] || node.id);
    switch (node.comp) {
      case 'para':
        return '<label class="edit-row"><span>' + label + '</span>' +
          '<textarea rows="3" data-edit="' + node.id + '">' + esc(val == null ? '' : val) + '</textarea></label>';
      case 'note':
        return '<label class="edit-row"><span>' + label + '</span>' +
          '<textarea rows="3" data-edit="' + node.id + '">' + esc(val == null ? '' : val) + '</textarea></label>';
      case 'tracker': {
        const v = obj(val);
        return '<div class="edit-row"><span>' + label +
          '<button class="mini" data-tracker-add="' + node.id + '" title="加一格">＋</button>' +
          '<button class="mini" data-tracker-sub="' + node.id + '" title="减一格">－</button></span>' +
          '<input type="number" min="1" max="40" data-edit-tracker="' + node.id + '" value="' +
          (v.max != null ? v.max : node.max || 1) + '"></div>';
      }
      case 'counter': {
        const v = obj(val);
        return '<div class="edit-row"><span>' + label + '</span>' +
          '<div class="edit-inline">' +
          '<input type="number" min="0" max="99" data-edit-counter="' + node.id + '" value="' +
          (v.value != null ? v.value : 0) + '" title="当前值">' +
          '<span class="dim">/</span>' +
          '<input type="number" min="1" max="99" data-edit-counter-max="' + node.id + '" value="' +
          (v.max != null ? v.max : node.max || 6) + '" title="上限">' +
          '</div></div>';
      }
      case 'dice': {
        const v = obj(val);
        if (node.mode === 'duality') {
          return '<div class="edit-row"><span>' + label + '</span><p class="dim">二元骰固定掷 2d12（希望 / 恐惧）。</p></div>';
        }
        return '<div class="edit-row"><span>' + label + '（骰式）</span>' +
          '<input data-edit-dice="' + node.id + '" value="' +
          RT.attr(v.expr || node.expr || '1d20') + '" placeholder="1d20 / 2d6+3"></div>';
      }
      case 'number':
        return '<label class="edit-row"><span>' + label + '</span>' +
          '<input type="text" inputmode="numeric" data-edit="' + node.id + '" value="' + RT.attr(val == null ? '' : val) + '"></label>';
      case 'features': {
        const list = arr(val);
        return '<div class="edit-features" data-features="' + node.id + '">' +
          '<div class="edit-features-head"><span>' + label + '</span>' +
          '<button class="mini" data-feature-add="' + node.id + '">＋</button></div>' +
          list.map(function (f, i) {
            return '<div class="edit-feature" data-fi="' + i + '">' +
              '<div class="edit-feature-top">' +
              '<input data-feature-name="' + node.id + '" data-fi="' + i + '" value="' + RT.attr(f.name || '') + '" placeholder="特性名">' +
              '<input data-feature-type="' + node.id + '" data-fi="' + i + '" value="' + RT.attr(f.type || '') + '" placeholder="类型">' +
              '<button class="mini danger" data-feature-del="' + node.id + '" data-fi="' + i + '">' + RT.icon('x', 12) + '</button>' +
              '</div>' +
              '<textarea rows="2" data-feature-desc="' + node.id + '" data-fi="' + i + '" placeholder="描述">' + esc(f.desc || '') + '</textarea>' +
              '<input data-feature-question="' + node.id + '" data-fi="' + i + '" value="' + RT.attr(f.question || '') + '" placeholder="特性问题（可选）">' +
              '</div>';
          }).join('') + '</div>';
      }
      case 'chips':
      case 'pairs':
      case 'stats': {
        const v = obj(val);
        return '<div class="edit-row-group"><span class="edit-group-label">' + label + '</span>' +
          (node.fields || []).map(function (f) {
            return '<label class="edit-row"><span>' + esc(f.label || f.id) + '</span>' +
              '<input type="text" data-edit-sub="' + node.id + ':' + f.id + '" value="' +
              RT.attr(v[f.id] == null ? '' : v[f.id]) + '"></label>';
          }).join('') + '</div>';
      }
      case 'heading':
        return '';
      default:
        return '<label class="edit-row"><span>' + label + '</span>' +
          '<input type="text" data-edit="' + node.id + '" value="' + RT.attr(val == null ? '' : val) + '"></label>';
    }
  }

  /** 弹窗编辑一张卡片 / 一条库条目的全部数据 */
  function editDialog(template, values, onSave, opts) {
    if (!template) { RT.toast('模板已删除', 'warn'); return; }
    const draft = JSON.parse(JSON.stringify(values || {}));
    const o = opts || {};
    const rows = [];
    RT.tpl.walk(template.layout, function (node) {
      if (node.type !== 'field') return;
      const html = fieldRow(node, draft[node.id]);
      if (html) rows.push(html);
    });

    const modal = RT.dialogs.open({
      title: (o.title || '编辑数据') + '：' + template.name,
      wide: true,
      body:
        '<p class="modal-note">这里的改动只作用于这一张卡 / 这一条库条目，不会改模板。</p>' +
        '<div class="edit-grid">' + rows.join('') + '</div>' +
        '<div class="modal-actions right">' +
        '<button class="btn ghost" data-cancel="1">取消</button>' +
        '<button class="btn gold" data-ok="1">保存</button></div>',
      onMount: function (m) {
        const bodyEl = m.querySelector('.modal-body');
        if (bodyEl && o.scrollTop) bodyEl.scrollTop = o.scrollTop;
        function setPath(path, val) {
          const parts = String(path).split(':');
          const id = parts[0];
          if (parts.length > 1) {
            if (!draft[id] || typeof draft[id] !== 'object') draft[id] = {};
            draft[id][parts[1]] = val;
          } else {
            draft[id] = val;
          }
        }
        m.addEventListener('input', function (e) {
          const el = e.target;
          if (el.hasAttribute('data-edit')) setPath(el.getAttribute('data-edit'), el.value);
          else if (el.hasAttribute('data-edit-sub')) setPath(el.getAttribute('data-edit-sub'), el.value);
          else if (el.hasAttribute('data-edit-tracker')) {
            const id = el.getAttribute('data-edit-tracker');
            if (!draft[id] || typeof draft[id] !== 'object') draft[id] = { max: 1, marked: 0 };
            const max = Math.max(1, Math.min(40, Number(el.value) || 1));
            draft[id].max = max;
            draft[id].marked = Math.min(draft[id].marked || 0, max);
          } else if (el.hasAttribute('data-edit-counter')) {
            const id = el.getAttribute('data-edit-counter');
            if (!draft[id] || typeof draft[id] !== 'object') draft[id] = { value: 0, max: 6 };
            draft[id].value = Math.max(0, Math.min(99, Number(el.value) || 0));
            draft[id].value = Math.min(draft[id].value, draft[id].max || 6);
          } else if (el.hasAttribute('data-edit-counter-max')) {
            const id = el.getAttribute('data-edit-counter-max');
            if (!draft[id] || typeof draft[id] !== 'object') draft[id] = { value: 0, max: 6 };
            const max = Math.max(1, Math.min(99, Number(el.value) || 6));
            draft[id].max = max;
            draft[id].value = Math.min(draft[id].value || 0, max);
          } else if (el.hasAttribute('data-edit-dice')) {
            const id = el.getAttribute('data-edit-dice');
            if (!draft[id] || typeof draft[id] !== 'object') draft[id] = { mode: 'normal', expr: '1d20', last: null };
            draft[id].expr = el.value;
          } else if (el.hasAttribute('data-feature-name') || el.hasAttribute('data-feature-type') ||
            el.hasAttribute('data-feature-desc') || el.hasAttribute('data-feature-question')) {
            const id = el.getAttribute('data-feature-name') || el.getAttribute('data-feature-type') ||
              el.getAttribute('data-feature-desc') || el.getAttribute('data-feature-question');
            const i = Number(el.getAttribute('data-fi'));
            if (!Array.isArray(draft[id])) draft[id] = [];
            const f = draft[id][i] || (draft[id][i] = { name: '', type: '', desc: '', question: '' });
            if (el.hasAttribute('data-feature-name')) f.name = el.value;
            else if (el.hasAttribute('data-feature-type')) f.type = el.value;
            else if (el.hasAttribute('data-feature-desc')) f.desc = el.value;
            else f.question = el.value;
          }
        });
        m.addEventListener('click', function (e) {
          const add = e.target.closest('[data-tracker-add]');
          const sub = e.target.closest('[data-tracker-sub]');
