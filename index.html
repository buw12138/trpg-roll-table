<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="离线随机生成器：建随机表、分组管理、掷表、组合生成 NPC，结果可收藏并写备注。数据保存在本地，可导出导入。">
<title>随机生成器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171c22'/%3E%3Cpath d='M16 4l10 6v12l-10 6-10-6V10z' fill='none' stroke='%23d8a854' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23d8a854'/%3E%3C/svg%3E">

<style>
/* ============================================================
 * 随机生成器 · 样式（泛奇幻 / 暗亮双主题）
 * ============================================================ */

:root {
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Source Han Serif SC", "Noto Serif SC", serif;
  --font-body: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  --font-scale: 1;
  --radius: 10px;
}

[data-theme="dark"] {
  --bg: #0d1013;
  --bg-elev: #12161a;
  --panel: #171c22;
  --panel-2: #1d242b;
  --line: #2b343d;
  --line-soft: #222a32;
  --text: #e9e3d5;
  --text-dim: #98a2ac;
  --gold: #d8a854;
  --gold-strong: #f0c477;
  --gold-bg: rgba(216, 168, 84, 0.12);
  --danger: #d2705c;
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
  --ring: rgba(216, 168, 84, 0.18);
  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #f3eee3;
  --bg-elev: #faf6ec;
  --panel: #fffdf8;
  --panel-2: #f7f1e4;
  --line: #ddd2bc;
  --line-soft: #e8dfcd;
  --text: #241e15;
  --text-dim: #6f6455;
  --gold: #8f5f1d;
  --gold-strong: #a06d24;
  --gold-bg: rgba(143, 95, 29, 0.1);
  --danger: #a8452f;
  --shadow: 0 16px 34px rgba(80, 60, 30, 0.16);
  --ring: rgba(143, 95, 29, 0.16);
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(1100px 600px at 12% -10%, var(--gold-bg), transparent 60%),
    radial-gradient(900px 500px at 110% 110%, var(--gold-bg), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: calc(15px * var(--font-scale));
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body.modal-open { overflow: hidden; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

.icon { flex: none; vertical-align: -2px; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.01em; margin: 0; }

code {
  font-family: var(--font-mono);
  font-size: 0.9em;
  background: var(--panel-2);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  padding: 1px 5px;
}

kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  color: var(--text-dim);
  background: rgba(0, 0, 0, 0.14);
}

.dim { color: var(--text-dim); }
.grow { flex: 1 1 auto; min-width: 0; }
.right { margin-left: auto; }
.spacer { flex: 1 1 auto; }
.pre { white-space: pre-wrap; }

/* ---------------- 顶栏 ---------------- */

#app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
  height: 100dvh;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--bg-elev), var(--bg));
  z-index: 30;
}

.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }

.brand-mark {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 9px;
  color: var(--gold-strong);
  background: var(--gold-bg);
  border: 1px solid var(--line);
  flex: none;
}

.brand-text { display: flex; flex-direction: column; min-width: 0; }

.setname {
  background: transparent;
  border: 1px solid transparent;
  padding: 2px 6px;
  margin-left: -6px;
  font-family: var(--font-display);
  font-size: 1.12em;
  font-weight: 600;
  border-radius: 6px;
  width: 260px;
  max-width: 46vw;
}

.setname:hover { border-color: var(--line-soft); }
.setname:focus { background: var(--panel); border-color: var(--line); box-shadow: none; }

.tagline { font-size: 0.72em; color: var(--text-dim); padding-left: 2px; letter-spacing: 0.04em; }

.top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

.font-ctl {
  display: flex; align-items: center; gap: 2px;
  border: 1px solid var(--line-soft);
  border-radius: 9px;
  padding: 2px;
  color: var(--text-dim);
  font-size: 0.75em;
}

.font-ctl .icon-btn { width: 26px; height: 26px; font-size: 0.9em; }

/* ---------------- 按钮 ---------------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 13px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font: inherit;
  font-size: 0.92em;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.14s, color 0.14s, background 0.14s, transform 0.08s;
}

.btn:hover { border-color: var(--gold); color: var(--gold-strong); }
.btn:active { transform: translateY(1px); }
.btn.gold {
  background: linear-gradient(180deg, var(--gold-strong), var(--gold));
  border-color: transparent;
  color: #241a06;
  font-weight: 600;
  box-shadow: 0 6px 16px -8px var(--gold);
}
[data-theme="light"] .btn.gold { color: #fffdf6; }
.btn.gold:hover { filter: brightness(1.05); color: #241a06; }
[data-theme="light"] .btn.gold:hover { color: #fffdf6; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.danger-solid { background: var(--danger); border-color: transparent; color: #fff; }
.btn.small { padding: 6px 10px; font-size: 0.85em; border-radius: 8px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 34px; height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line-soft);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: 0.14s;
}
.icon-btn:hover { color: var(--gold-strong); border-color: var(--gold); }

.mini {
  display: inline-grid;
  place-items: center;
  width: 24px; height: 24px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0;
}
.mini:hover { color: var(--gold-strong); background: var(--panel-2); border-color: var(--line); }
.mini.danger:hover { color: var(--danger); border-color: var(--danger); }

.menu-btn { display: none; }

/* ---------------- 布局 ---------------- */

.layout {
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr);
  min-height: 0;
}

.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--line);
  background: var(--bg-elev);
}

.main {
  min-height: 0;
  overflow-y: auto;
  padding: 22px 26px 48px;
}

/* ---------------- 侧栏 ---------------- */

.side-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
  padding: 10px 8px 6px;
}

.side-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 2px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 0.7em;
  cursor: pointer;
  transition: 0.14s;
}
.side-tab:hover { color: var(--text); background: var(--panel); }
.side-tab.active { color: var(--gold-strong); background: var(--gold-bg); border-color: var(--line-soft); }

.side-search {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 6px 10px 8px;
  padding: 0 9px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text-dim);
}
.side-search input { border: none; background: transparent; padding: 7px 0; flex: 1; font-size: 0.88em; }
.side-search input:focus { box-shadow: none; }

.side-tree-bar {
  display: flex;
  gap: 5px;
  margin: 0 10px 6px;
}

.tree-btn {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--line-soft);
  background: var(--panel);
  color: var(--text-dim);
  font: inherit;
  font-size: 0.72em;
  line-height: 1.2;
  cursor: pointer;
  transition: 0.14s;
}
.tree-btn:hover { color: var(--text); border-color: var(--gold-strong); }
.tree-btn:active { transform: translateY(1px); }

.side-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 2px 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.side-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.9em;
  text-align: left;
  cursor: pointer;
}
.side-item:hover { background: var(--panel); }
.side-item.active { background: var(--gold-bg); border-color: var(--line-soft); color: var(--gold-strong); }

.side-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-meta { font-size: 0.72em; color: var(--text-dim); font-family: var(--font-mono); }
.side-item.active .side-meta { color: var(--gold); }

/* 表行（可拖动 + 更多操作） */
.side-row {
  display: flex;
  align-items: center;
  border-radius: 8px;
  border: 1px solid transparent;
  min-width: 0;
}
.side-row:hover { background: var(--panel); }
.side-row.active { background: var(--gold-bg); border-color: var(--line-soft); }
.side-row.dragging-row { opacity: 0.4; }

.side-main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 2px 7px 10px;
  border: none;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.9em;
  text-align: left;
  cursor: pointer;
}
.side-row.active .side-main { color: var(--gold-strong); }

.side-more { opacity: 0; flex: none; margin-right: 4px; }
.side-row:hover .side-more, .folder-head:hover .side-more { opacity: 1; }
@media (hover: none) { .side-more { opacity: 1; } }

/* 分组 */
.folder-block { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }

.folder-head {
  display: flex;
  align-items: center;
  gap: 2px;
  border-radius: 8px;
  border: 1px solid transparent;
}
.folder-head:hover { background: var(--panel); }
.folder-head.drop-hover { background: var(--gold-bg); border-color: var(--gold); }

.folder-toggle {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 4px 5px 8px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 0.76em;
  letter-spacing: 0.03em;
  text-align: left;
  cursor: pointer;
  border-radius: 7px;
}
.folder-toggle:hover { color: var(--text); }
.folder-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-count { margin-left: auto; font-family: var(--font-mono); font-size: 0.9em; opacity: 0.65; }

.folder-head.plain {
  display: flex;
  gap: 6px;
  padding: 6px 8px;
  font-size: 0.76em;
  color: var(--text-dim);
}

.folder-items {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-left: 11px;
  padding-left: 7px;
  border-left: 1px solid var(--line-soft);
}
.folder-children {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-left: 11px;
  padding-left: 7px;
  border-left: 1px solid var(--line-soft);
}
.folder-block.collapsed .folder-items,
.folder-block.collapsed .folder-children { display: none; }

.folder-head[draggable="true"] { cursor: grab; }
.folder-head.dragging-row { opacity: 0.4; }

.folder-empty {
  margin: 2px 0;
  padding: 7px 8px;
  border: 1px dashed var(--line-soft);
  border-radius: 7px;
  font-size: 0.72em;
  color: var(--text-dim);
}

.side-new-row { display: flex; gap: 6px; margin: 8px 10px 4px; }
.side-new-row .side-new { margin: 0; flex: 1 1 auto; }
.side-new.compact { flex: 0 0 auto; padding: 9px 10px; }

.side-empty, .side-summary, .side-tip { padding: 12px; font-size: 0.82em; color: var(--text-dim); }
.side-summary { padding: 8px 12px; }
.side-tip { line-height: 1.6; }

.side-new {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin: 8px 10px 4px;
  padding: 9px;
  border-radius: 9px;
  border: 1px dashed var(--line);
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 0.85em;
  cursor: pointer;
}
.side-new:hover { color: var(--gold-strong); border-color: var(--gold); background: var(--gold-bg); }

.side-foot { padding: 8px 14px 12px; font-size: 0.7em; }

/* ---------------- 通用视图 ---------------- */

.view { display: flex; flex-direction: column; gap: 14px; max-width: 1280px; }

.view-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.head-main { display: flex; flex-direction: column; gap: 6px; flex: 1 1 320px; min-width: 0; }
.head-actions { display: flex; gap: 6px; flex: none; padding-top: 4px; }

.title-input {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 3px 8px;
  margin-left: -8px;
  font-family: var(--font-display);
  font-size: 1.6em;
  font-weight: 600;
  width: 100%;
}
.title-input:hover { border-color: var(--line-soft); }
.title-input:focus { background: var(--panel); border-color: var(--line); box-shadow: none; }
.title-input.invalid { border-color: var(--danger); }

.field-error {
  color: var(--danger);
  font-size: 0.76em;
  padding: 2px 0 0 2px;
  line-height: 1.5;
}

.page-title { font-size: 1.5em; padding: 4px 0; }

.meta-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.82em; color: var(--text-dim); }
.meta-field { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.meta-field > span { flex: none; white-space: nowrap; }
.meta-field input { padding: 5px 8px; font-size: 0.95em; border-color: var(--line-soft); }
.meta-field select { padding: 5px 8px; font-size: 0.95em; border-color: var(--line-soft); max-width: 150px; }
.meta-field.grow { flex: 1 1 220px; min-width: 160px; }
.meta-field.grow input { width: 100%; }
.meta-field input[data-act="table-dice"] { width: 118px; }
.count { font-family: var(--font-mono); font-size: 0.9em; color: var(--text-dim); white-space: nowrap; }

.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.inline-field { display: flex; align-items: center; gap: 5px; font-size: 0.82em; color: var(--text-dim); }
.inline-field input { width: 54px; padding: 6px 8px; text-align: center; }

.hint { font-size: 0.78em; color: var(--text-dim); padding: 2px 2px 0; line-height: 1.7; }

.panel {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 12px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.panel-head { display: flex; align-items: baseline; gap: 10px; font-size: 0.88em; flex-wrap: wrap; }
.panel-head .dim { font-size: 0.86em; }
.pad { padding: 8px 2px; }

.split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.9fr); gap: 18px; align-items: start; }
.split-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.split-side { position: sticky; top: 0; min-width: 0; }

/* ---------------- 条目 ---------------- */

.entry-list {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.entry-row {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) 62px auto;
  align-items: center;
  gap: 7px;
  padding: 3px 6px;
  border-radius: 7px;
}
.entry-row:hover { background: var(--panel-2); }
.entry-row.data-dice { grid-template-columns: 26px minmax(0, 1fr) 62px auto auto; }

.entry-idx { font-family: var(--font-mono); font-size: 0.7em; color: var(--text-dim); text-align: center; }

.entry-row input { border-color: transparent; background: transparent; padding: 6px 8px; }
.entry-row input:hover { border-color: var(--line-soft); background: var(--bg-elev); }
.entry-row input:focus { background: var(--bg-elev); border-color: var(--gold); }

.entry-weight { text-align: center; font-family: var(--font-mono); font-size: 0.82em; color: var(--text-dim); }

.range-wrap { display: flex; align-items: center; gap: 2px; }
.entry-range { width: 48px; text-align: center; font-family: var(--font-mono); font-size: 0.8em; }
.dash { color: var(--text-dim); font-size: 0.8em; }

.row-actions { display: flex; gap: 1px; opacity: 0; transition: opacity 0.12s; }
.entry-row:hover .row-actions, .field-row:hover .row-actions { opacity: 1; }
@media (hover: none) { .row-actions { opacity: 1; } }

/* ---------------- 组合字段 ---------------- */

.field-list { display: flex; flex-direction: column; gap: 3px; }

.field-row {
  display: grid;
  grid-template-columns: 22px minmax(96px, 1.1fr) minmax(80px, 1fr) 52px 52px auto;
  gap: 6px;
  align-items: center;
  padding: 4px 5px;
  border-radius: 7px;
}
.field-row:hover { background: var(--panel-2); }
.field-row input, .field-row select { padding: 6px 8px; font-size: 0.88em; border-color: var(--line-soft); background: var(--bg-elev); }
.field-row .narrow { text-align: center; font-family: var(--font-mono); font-size: 0.82em; }
.field-idx { font-family: var(--font-mono); font-size: 0.7em; color: var(--text-dim); text-align: center; }

.tokens { display: flex; flex-wrap: wrap; gap: 5px; }
.token {
  padding: 3px 8px;
  border-radius: 20px;
  border: 1px solid var(--line-soft);
  background: var(--gold-bg);
  color: var(--gold-strong);
  font-family: var(--font-mono);
  font-size: 0.75em;
  cursor: pointer;
}
.token:hover { border-color: var(--gold); }

/* ---------------- 结果卡 ---------------- */

.result-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    linear-gradient(160deg, var(--gold-bg), transparent 42%),
    var(--panel);
  box-shadow: var(--shadow);
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 180px;
}
.result-card.placeholder { box-shadow: none; background: var(--panel); }

.result-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.result-title {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-display);
  font-size: 0.86em;
  letter-spacing: 0.08em;
  color: var(--gold-strong);
  text-transform: uppercase;
}
.seed { font-family: var(--font-mono); font-size: 0.68em; color: var(--text-dim); }

.result-body { min-height: 56px; display: flex; align-items: center; }
.result-text { font-size: 1.12em; line-height: 1.75; word-break: break-word; }
.result-text.pre { white-space: pre-wrap; }
.result-body:has(.result-list) { align-items: flex-start; }

.result-list { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; font-size: 1.02em; }
.result-list li::marker { color: var(--gold); font-family: var(--font-mono); font-size: 0.8em; }

.result-empty { color: var(--text-dim); font-size: 0.9em; line-height: 2; }

.dice-detail {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.74em;
  color: var(--text-dim);
  border-top: 1px dashed var(--line);
  padding-top: 8px;
}

.warnings { display: flex; flex-direction: column; gap: 4px; }
.warning {
  display: flex; align-items: flex-start; gap: 6px;
  font-size: 0.78em;
  color: var(--danger);
  background: rgba(210, 112, 92, 0.09);
  border: 1px solid rgba(210, 112, 92, 0.24);
  border-radius: 7px;
  padding: 5px 8px;
}

.result-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.result-actions.wrap { flex-wrap: wrap; }

.chips { display: flex; flex-direction: column; gap: 5px; }
.chip {
  display: grid;
  grid-template-columns: 58px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 5px 8px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: var(--bg-elev);
  font-size: 0.82em;
}
.chip.locked { border-color: var(--gold); background: var(--gold-bg); }
.chip-label { color: var(--text-dim); font-size: 0.9em; }
.chip-value { overflow-wrap: anywhere; }
.chip-actions { display: flex; gap: 1px; }

.save-entry { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 0.78em; padding-top: 4px; border-top: 1px dashed var(--line); }
.save-entry select { padding: 4px 8px; font-size: 0.95em; }

/* ---------------- 批量粘贴 ---------------- */

.bulk-panel {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 12px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.bulk-panel[data-open="false"] { display: none; }
.bulk-head { display: flex; align-items: baseline; gap: 10px; font-size: 0.82em; flex-wrap: wrap; }
.bulk-actions { display: flex; gap: 7px; }

.textarea {
  width: 100%;
  resize: vertical;
  font-family: var(--font-body);
  line-height: 1.7;
  min-height: 70px;
  background: var(--bg-elev);
}
.textarea.mono { font-family: var(--font-mono); font-size: 0.78em; line-height: 1.55; }

/* ---------------- 收藏 / 历史 ---------------- */

.fav-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.fav-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(160deg, var(--gold-bg), transparent 55%), var(--panel);
  padding: 13px 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.fav-text {
  font-size: 0.96em; line-height: 1.72;
  max-height: 17.4em;
  overflow-y: auto;
  overflow-wrap: anywhere;
  padding-right: 4px;
}
.fav-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.72em; color: var(--text-dim); }
.fav-actions { display: flex; gap: 5px; align-items: center; }

.fav-note {
  width: 100%;
  min-height: 2.6em;
  field-sizing: content;
  background: var(--bg-elev);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  padding: 7px 9px;
  font-size: 0.8em;
  line-height: 1.65;
  resize: vertical;
}
.fav-note:focus { border-color: var(--gold); }
.fav-note::placeholder { color: var(--text-dim); opacity: 0.75; }

.history-list { display: flex; flex-direction: column; gap: 7px; }
.history-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 11px;
  align-items: start;
  padding: 10px 12px;
  border: 1px solid var(--line-soft);
  border-radius: 9px;
  background: var(--panel);
}
.history-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.history-top { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; font-size: 0.86em; }
.history-text {
  font-size: 0.82em;
  color: var(--text-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.history-actions { display: flex; gap: 1px; }

.badge {
  font-size: 0.68em;
  padding: 2px 7px;
  border-radius: 20px;
  border: 1px solid var(--line);
  color: var(--text-dim);
  white-space: nowrap;
  margin-top: 2px;
}
.badge.combo { color: var(--gold-strong); border-color: var(--gold); background: var(--gold-bg); }

/* ---------------- 空状态 ---------------- */

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 12px;
  padding: 12vh 20px;
  color: var(--text-dim);
}
.empty-mark {
  width: 76px; height: 76px;
  display: grid; place-items: center;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--gold-bg);
  color: var(--gold-strong);
  margin-bottom: 4px;
}
.empty h2 { color: var(--text); font-size: 1.3em; }
.empty p { margin: 0; max-width: 30em; line-height: 1.8; font-size: 0.9em; }
.empty-actions { display: flex; gap: 9px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
.small-empty { padding: 32px 20px; border: 1px dashed var(--line); border-radius: var(--radius); }

/* ---------------- 弹窗 ---------------- */

#modal-root:empty { display: none; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(2px);
  z-index: 60;
}

.modal {
  position: fixed;
  z-index: 61;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 32px));
  max-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.modal.wide { width: min(720px, calc(100vw - 32px)); }

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line);
}
.modal-head h3 { font-size: 1.02em; }

.modal-body { padding: 14px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.modal-note { margin: 0; font-size: 0.85em; color: var(--text-dim); line-height: 1.75; }
.modal-note.pre { white-space: pre-wrap; color: var(--text); }
.modal-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.modal-actions.right { justify-content: flex-end; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 8px; flex-wrap: wrap; }
.tabs .tab {
  padding: 6px 13px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 0.86em;
  cursor: pointer;
}
.tabs .tab:hover { color: var(--text); background: var(--panel); }
.tabs .tab.active { color: var(--gold-strong); background: var(--gold-bg); border-color: var(--line-soft); }

.file-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.85em; }
.file-btn { position: relative; }
.radio-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.85em; color: var(--text-dim); }
.radio-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.radio-row input { accent-color: var(--gold); }

.snap-list { display: flex; flex-direction: column; gap: 6px; }
.snap-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  font-size: 0.82em;
}

/* ---------------- 命令面板 ---------------- */

.palette-root { position: fixed; inset: 0; z-index: 70; }
.palette-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); }

.palette {
  position: absolute;
  top: 12vh;
  left: 50%;
  transform: translateX(-50%);
  width: min(560px, calc(100vw - 28px));
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 13px;
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.palette-input {
  display: flex; align-items: center; gap: 9px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  color: var(--text-dim);
}
.palette-input input { flex: 1; border: none; background: transparent; padding: 2px 0; font-size: 1em; }
.palette-input input:focus { box-shadow: none; }

#palette-list { max-height: 52vh; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }

.palette-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.9em;
  text-align: left;
  cursor: pointer;
}
.palette-item:hover, .palette-item.active { background: var(--gold-bg); border-color: var(--line-soft); }
.pi-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi-sub { font-size: 0.78em; color: var(--text-dim); font-family: var(--font-mono); }

.palette-empty { padding: 18px; text-align: center; color: var(--text-dim); font-size: 0.85em; }
.palette-foot { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 0.72em; color: var(--text-dim); display: flex; gap: 5px; align-items: center; }

/* ---------------- 弹出菜单 ---------------- */

.menu-pop {
  position: fixed;
  z-index: 75;
  min-width: 184px;
  max-width: 260px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 5px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  max-height: 70vh;
  overflow-y: auto;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.85em;
  text-align: left;
  cursor: pointer;
}
.menu-item:hover { background: var(--gold-bg); color: var(--gold-strong); }
.menu-item.danger { color: var(--danger); }
.menu-item.danger:hover { background: rgba(210, 112, 92, 0.12); }
.mi-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi-dot { width: 14px; height: 14px; flex: none; }
.menu-sep { height: 1px; background: var(--line-soft); margin: 4px 2px; }

/* ---------------- 提示条 ---------------- */

#toast-root {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 7px;
  align-items: center;
  pointer-events: none;
}

.toast {
  padding: 9px 16px;
  border-radius: 9px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  font-size: 0.85em;
  opacity: 0;
  transform: translateY(8px);
  transition: 0.22s;
  max-width: 82vw;
}
.toast.in { opacity: 1; transform: none; }
.toast.warn { border-color: var(--danger); color: var(--danger); }

/* ---------------- 拖拽 ---------------- */

.dragging::after {
  content: "松开以导入表组 JSON";
  position: fixed;
  inset: 14px;
  z-index: 90;
  border: 2px dashed var(--gold);
  border-radius: 16px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 1.1em;
  color: var(--gold-strong);
  pointer-events: none;
}

/* ---------------- 移动端 ---------------- */

.mobile-tabs { display: none; }
.sidebar-backdrop { display: none; }

@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed;
    z-index: 55;
    top: 0; bottom: 0; left: 0;
    width: 278px;
    transform: translateX(-102%);
    transition: transform 0.22s ease;
    box-shadow: var(--shadow);
    padding-top: env(safe-area-inset-top);
  }
  body.sidebar-open .sidebar { transform: none; }
  body.sidebar-open .sidebar-backdrop {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 54;
    background: rgba(0, 0, 0, 0.45);
  }
  .menu-btn { display: inline-grid; }
  .main { padding: 16px 14px calc(84px + env(safe-area-inset-bottom)); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .split-side { position: static; }
  .mobile-tabs {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(58px, 1fr);
    overflow-x: auto;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 45;
    background: color-mix(in srgb, var(--bg-elev) 94%, transparent);
    border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter: blur(8px);
  }
  .mtab {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 2px;
    border: none; background: transparent;
    color: var(--text-dim);
    font: inherit; font-size: 0.64em;
    cursor: pointer;
    border-radius: 8px;
  }
  .mtab.active { color: var(--gold-strong); }
  .top-actions .btn { padding: 7px 10px; }
  .tagline { display: none; }
  .entry-row { grid-template-columns: 22px minmax(0, 1fr) 54px auto; }
  .entry-row.data-dice { grid-template-columns: 22px minmax(0, 1fr) 50px auto; }
  .entry-row.data-dice .range-wrap { grid-column: 2 / 3; }
  .field-row { grid-template-columns: 18px minmax(0, 1fr) 46px 46px auto; }
  .field-row select { grid-column: 2 / -1; }
  .field-row input[data-act="field-label"] { grid-column: 2 / 3; }
  .font-ctl { display: none; }
  .title-input { font-size: 1.35em; }
}

@media (max-width: 560px) {
  .topbar { padding: 8px 10px; gap: 8px; }
  .setname { width: 44vw; font-size: 1em; }
  .brand-mark { display: none; }
  .top-actions { gap: 6px; }
  .top-actions > button[data-act="palette"] { display: none; }
  .top-actions .btn span { display: none; }
  .top-actions .btn { padding: 8px; }
  .toolbar { gap: 6px; }
  .btn { padding: 7px 11px; }
  .chip { grid-template-columns: 50px minmax(0, 1fr) auto; }
  .result-text { font-size: 1.04em; }
  .fav-list { grid-template-columns: 1fr; }
}

@media print {
  .topbar, .sidebar, .mobile-tabs, .toolbar, .head-actions, .side-foot, .result-actions, .save-entry, .bulk-panel, .menu-pop { display: none !important; }
  body { background: #fff; color: #000; overflow: visible; }
  #app { display: block; height: auto; }
  .layout { display: block; }
  .main { overflow: visible; padding: 0; }
  .split-side { position: static; }
  .result-card { box-shadow: none; border-color: #ccc; }
}

/* ============================================================
 * 战役 / 笔记 / 记录表 / 规则速查
 * ============================================================ */

/* --- 通用小件 --- */
.chip-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text-dim);
  font: inherit; font-size: 0.82em;
  cursor: pointer; white-space: nowrap;
}
.chip-btn:hover { color: var(--text); border-color: var(--gold); }
.chip-btn.active { color: var(--gold-strong); border-color: var(--gold); background: var(--gold-bg); }
.empty.small-empty { padding: 34px 16px; }
.empty.small-empty h2 { font-size: 1.05em; }
.tablewrap { overflow-x: auto; }
.flash { animation: rt-flash 0.9s ease-out; }
@keyframes rt-flash {
  0% { background: var(--gold-bg); box-shadow: 0 0 0 3px var(--gold-bg); }
  100% { background: transparent; box-shadow: none; }
}

/* --- 战役外壳 --- */
.camp-view { gap: 12px; }
.camp-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.camp-head-main { display: flex; flex-direction: column; gap: 7px; flex: 1 1 320px; min-width: 0; }
.camp-switch { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.camp-switch label { font-size: 0.78em; letter-spacing: 0.08em; }
.camp-switch select {
  font-family: var(--font-display);
  font-size: 1.28em;
  padding: 5px 10px;
  max-width: min(52vw, 460px);
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.camp-switch select:hover { border-color: var(--gold); }
.camp-tabs, .sheets-tabs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line-soft); padding-bottom: 8px; }
.camp-tab { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--text-dim); font: inherit; font-size: 0.94em; cursor: pointer; }
.camp-tab:hover { color: var(--text); background: var(--panel); }
.camp-tab.active { color: var(--gold-strong); background: var(--gold-bg); border-color: var(--line-soft); }
.camp-body { min-height: 240px; }
.camp-empty { max-width: 640px; margin: 40px auto; text-align: center; }
.camp-empty h2 { margin: 6px 0 10px; font-family: var(--font-display); }
.camp-empty p { color: var(--text-dim); line-height: 1.75; margin: 0 0 8px; }
.camp-empty-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.side-camp { padding: 8px 12px 2px; font-family: var(--font-display); font-size: 0.95em; color: var(--gold-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --- 笔记 --- */
.notes-view { gap: 10px; }
.notes-add { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.notes-add select, .notes-add input {
  font: inherit; font-size: 0.9em;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
}
.notes-add input { flex: 1 1 220px; min-width: 160px; }
.notes-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.notes-search {
  flex: 1 1 200px; min-width: 150px;
  font: inherit; font-size: 0.86em;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
}
.notes-list { display: flex; flex-direction: column; gap: 10px; }
.note-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 10px 12px; }
.note-card.pinned { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }
.note-head { display: flex; align-items: center; gap: 8px; }
.note-title {
  flex: 1 1 auto; min-width: 0;
  font-family: var(--font-display); font-size: 1.05em; font-weight: 600;
  background: transparent; border: 1px solid transparent; border-radius: 6px;
  color: var(--text); padding: 3px 6px;
}
.note-title:hover { border-color: var(--line-soft); }
.note-title:focus { background: var(--panel-2); border-color: var(--line); outline: none; }
.note-kind { font-size: 0.74em; white-space: nowrap; font-family: var(--font-mono); }
.note-items { list-style: none; margin: 6px 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.note-item { display: grid; grid-template-columns: 20px minmax(0, 1fr) 22px; align-items: center; gap: 6px; padding: 1px 2px; border-radius: 6px; }
.note-item:hover { background: var(--panel-2); }
.note-item input[type="checkbox"] { accent-color: var(--gold); cursor: pointer; }
.note-item-text { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--text); font: inherit; font-size: 0.92em; padding: 3px 5px; }
.note-item-text:hover { border-color: var(--line-soft); }
.note-item-text:focus { background: var(--panel-2); border-color: var(--line); outline: none; }
.note-item.done .note-item-text { color: var(--text-dim); text-decoration: line-through; }
.note-body { width: 100%; margin-top: 6px; resize: vertical; font: inherit; font-size: 0.88em; line-height: 1.7; background: transparent; color: var(--text-dim); border: 1px dashed var(--line-soft); border-radius: 8px; padding: 7px 9px; }
.note-body:focus { color: var(--text); background: var(--panel-2); border-color: var(--line); outline: none; }
.side-row.note-side.pinned .side-main { color: var(--gold-strong); }

/* --- 记录表 --- */
.sheets-view { gap: 10px; }
.sheet-body { display: flex; flex-direction: column; gap: 10px; }
.sheet-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sheet-toolbar select, .sheet-toolbar input {
  font: inherit; font-size: 0.85em; background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px;
}
.sheet-meta { display: flex; gap: 12px; flex-wrap: wrap; }
.sheet-meta label { display: flex; align-items: center; gap: 6px; font-size: 0.8em; color: var(--text-dim); }
.sheet-meta input { font: inherit; font-size: 1em; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; }
.sheet-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.sheet-grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.sheet-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sheet-field { display: flex; flex-direction: column; gap: 4px; font-size: 0.8em; color: var(--text-dim); }
.sheet-field input, .sheet-field textarea {
  font: inherit; font-size: 1.18em; line-height: 1.65;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; resize: vertical;
}
.sheet-field input:focus, .sheet-field textarea:focus { border-color: var(--gold); outline: none; }
.sheet-sub { font-family: var(--font-display); font-size: 0.98em; color: var(--gold-strong); margin-top: 6px; }
.front-card { border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 8px; padding: 10px 12px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
.front-head { font-size: 0.8em; letter-spacing: 0.1em; color: var(--text-dim); }
.npc-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.npc-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
.npc-row label, .npc-note { display: flex; flex-direction: column; gap: 4px; font-size: 0.78em; color: var(--text-dim); }
.npc-card input, .npc-card textarea { font: inherit; font-size: 1.2em; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; resize: vertical; }
.sheet-table { width: 100%; border-collapse: collapse; font-size: 0.86em; }
.sheet-table th { text-align: left; font-size: 0.78em; color: var(--text-dim); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.sheet-table td { padding: 3px 4px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.sheet-table input, .sheet-table textarea { width: 100%; font: inherit; background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 6px; padding: 4px 5px; resize: vertical; }
.sheet-table input:hover, .sheet-table textarea:hover { border-color: var(--line-soft); }
.sheet-table input:focus, .sheet-table textarea:focus { background: var(--panel-2); border-color: var(--line); outline: none; }
.row-end { width: 28px; text-align: right; }

/* --- 规则速查 --- */
.main.view-rules { overflow: hidden; padding-bottom: 22px; }
.rules-view { height: 100%; min-height: 0; gap: 12px; }
.rules-sticky {
  position: relative; z-index: 8; flex: 0 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  margin: -6px -8px 0; padding: 8px;
  background: var(--bg); border-bottom: 1px solid var(--line-soft);
}
.rules-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.rules-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rules-bar input { flex: 1 1 220px; min-width: 160px; font: inherit; font-size: 0.88em; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.rules-content { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.rules-content.has-results {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(270px, 340px);
  gap: 16px; align-items: start;
}
.rules-content.has-results .rules-doc { max-width: none; }
.rules-search-results {
  position: sticky; top: 0; max-height: 100%; overflow-y: auto;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-elev);
}
.rules-results-head {
  position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; gap: 8px;
  padding: 10px 12px; background: var(--bg-elev); border-bottom: 1px solid var(--line-soft);
  font-size: 0.84em;
}
.rules-results-head span, .rules-results-more { color: var(--text-dim); }
.rules-results-list { display: flex; flex-direction: column; padding: 5px; gap: 3px; }
.rules-hit {
  display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 8px 9px;
  border: 1px solid transparent; border-radius: 8px; background: transparent;
  color: var(--text); font: inherit; text-align: left; cursor: pointer;
}
.rules-hit:hover { border-color: var(--line); background: var(--panel); }
.rules-hit-head { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--gold-strong); font-size: 0.76em; }
.rules-hit-preview { color: var(--text-dim); font-size: 0.78em; line-height: 1.55; overflow-wrap: anywhere; }
.rules-results-empty, .rules-results-more { padding: 16px 12px; font-size: 0.8em; line-height: 1.6; }
.rules-doc [id] { scroll-margin-top: 12px; }
.rules-empty { max-width: 680px; margin: 40px auto; text-align: center; }
.rules-empty h2 { font-family: var(--font-display); margin: 6px 0 10px; }
.rules-empty p { color: var(--text-dim); line-height: 1.75; margin: 0 0 8px; }
.rules-doc {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 22px 26px;
  max-width: 900px;
  font-size: 0.95em;
  line-height: 1.85;
}
.md-h { font-family: var(--font-display); line-height: 1.4; margin: 1.1em 0 0.45em; scroll-margin-top: 12px; }
.md-h1 { font-size: 1.45em; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.md-h2 { font-size: 1.2em; color: var(--gold-strong); }
.md-h3 { font-size: 1.05em; }
.md-h4 { font-size: 0.98em; color: var(--text-dim); }
.md-p { margin: 0.5em 0; }
.md-ul, .md-ol { margin: 0.45em 0; padding-left: 1.5em; }
.md-ul li, .md-ol li { margin: 0.2em 0; }
.md-quote { margin: 0.7em 0; padding: 6px 12px; border-left: 3px solid var(--gold); background: var(--gold-bg); color: var(--text-dim); border-radius: 0 6px 6px 0; }
.md-hr { border: none; border-top: 1px solid var(--line); margin: 1.2em 0; }
.md-code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.86em; }
.md-tablewrap { overflow-x: auto; margin: 0.7em 0; }
.md-table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
.md-table th { text-align: left; border-bottom: 1px solid var(--text-dim); padding: 5px 9px; font-size: 0.92em; color: var(--text-dim); }
.md-table td { border-bottom: 1px solid var(--line-soft); padding: 5px 9px; vertical-align: top; }
.md-mark { background: var(--gold-bg); color: var(--gold-strong); border-radius: 3px; padding: 0 1px; }
.side-toc-head { display: flex; flex: 0 0 auto; justify-content: space-between; gap: 8px; padding: 10px 12px 2px; font-size: 0.72em; letter-spacing: 0.12em; color: var(--text-dim); }
.side-toc-head span { font-family: var(--font-mono); letter-spacing: 0; }
.side-toc {
  display: block; flex: 0 0 auto; width: calc(100% - 12px); margin: 1px 6px;
  text-align: left; padding: 4px 8px;
  border: 1px solid transparent; border-radius: 6px;
  background: transparent; color: var(--text-dim);
  font: inherit; font-size: 0.8em; line-height: 1.45;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  cursor: pointer;
}
.side-toc:hover { color: var(--text); background: var(--panel); border-color: var(--line-soft); }
.side-toc.lv1 { color: var(--text); font-weight: 600; }
.side-toc.lv2 { padding-left: 16px; }
.side-toc.lv3 { padding-left: 26px; font-size: 0.76em; }
.side-toc-group { flex: 0 0 auto; margin: 0; }
.side-toc-group > summary { list-style: none; position: relative; padding-right: 20px; }
.side-toc-group > summary::-webkit-details-marker { display: none; }
.side-toc-group > summary::after {
  content: '›'; position: absolute; right: 7px; top: 50%;
  transform: translateY(-50%); color: var(--text-dim); transition: transform 0.14s;
}
.side-toc-group[open] > summary::after { transform: translateY(-50%) rotate(90deg); }
.side-toc-children { margin-left: 8px; border-left: 1px solid var(--line-soft); }

@media (max-width: 1100px) {
  .rules-content.has-results { display: flex; flex-direction: column; }
  .rules-search-results { position: static; order: -1; width: 100%; max-height: 42vh; }
}
@media (max-width: 980px) {
  .main.view-rules { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
}

/* --- 工作区弹窗 --- */
.ws-stat { display: flex; gap: 14px; flex-wrap: wrap; padding: 4px 2px 10px; font-size: 0.82em; color: var(--text-dim); }
.ws-stat strong { color: var(--gold-strong); font-family: var(--font-mono); }

/* --- 响应式 / 打印 --- */
@media (max-width: 760px) {
  .sheet-grid, .sheet-grid.two, .sheet-grid.three { grid-template-columns: minmax(0, 1fr); }
  .npc-row { grid-template-columns: 1fr; }
  .rules-doc { padding: 14px 14px 20px; }
  .camp-switch select { max-width: 60vw; font-size: 1.1em; }
}

@media print {
  .camp-tabs, .camp-head, .sheets-tabs, .sheet-toolbar, .notes-bar, .notes-add, .rules-bar, .rules-head, .rules-search-results, .side-camp { display: none !important; }
  .main.view-rules { overflow: visible; padding-bottom: 0; }
  .rules-view { height: auto; }
  .rules-sticky { position: static; margin: 0; padding: 0; border: 0; }
  .rules-content { overflow: visible; }
  .rules-content.has-results { display: block; }
  .rules-doc, .sheet-body { border: none; padding: 0; max-width: none; }
  .md-table, .sheet-table { font-size: 9pt; }
  .npc-card, .front-card, .note-card { break-inside: avoid; }
}
/* ============================================================
 * 记录表：模板渲染 / 模板编辑器
 * ============================================================ */
.sheet-title {
  font-family: var(--font-display);
  font-size: 1.25em;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--text);
  padding: 4px 8px;
  max-width: min(100%, 520px);
}
.sheet-title:hover { border-color: var(--line-soft); }
.sheet-title:focus { background: var(--panel); border-color: var(--line); outline: none; }

.sx-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.sx-item, .sx-field, .sx-section { min-width: 0; }
.sx-w-full { grid-column: 1 / -1; }
.sx-field { display: flex; flex-direction: column; gap: 4px; font-size: 0.8em; color: var(--text-dim); }
.sx-field > span { line-height: 1.5; }
.sx-field input, .sx-field select, .sx-field textarea {
  font: inherit; font-size: 1.18em; line-height: 1.65;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; resize: vertical;
}
.sx-field input:focus, .sx-field select:focus, .sx-field textarea:focus { border-color: var(--gold); outline: none; }
.sx-section {
  grid-column: 1 / -1;
  font-family: var(--font-display);
  font-size: 1em;
  color: var(--gold-strong);
  border-bottom: 1px solid var(--line);
  padding: 8px 0 4px;
  margin-top: 6px;
}
.sx-itemhd { font-size: 0.78em; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 5px; }
.sx-check { display: flex; align-items: center; gap: 8px; font-size: 0.9em; color: var(--text); }
.sx-check input { width: auto; }
.sx-rows { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
.sx-rowline { display: grid; grid-template-columns: 20px minmax(0, 1fr) 24px; gap: 6px; align-items: center; }
.sx-rowline input[type="text"] { width: 100%; font: inherit; font-size: 0.92em; background: var(--panel); color: var(--text); border: 1px solid var(--line-soft); border-radius: 6px; padding: 5px 7px; }
.sx-repeat { display: flex; flex-direction: column; gap: 8px; }
.sx-repcard { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 8px 10px; }
.sx-rephead { display: flex; align-items: center; justify-content: space-between; font-size: 0.76em; margin-bottom: 6px; }
.sx-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.sx-grid .sx-w-full { grid-column: 1 / -1; }
.sx-table input[type="text"], .sx-table input[type="number"] { min-width: 70px; }
.sx-cell-check { text-align: center; width: 34px; }

/* --- 模板选择 / 管理 --- */
.tpl-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin: 8px 0; }
.tpl-card { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel);
  color: var(--text); font: inherit; cursor: pointer; }
.tpl-card:hover { border-color: var(--gold); background: var(--gold-bg); }
.tpl-name { font-family: var(--font-display); font-size: 1em; }
.tpl-meta { font-size: 0.74em; color: var(--text-dim); }
.tpl-manage { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.tpl-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--panel); }
.tpl-info { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0; }
.tpl-info span { font-size: 0.74em; }
.tpl-acts { display: flex; gap: 4px; flex-wrap: wrap; }

/* --- 模板编辑器 --- */
.sb-wrap { display: flex; flex-direction: column; gap: 10px; }
.sb-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sb-top input { font: inherit; font-size: 0.95em; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.sb-palette { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px dashed var(--line); border-radius: 9px; background: var(--panel-2); }
.sb-chip { font: inherit; font-size: 0.84em; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel); color: var(--text); cursor: grab; }
.sb-chip:hover { border-color: var(--gold); color: var(--gold-strong); }
.sb-tip { font-size: 0.74em; align-self: center; }
.sb-canvas { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow: auto; padding: 2px; }
.sb-empty { padding: 28px; text-align: center; color: var(--text-dim); border: 1px dashed var(--line); border-radius: 9px; font-size: 0.86em; }
.sb-card { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
.sb-card.dragging { opacity: 0.45; }
.sb-card.drop-hover { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-bg); }
.sb-hd { display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-bottom: 1px solid var(--line-soft); }
.sb-type { font-size: 0.72em; color: var(--gold-strong); border: 1px solid var(--line-soft); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.sb-label { flex: 1 1 auto; min-width: 80px; font: inherit; font-size: 0.88em; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--text); padding: 3px 6px; }
.sb-label:hover { border-color: var(--line-soft); }
.sb-label:focus { background: var(--panel-2); border-color: var(--line); outline: none; }
.sb-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.sb-sub { font-size: 0.74em; letter-spacing: 0.08em; color: var(--text-dim); margin-top: 2px; }
.sb-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sb-line input, .sb-line select, .sb-opts { font: inherit; font-size: 0.84em; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; }
.sb-line input[type="number"] { width: 62px; }
.sb-opts { width: 100%; resize: vertical; }

@media (max-width: 760px) {
  .sx-form, .sx-grid { grid-template-columns: minmax(0, 1fr); }
}

@media print {
  .sheet-title { border: none; font-size: 15pt; }
  .sx-field input, .sx-field textarea, .sx-field select { border-color: #bbb; background: #fff; color: #000; }
  .sx-repcard { break-inside: avoid; }
}
/* --- 规则包格式规范 --- */
.spec-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.spec-doc { max-height: 62vh; overflow: auto; }
/* ============================================================
 * 统一模板系统：12 列栅格 / 卡片 / 可视化编辑器
 * ============================================================ */

/* --- 记录表栅格 --- */
.sx-form.sx-grid12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.sx-grid12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; }
.sx-row { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: start; }
.sx-cell { min-width: 0; }
.sx-group { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.sx-group-head {
  font-family: var(--font-display); font-size: 1em; color: var(--gold-strong);
  border-bottom: 1px solid var(--line); padding: 6px 0 4px;
}
.sx-group.boxed { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel); }
.sx-group-body { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; }
.sx-cell .sx-item { min-width: 0; }

/* --- 卡片 --- */
.dc-face { font-size: 0.86em; line-height: 1.55; }
.dc-face.dc-accent-gold { border-top: 2px solid var(--gold); padding-top: 5px; }
.dc-face.dc-accent-danger { border-top: 2px solid var(--danger); padding-top: 5px; }
.dc-face.dc-accent-info { border-top: 2px solid #5f9ea0; padding-top: 5px; }
.dc-face.dc-accent-muted { border-top: 2px solid var(--line); padding-top: 5px; }
.dc-grid12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.dc-row { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: start; }
.dc-cell { min-width: 0; }
.dc-group-body { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.dc-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.dc-chip { font-size: 0.72em; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--text-dim); }
.dc-chip i { font-style: normal; opacity: 0.65; margin-right: 3px; }
.dc-para { margin: 0; }
.dc-para-label { font-weight: 600; display: block; font-size: 0.78em; color: var(--text-dim); }
.dc-para.italic p { font-style: italic; }
.dc-para p { margin: 2px 0 0; overflow-wrap: anywhere; }
.dc-pairs { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 0.8em; }
.dc-pair b { font-weight: 600; color: var(--gold-strong); margin-right: 4px; }
.dc-stats { display: flex; align-items: center; gap: 8px; font-size: 0.8em; flex-wrap: wrap; }
.dc-stats-label { color: var(--text-dim); }
.dc-stat { display: flex; align-items: center; gap: 4px; }
.dc-stat span { color: var(--text-dim); font-size: 0.9em; }
.dc-stat input {
  width: 3.4em; font: inherit; font-size: 1.05em; padding: 2px 4px; text-align: center;
  background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 5px; color: var(--text);
}
.dc-tracker { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.dc-boxes { display: flex; gap: 3px; flex-wrap: wrap; }
.dc-box {
  width: 15px; height: 15px; padding: 0; cursor: pointer;
  border: 1px solid var(--line); border-radius: 3px; background: transparent;
}
.dc-box:hover { border-color: var(--gold); }
.dc-box.on { background: var(--gold); border-color: var(--gold); }
.dc-tracker-count { font-size: 0.7em; color: var(--text-dim); font-family: var(--font-mono); }
.dc-section {
  font-family: var(--font-display); font-size: 0.92em; color: var(--gold-strong);

}
.dc-features { display: flex; flex-direction: column; gap: 6px; }
.dc-feature { border-left: 2px solid var(--line); padding-left: 7px; }
.dc-feature-head { display: flex; align-items: center; gap: 6px; font-size: 0.86em; }
.dc-badge { font-size: 0.68em; color: var(--text-dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.dc-feature p { margin: 2px 0 0; font-size: 0.78em; line-height: 1.55; }
.dc-quest { color: var(--text-dim); font-style: italic; }
.dc-note {
  width: 100%; font: inherit; font-size: 0.8em; resize: vertical;
  background: var(--panel-2); color: var(--text);
  border: 1px dashed var(--line); border-radius: 6px; padding: 5px 7px;
}
.dc-note:focus { border-color: var(--gold); outline: none; }
.dc-field { display: flex; flex-direction: column; gap: 2px; font-size: 0.76em; color: var(--text-dim); }
.dc-field input {
  font: inherit; font-size: 1.2em; min-width: 0; padding: 4px 6px;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line-soft); border-radius: 6px;
}
.dc-check { display: flex; align-items: center; gap: 6px; font-size: 0.8em; }

/* --- 模板编辑器 --- */
.tb-wrap { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.tb-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tb-top #tb-name {
  flex: 1 1 200px; min-width: 140px; font: inherit; font-size: 0.95em; padding: 6px 10px;
  background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
}
.tb-kind { font-size: 0.74em; color: var(--gold-strong); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.tb-main { display: grid; grid-template-columns: 152px minmax(0, 1fr) 240px; gap: 12px; align-items: start; }
.tb-palette {
  display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  padding: 8px; max-height: 64vh; overflow: auto;
}
.tb-pal-head { flex: 0 0 100%; font-size: 0.7em; letter-spacing: 0.1em; color: var(--text-dim); margin: 4px 0 0; }
.tb-chip {
  font: inherit; font-size: 0.8em; padding: 4px 8px; cursor: grab;
  border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--text);
}
.tb-chip:hover { border-color: var(--gold); color: var(--gold-strong); }
.tb-pal-tip { flex: 0 0 100%; font-size: 0.72em; color: var(--text-dim); line-height: 1.5; margin: 6px 0 0; }
.tb-stage { min-width: 0; }
.tb-stage-inner { width: 100%; }
.tb-canvas {
  border: 1px dashed var(--line); border-radius: 12px; background: var(--bg-elev);
  padding: 14px 12px 10px; min-height: 320px; max-height: 64vh; overflow: auto;
}
.tb-stage-foot { font-size: 0.72em; color: var(--text-dim); padding: 6px 2px 0; }
.tb-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; }
.tb-empty { color: var(--text-dim); font-size: 0.85em; text-align: center; padding: 60px 10px; line-height: 1.9; }
.tb-node { position: relative; min-width: 0; border: 1px solid transparent; border-radius: 8px; padding: 2px; }
.tb-node:hover { border-color: var(--line); }
.tb-node.selected { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.tb-bar {
  position: absolute; top: -11px; left: 4px; right: 4px; z-index: 5;
  display: flex; align-items: center; gap: 3px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px;
  opacity: 0; pointer-events: none; font-size: 0.68em;
}
.tb-node:hover > .tb-bar, .tb-node.selected > .tb-bar { opacity: 1; pointer-events: auto; }
.tb-bar-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
.tb-grip { cursor: grab; color: var(--text-dim); letter-spacing: -2px; }
.tb-mini {
  font: inherit; font-size: 1em; line-height: 1; padding: 1px 4px; cursor: pointer;
  border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--text-dim);
}
.tb-mini:hover { color: var(--gold-strong); border-color: var(--line); }
.tb-mini.danger:hover { color: var(--danger); }
.tb-span { min-width: 16px; text-align: center; color: var(--text-dim); }
.tb-resize { position: absolute; right: -4px; top: 8px; bottom: 8px; width: 8px; cursor: ew-resize; border-radius: 4px; }
.tb-node:hover > .tb-resize, .tb-node.selected > .tb-resize {
  background: linear-gradient(180deg, transparent, var(--gold), transparent); opacity: 0.5;
}
.tb-row { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.tb-group-box { border: 1px solid var(--line-soft); border-radius: 10px; padding: 8px; }
.tb-group-box.boxed { border-color: var(--line); }
.tb-group-title {
  font-family: var(--font-display); color: var(--gold-strong); font-size: 0.92em;
  border-bottom: 1px solid var(--line-soft); padding-bottom: 3px; margin-bottom: 5px;
}
.tb-group-body { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; }
.tb-container-empty {
  grid-column: 1 / -1; color: var(--text-dim); font-size: 0.78em; padding: 14px; text-align: center;
  border: 1px dashed var(--line-soft); border-radius: 8px;
}
.tb-drop-tail { font-size: 0.72em; color: var(--text-dim); text-align: center; padding: 8px; }
.tb-drop-before { box-shadow: inset 0 3px 0 var(--gold); }
.tb-drop-after { box-shadow: inset 0 -3px 0 var(--gold); }
.tb-drop-inside { border-color: var(--gold); background: var(--gold-bg); }
.tb-drop-end::after { content: ''; display: block; grid-column: 1 / -1; height: 3px; background: var(--gold); border-radius: 2px; }
.tb-dragging { opacity: 0.4; }
.tb-inspector {
  display: flex; flex-direction: column; gap: 6px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  padding: 10px; max-height: 64vh; overflow: auto;
}
.tb-ins-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-family: var(--font-display); color: var(--gold-strong); font-size: 0.95em;
  border-bottom: 1px solid var(--line-soft); padding-bottom: 5px;
}
.tb-ins-row { display: flex; flex-direction: column; gap: 3px; font-size: 0.76em; color: var(--text-dim); }
.tb-ins-row input, .tb-ins-row select, .tb-ins-row textarea {
  font: inherit; font-size: 1.15em; min-width: 0; padding: 4px 6px;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line-soft); border-radius: 6px;
}
.tb-ins-check { display: flex; align-items: center; gap: 6px; font-size: 0.8em; }
.tb-ins-sub { font-size: 0.72em; letter-spacing: 0.08em; color: var(--text-dim); margin-top: 6px; border-top: 1px solid var(--line-soft); padding-top: 6px; }
.tb-ins-line { display: flex; gap: 4px; align-items: center; }
.tb-ins-line input {
  flex: 1 1 auto; min-width: 0; font: inherit; font-size: 0.86em; padding: 3px 5px;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line-soft); border-radius: 5px;
}
.tb-ins-line select { font: inherit; font-size: 0.8em; background: var(--panel-2); color: var(--text); border: 1px solid var(--line-soft); border-radius: 5px; }
.tb-ins-note { font-size: 0.72em; color: var(--text-dim); line-height: 1.6; margin: 2px 0; }
.tb-preview .tb-bar, .tb-preview .tb-resize { display: none; }
.tb-preview .tb-node { border-color: transparent !important; box-shadow: none !important; }
.tb-preview .tb-inner input, .tb-preview .tb-inner textarea, .tb-preview .tb-inner select { pointer-events: none; background: transparent; }

/* --- 模板库 / 按模板编辑数据 --- */
.tpl-group { margin: 8px 0; }
.tpl-group-head {
  display: flex; justify-content: space-between; gap: 8px;
  font-size: 0.76em; letter-spacing: 0.1em; color: var(--text-dim);
