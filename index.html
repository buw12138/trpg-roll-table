}
.tpl-kind-row { flex-wrap: wrap; gap: 10px; margin: 6px 0; }
.edit-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.edit-row { display: flex; flex-direction: column; gap: 3px; font-size: 0.78em; color: var(--text-dim); }
.edit-row input, .edit-row textarea {
  font: inherit; font-size: 1.15em; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px;
}
.edit-row-group { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line-soft); border-radius: 8px; padding: 6px 8px; }
.edit-group-label { font-size: 0.76em; color: var(--gold-strong); }
.edit-features { grid-column: 1 / -1; border: 1px solid var(--line-soft); border-radius: 8px; padding: 6px 8px; }
.edit-features-head { display: flex; align-items: center; justify-content: space-between; font-size: 0.76em; color: var(--gold-strong); }
.edit-feature { border-top: 1px dashed var(--line-soft); padding-top: 6px; margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
.edit-feature-top { display: flex; gap: 4px; }
.edit-feature input, .edit-feature textarea {
  font: inherit; font-size: 0.9em; min-width: 0; color: var(--text);
  background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 5px; padding: 3px 5px;
}

@media (max-width: 760px) {
  .sx-stack .sx-cell, .sx-stack .sx-row, .sx-stack .sx-group,
  .dc-stack .dc-cell, .dc-stack .dc-row, .dc-stack .dc-group { grid-column: 1 / -1 !important; }
  .edit-grid { grid-template-columns: 1fr; }
}
@media (max-width: 980px) {
  .tb-main { grid-template-columns: minmax(0, 1fr); }
  .tb-palette { max-height: none; }
  .tb-inspector { max-height: none; }
}
@media print {
  .tb-main, .tb-top { display: none !important; }
}

/* ============================================================
 * 模板编辑器：全屏弹窗
 * ============================================================ */
.modal.full {
  width: calc(100vw - 16px);
  max-width: none;
  height: calc(100vh - 16px);
  height: calc(100dvh - 16px);
  max-height: none;
  border-radius: 10px;
}
.modal.full .modal-head { padding: 8px 12px; }
.modal.full .modal-head h3 { font-size: 0.98em; }
.modal.full .modal-body {
  flex: 1 1 auto;
  min-height: 0;
  padding: 10px 12px 12px;
  overflow: hidden;
}
.modal.full .tb-wrap { flex: 1 1 auto; height: 100%; min-height: 0; }
.modal.full .tb-main {
  flex: 1 1 auto;
  min-height: 0;
  align-items: stretch;
  grid-template-columns: 164px minmax(0, 1fr) 264px;
}
.modal.full .tb-palette { max-height: none; }
.modal.full .tb-stage { min-height: 0; display: flex; flex-direction: column; }
.modal.full .tb-stage-inner { flex: 1 1 auto; min-height: 0; }
.modal.full .tb-canvas { max-height: none; height: 100%; }
.modal.full .tb-inspector { max-height: none; }

@media (max-width: 980px) {
  .modal.full .modal-body { overflow: auto; }
  .modal.full .tb-main { grid-template-columns: minmax(0, 1fr); }
  .modal.full .tb-canvas { height: auto; min-height: 460px; }
}
@media print {
  .modal.full { display: none !important; }
}

/* ============================================================
 * DM 追踪面板（白板 + 双库 + 计数）
 * ============================================================ */
.dmb-view {
  height: calc(100dvh - 230px);
  min-height: 520px;
  max-width: none;
  gap: 8px;
}
.dmb-toolbar { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.dmb-toolsep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
.dmb-width { display: flex; align-items: center; gap: 6px; font-size: 0.8em; color: var(--text-dim); }
.dmb-width input {
  width: 72px; font: inherit; font-size: 1.15em; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 3px 7px;
}
.dmb-body { flex: 1 1 auto; min-height: 0; display: flex; align-items: stretch; position: relative; }
.dmb-lib-panel {
  width: 258px; flex: 0 0 258px; min-height: 0;
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
}
.dmb-lib-panel.closed { display: none; }
.dmb-lib-head { display: flex; align-items: center; gap: 5px; padding: 7px 8px; border-bottom: 1px solid var(--line-soft); }
.dmb-lib-title { font-family: var(--font-display); font-size: 0.92em; color: var(--gold-strong); white-space: nowrap; }
.dmb-lib-head select {
  font: inherit; font-size: 0.72em; max-width: 104px; padding: 3px 4px;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
}
.dmb-lib-count { font-size: 0.7em; color: var(--text-dim); white-space: nowrap; }
.dmb-lib-tools { display: flex; flex-wrap: wrap; gap: 5px; padding: 7px 8px; border-bottom: 1px solid var(--line-soft); }
.dmb-mini {
  font: inherit; font-size: 0.73em; padding: 3px 8px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--text);
}
.dmb-mini:hover { border-color: var(--gold); color: var(--gold-strong); }
.dmb-lib-search {
  margin: 7px 8px 0; font: inherit; font-size: 0.8em; padding: 5px 8px;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 7px;
}
.dmb-lib-filters { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 8px; }
.dmb-lib-filters select {
  flex: 1 1 44%; min-width: 0; font: inherit; font-size: 0.73em; padding: 3px 2px;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
}
.dmb-lib-list { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 4px 6px 8px; }
.dmb-lib-row {
  display: flex; align-items: center; gap: 6px; padding: 5px 7px;
  border-radius: 7px; cursor: grab; font-size: 0.84em;
}
.dmb-lib-row:hover { background: var(--panel-2); }
.dmb-lib-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dmb-lib-badges { display: flex; gap: 3px; flex: none; }
.dmb-badge {
  font-size: 0.66em; color: var(--text-dim); border: 1px solid var(--line);
  border-radius: 999px; padding: 0 5px; white-space: nowrap;
}
.dmb-lib-empty { color: var(--text-dim); font-size: 0.8em; line-height: 1.75; padding: 18px 10px; text-align: center; }
.dmb-lib-foot { padding: 5px 8px; font-size: 0.67em; color: var(--text-dim); border-top: 1px solid var(--line-soft); }
.dmb-collapse {
  flex: 0 0 15px; align-self: center; width: 15px; height: 54px; padding: 0; cursor: pointer;
  border: 1px solid var(--line); border-radius: 7px; background: var(--panel);
  color: var(--text-dim); font-size: 0.65em; line-height: 1;
}
.dmb-collapse:hover { color: var(--gold-strong); border-color: var(--gold); }
.dmb-stage-wrap {
  position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; margin: 0 6px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg-elev); overflow: hidden;
}
.dmb-stage { position: absolute; inset: 0; overflow: auto; cursor: grab; }
.dmb-stage:active { cursor: grabbing; }
.dmb-paper { position: relative; }
.dmb-canvas {
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  background-image: radial-gradient(circle, var(--line-soft) 1px, transparent 1px);
  background-size: 24px 24px;
}
.dmb-hint {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
  text-align: center; color: var(--text-dim); font-size: 0.92em; line-height: 2;
  display: flex; flex-direction: column; gap: 4px; pointer-events: none;
}
.dmb-hint.hidden { display: none; }
.dmb-hint p { margin: 0; }
.dmb-zoom {
  position: absolute; right: 10px; bottom: 10px; z-index: 5;
  display: flex; gap: 3px; padding: 3px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg-elev);
}
.dmb-zoom button {
  font: inherit; font-size: 0.76em; padding: 2px 7px; cursor: pointer;
  border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--text-dim);
}
.dmb-zoom button:hover { color: var(--gold-strong); border-color: var(--line); }

.dmb-card {
  position: absolute; display: flex; flex-direction: column; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 24px -18px rgba(0, 0, 0, 0.7);
}
.dmb-card.locked { border-style: dashed; }
.dmb-card-head {
  display: flex; align-items: center; gap: 4px; padding: 5px 6px; cursor: grab;
  background: var(--panel-2); border-bottom: 1px solid var(--line-soft); user-select: none;
}
.dmb-card-head .mini { flex: none; }
.dmb-card-title {
  flex: 1 1 auto; min-width: 0; cursor: grab;
  font-family: var(--font-display); font-size: 0.92em; font-weight: 600;
  color: var(--text); padding: 1px 4px; border-radius: 5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dmb-card-title:hover { background: var(--bg-elev); }
.dmb-card-kind {
  flex: none; font-size: 0.62em; color: var(--text-dim);
  border: 1px solid var(--line); border-radius: 999px; padding: 0 5px;
}
.dmb-card-body { padding: 6px 8px 8px; }
.dmb-card.collapsed .dmb-card-body { display: none; }
.dmb-card-resize { position: absolute; right: -2px; top: 10px; bottom: 10px; width: 6px; cursor: ew-resize; }
.dmb-card:hover .dmb-card-resize {
  background: linear-gradient(180deg, transparent, var(--gold), transparent); opacity: 0.45;
}
.dmb-counter-row { display: flex; align-items: center; gap: 5px; padding: 8px 9px 4px; }
.dmb-step {
  width: 26px; height: 26px; font: inherit; font-size: 1em; cursor: pointer;
  border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--text);
}
.dmb-step:hover { border-color: var(--gold); color: var(--gold-strong); }
.dmb-counter-val, .dmb-counter-max {
  width: 3.4em; text-align: center; font: inherit; font-size: 1.06em; padding: 2px 3px;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line-soft); border-radius: 6px;
}
.dmb-counter-of { color: var(--text-dim); }
.dmb-bar { height: 6px; margin: 2px 9px 0; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.dmb-bar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; transition: width 0.12s; }
.dmb-counter-note {
  width: calc(100% - 18px); margin: 6px 9px 8px; font: inherit; font-size: 0.78em; padding: 4px 6px;
  background: var(--panel-2); color: var(--text); border: 1px dashed var(--line); border-radius: 6px; resize: vertical;
}
.dmb-side-actions { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; }
.dmb-side-actions .side-new { margin: 0; }

@media (max-width: 980px) {
  .dmb-view { height: auto; min-height: 0; }
  .dmb-body { flex-direction: column; overflow: auto; }
  .dmb-lib-panel { width: 100%; flex: none; max-height: 34vh; }
  .dmb-lib-panel.closed { display: none; }
  .dmb-collapse { display: none; }
  .dmb-stage-wrap { min-height: 62vh; margin: 0; }
}
@media print {
  .dmb-toolbar, .dmb-lib-panel, .dmb-zoom, .dmb-collapse, .dmb-hint { display: none !important; }
  .dmb-view { height: auto; min-height: 0; }
  .dmb-body { display: block; }
  .dmb-stage-wrap { border: none; overflow: visible; }
  .dmb-stage { position: static; overflow: visible; }
  .dmb-paper { width: auto !important; height: auto !important; }
  .dmb-canvas {
    position: static; transform: none !important; width: auto !important; height: auto !important; background: none;
  }
  .dmb-card {
    position: relative !important; left: auto !important; top: auto !important;
    margin: 8px 0; box-shadow: none; break-inside: avoid;
  }
}

/* 卡片标题栏拖动提示 */
.dmb-grip { flex: none; color: var(--text-dim); font-size: 0.85em; letter-spacing: -1px; cursor: grab; }
.dmb-card-head:active .dmb-grip { color: var(--gold-strong); }

/* 卡片库放进左侧栏（战役侧栏） */
.dmb-side-lib { display: flex; flex-direction: column; gap: 6px; padding: 2px 8px 10px; }
.dmb-side-lib .dmb-lib-head { padding: 0 0 2px; border-bottom: none; gap: 4px; flex-wrap: wrap; }
.dmb-side-lib .dmb-lib-head select { max-width: 96px; }
.dmb-side-lib .dmb-lib-count { margin-right: auto; }
.dmb-side-lib .dmb-lib-tools { padding: 0 0 2px; border-bottom: none; gap: 4px; }
.dmb-side-lib .dmb-mini { font-size: 0.7em; padding: 2px 6px; }
.dmb-side-lib .dmb-lib-search { margin: 0; width: 100%; }
.dmb-side-lib .dmb-lib-filters { padding: 0; }
.dmb-side-lib .dmb-lib-filters select { flex: 1 1 44%; }
.dmb-side-lib .dmb-lib-list { padding: 0; overflow: visible; }
.dmb-side-lib .dmb-lib-row { padding: 3px 4px; font-size: 0.8em; gap: 4px; }
.dmb-side-lib .dmb-badge { font-size: 0.6em; padding: 0 4px; }
.dmb-side-lib .dmb-lib-foot { border-top: 1px solid var(--line-soft); padding: 6px 2px 0; }
.dmb-link {
  border: none; background: transparent; padding: 0; cursor: pointer;
  font: inherit; color: var(--gold-strong); text-decoration: underline;
}
.dmb-body { position: relative; }
.dmb-body .dmb-stage-wrap { margin: 0; }

/* --- 卡片内计数条 --- */
.dc-counter { display: flex; flex-direction: column; gap: 4px; }
.dc-counter-label { font-size: 0.76em; color: var(--text-dim); }
.dc-counter-row { display: flex; align-items: center; gap: 5px; }
.dc-counter-val, .dc-counter-max {
  width: 3.2em; text-align: center; font: inherit; font-size: 1.05em; padding: 2px 3px;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line-soft); border-radius: 6px;
}
.dc-counter-of { color: var(--text-dim); }
.dc-counter-bar { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.dc-counter-bar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; transition: width 0.12s; }
.edit-inline { display: flex; align-items: center; gap: 5px; }
.edit-inline input { flex: 1 1 0; min-width: 0; }

/* --- 规则速查：选中文本浮条 / 目录加号 --- */
.rules-selbar {
  position: fixed; z-index: 72; display: none; gap: 4px; padding: 4px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg-elev); box-shadow: var(--shadow);
}
.rules-selbar.show { display: flex; }
.rules-selbar button {
  display: inline-flex; align-items: center; gap: 4px;
  font: inherit; font-size: 0.76em; padding: 4px 9px; cursor: pointer;
  border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--text);
}

<script>
/* ============================================================
 * 00. 随机数：可复现的种子随机（mulberry32）
 * ============================================================ */
(function (RT) {
  'use strict';

  RT.hashSeed = function (str) {
    let h = 2166136261 >>> 0;
    const s = String(str);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  };

  RT.mulberry32 = function (seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  RT.randomSeed = function () {
    if (window.crypto && window.crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] >>> 0;
    }
    return (Math.random() * 4294967296) >>> 0;
  };

  /** 按权重取下标；权重全 0 时退化为均匀分布 */
  RT.pickWeightedIndex = function (weights, rand) {
    const n = weights.length;
    if (!n) return -1;
    let total = 0;
    for (let i = 0; i < n; i++) {
      const w = Number(weights[i]);
      total += w > 0 ? w : 0;
    }
    if (total <= 0) return Math.floor(rand() * n);
    let r = rand() * total;
    for (let i = 0; i < n; i++) {
      const w = Number(weights[i]);
      if (w > 0) {
        r -= w;
        if (r < 0) return i;
      }
    }
    return n - 1;
  };

})(window.RT = window.RT || {});

/* ============================================================
 * 01. 数据模型、默认值、示例表组、导入校验
 * ============================================================ */
(function (RT) {
  'use strict';

  RT.SCHEMA_VERSION = 3;

  RT.uid = function (prefix) {
    return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  };

  RT.entry = function (text, weight, range) {
    return {
      id: RT.uid('e'),
      text: String(text == null ? '' : text),
      weight: weight == null ? 1 : Number(weight),
      range: range || null,
    };
  };

  RT.table = function (name, tags, entries, dice) {
    return {
      id: RT.uid('t'),
      name: name || '新表',
      folderId: null,
      tags: tags || [],
      dice: dice || null,
      entries: entries || [],
    };
  };

  RT.emptySet = function () {
    return {
      schemaVersion: RT.SCHEMA_VERSION,
      id: RT.uid('set'),
      name: '我的战役表组',
      updatedAt: new Date().toISOString(),
      contentVersion: null,
      folders: [],
      tables: [],
      combos: [],
      favorites: [],
      history: [],
    };
  };

  /* ---------------- 内置表包：即兴核心包（方案 A） ---------------- */

  /**
   * 首次打开、菜单「载入核心表包」、以及旧示例迁移都走这里。
   * 表内容全部定义在 01a-content.js（RT.contentSet），本文件只留接口。
   */
  RT.sampleSet = function () {
    return RT.contentSet();
  };

  /* ---------------- 导入校验 / 兼容 ---------------- */

  function num(v, dflt) {
    const n = Number(v);
    return isFinite(n) ? n : dflt;
  }

  RT.normalizeSet = function (raw) {
    if (!raw || typeof raw !== 'object') throw new Error('不是有效的 JSON 对象');
    if (!Array.isArray(raw.tables) && !Array.isArray(raw.combos)) {
      throw new Error('缺少 tables 字段，看来不是本工具导出的文件');
    }

    const set = RT.emptySet();
    set.schemaVersion = RT.SCHEMA_VERSION;
    set.id = typeof raw.id === 'string' && raw.id ? raw.id : set.id;
    set.name = typeof raw.name === 'string' && raw.name.trim() ? raw.name.trim() : '导入的表组';
    set.updatedAt = typeof raw.updatedAt === 'string' ? raw.updatedAt : new Date().toISOString();
    // 内容库版本：用于把旧版「示例表组」整包替换成即兴核心包（自定义表组不受影响）
    set.contentVersion = typeof raw.contentVersion === 'string' ? raw.contentVersion : null;

    set.folders = (Array.isArray(raw.folders) ? raw.folders : []).map(function (f) {
      if (!f || typeof f !== 'object') return null;
      return {
        id: typeof f.id === 'string' && f.id ? f.id : RT.uid('fd'),
        name: typeof f.name === 'string' && f.name.trim() ? f.name.trim() : '未命名分组',
        parentId: typeof f.parentId === 'string' && f.parentId ? f.parentId : null,
        collapsed: !!f.collapsed,
      };
    }).filter(Boolean);

    // 清理悬空父级与环（防止导入坏数据导致渲染死循环）
    const folderById = {};
    set.folders.forEach(function (f) { folderById[f.id] = f; });
    set.folders.forEach(function (f) {
      if (!f.parentId) return;
      if (f.parentId === f.id || !folderById[f.parentId]) {
        f.parentId = null;
        return;
      }
      let cur = folderById[f.parentId];
      let guard = 0;
      while (cur && guard++ < 100) {
        if (cur.id === f.id) { f.parentId = null; break; }
        cur = cur.parentId ? folderById[cur.parentId] : null;
      }
    });

    const folderIds = set.folders.map(function (f) { return f.id; });

    set.tables = (Array.isArray(raw.tables) ? raw.tables : []).map(function (t) {
      const table = RT.table(typeof t.name === 'string' ? t.name : '未命名表', [], [], typeof t.dice === 'string' && t.dice.trim() ? t.dice.trim() : null);
      table.id = typeof t.id === 'string' && t.id ? t.id : table.id;
      table.tags = Array.isArray(t.tags) ? t.tags.filter(function (x) { return typeof x === 'string'; }) : [];
      table.folderId = typeof t.folderId === 'string' && folderIds.indexOf(t.folderId) >= 0 ? t.folderId : null;
      table.entries = (Array.isArray(t.entries) ? t.entries : []).map(function (e) {
        if (typeof e === 'string') return RT.entry(e, 1);
        const entry = RT.entry(typeof e.text === 'string' ? e.text : '', num(e.weight, 1), null);
        entry.id = typeof e.id === 'string' && e.id ? e.id : entry.id;
        if (Array.isArray(e.range) && e.range.length === 2) {
          entry.range = [num(e.range[0], 0), num(e.range[1], 0)];
        }
        return entry;
      });
      return table;
    });

    set.combos = (Array.isArray(raw.combos) ? raw.combos : []).map(function (c) {
      const combo = { id: RT.uid('c'), name: typeof c.name === 'string' ? c.name : '未命名组合', fields: [], template: typeof c.template === 'string' ? c.template : '' };
      if (typeof c.id === 'string' && c.id) combo.id = c.id;
      combo.fields = (Array.isArray(c.fields) ? c.fields : []).map(function (f) {
        return {
          id: typeof f.id === 'string' && f.id ? f.id : RT.uid('f'),
          tableId: typeof f.tableId === 'string' ? f.tableId : '',
          label: typeof f.label === 'string' ? f.label : '字段',
          rolls: Math.min(20, Math.max(1, num(f.rolls, 1))),
          sep: typeof f.sep === 'string' ? f.sep : '、',
          locked: !!f.locked,
          lockedValue: typeof f.lockedValue === 'string' ? f.lockedValue : '',
        };
      });
      return combo;
    });

    set.favorites = (Array.isArray(raw.favorites) ? raw.favorites : []).map(function (f) {
      return {
        id: typeof f.id === 'string' && f.id ? f.id : RT.uid('fav'),
        comboId: typeof f.comboId === 'string' ? f.comboId : '',
        sourceLabel: typeof f.sourceLabel === 'string' ? f.sourceLabel : '',
        text: typeof f.text === 'string' ? f.text : '',
        note: typeof f.note === 'string' ? f.note : '',
        ts: num(f.ts, Date.now()),
      };
    });

    set.history = (Array.isArray(raw.history) ? raw.history : []).slice(0, 200).map(function (h) {
      return {
        id: typeof h.id === 'string' && h.id ? h.id : RT.uid('h'),
        ts: num(h.ts, Date.now()),
        kind: h.kind === 'combo' ? 'combo' : 'table',
        refId: typeof h.refId === 'string' ? h.refId : '',
        label: typeof h.label === 'string' ? h.label : '',
        seed: num(h.seed, 0),
        text: typeof h.text === 'string' ? h.text : '',
      };
    });

    return set;
  };

  /** 合并导入：为冲突的表/组合重新分配 id，并同步组合里的引用 */
  RT.mergeSet = function (target, incoming) {
    const tableMap = {};
    const folderMap = {};
    if (Array.isArray(incoming.folders)) {
      incoming.folders.forEach(function (f) {
        if (target.folders.some(function (x) { return x.id === f.id; })) {
          const nid = RT.uid('fd');
          folderMap[f.id] = nid;
          f.id = nid;
        }
        target.folders.push(f);
      });
      incoming.folders.forEach(function (f) {
        if (f.parentId && folderMap[f.parentId]) f.parentId = folderMap[f.parentId];
      });
    }
    incoming.tables.forEach(function (t) {
      if (folderMap[t.folderId]) t.folderId = folderMap[t.folderId];
      if (target.tables.some(function (x) { return x.id === t.id; })) {
        const nid = RT.uid('t');
        tableMap[t.id] = nid;
        t.id = nid;
      }
      target.tables.push(t);
    });
    incoming.combos.forEach(function (c) {
      c.fields.forEach(function (f) {
        if (tableMap[f.tableId]) f.tableId = tableMap[f.tableId];
      });
      if (target.combos.some(function (x) { return x.id === c.id; })) c.id = RT.uid('c');
      target.combos.push(c);
    });
    incoming.favorites.forEach(function (f) {
      if (target.favorites.some(function (x) { return x.id === f.id; })) f.id = RT.uid('fav');
      target.favorites.push(f);
    });
    return target;
  };

})(window.RT = window.RT || {});

/* ============================================================
 * 01a. 即兴核心表包（方案 A）内容库
 *     人物 22 表 / 地点 25 表 / 战斗 24 表 / 事件 9 表 + 8 个组合
 *     权重约定：战斗描述「普通 5 : 戏剧化 1」≈ 85:15，重击表反过来
 *     条目字符串以 * 开头 = 戏剧化条目（走低权重 / 重击表走高权重）
 * ============================================================ */
(function (RT) {
  'use strict';

  RT.CONTENT_VERSION = 'A1-2026-11-16';

  /** 旧版「泛奇幻示例表组」的表名 —— 用于把浏览器里残留的测试表整包换掉 */
  RT.LEGACY_SAMPLE_NAME = '泛奇幻示例表组';
  RT.LEGACY_SAMPLE_TABLES = [
    '姓氏', '名字', '绰号', 'NPC 姓名', 'NPC 外貌', 'NPC 性格',
    'NPC 动机', 'NPC 口癖', '天气', '旅途遭遇', '酒馆传闻',
  ];

  RT.isLegacySample = function (set) {
    if (!set || !Array.isArray(set.tables) || !set.tables.length) return false;
    if (set.name === RT.LEGACY_SAMPLE_NAME) return true;
    return set.tables.every(function (t) {
      return RT.LEGACY_SAMPLE_TABLES.indexOf(String(t.name).trim()) >= 0;
    });
  };

  RT.contentSet = function () {
    const set = RT.emptySet();
    set.name = '跑团即兴核心包';
    set.contentVersion = RT.CONTENT_VERSION;

    const folders = {};
    const tables = [];

    function folder(key, name, parentKey) {
      const f = {
        id: RT.uid('fd'),
        name: name,
        parentId: parentKey && folders[parentKey] ? folders[parentKey].id : null,
        collapsed: false,
      };
      folders[key] = f;
      set.folders.push(f);
      return f;
    }

    /**
     * table(分组键, 表名, 条目数组, 选项)
     * 条目：字符串（默认权重 wn；以 * 开头则用 wd）或 [文本, 权重, 区间]
     */
    function table(folderKey, name, items, opts) {
      opts = opts || {};
      const wn = opts.wn == null ? 1 : opts.wn;
      const wd = opts.wd == null ? 1 : opts.wd;
      const t = RT.table(name, opts.tags || [], [], opts.dice || null);
      t.folderId = folders[folderKey] ? folders[folderKey].id : null;
      items.forEach(function (it) {
        if (typeof it === 'string') {
          const dramatic = it.charAt(0) === '*';
          t.entries.push(RT.entry(dramatic ? it.slice(1) : it, dramatic ? wd : wn));
        } else {
          t.entries.push(RT.entry(
            it[0],
            it.length > 1 && it[1] != null ? it[1] : wn,
            it.length > 2 ? it[2] : null
          ));
        }
      });
      tables.push(t);
      return t;
    }

    function fld(t, label, sep) {
      return {
        id: RT.uid('f'), tableId: t.id, label: label,
        rolls: 1, sep: sep == null ? '、' : sep, locked: false, lockedValue: '',
      };
    }

    function combo(name, fields, template) {
      set.combos.push({ id: RT.uid('c'), name: name, fields: fields, template: template });
    }

    /* ================= 分组骨架 ================= */

    folder('char', '01 人物与 NPC');
    folder('names', '姓名组件', 'char');
    folder('look', '外貌与细节', 'char');
    folder('mind', '性格与动机', 'char');

        if (c === '*') v = { value: v.value * r.value, detail: v.detail + ' × ' + r.detail };
        else v = { value: v.value / (r.value || 1), detail: v.detail + ' ÷ ' + r.detail };
      }
      return v;
    }

    function parseFactor() {
      if (src.charAt(pos) === '-') { pos++; const v = parseFactor(); return { value: -v.value, detail: '−' + v.detail }; }
      if (src.charAt(pos) === '+') { pos++; return parseFactor(); }
      if (src.charAt(pos) === '(') {
        pos++;
        const v = parseExpression();
        if (src.charAt(pos) === ')') pos++;
        return { value: v.value, detail: '(' + v.detail + ')' };
      }
      return parsePrimary();

      const dm = /^(\d*)d(\d+)(kh\d+|kl\d+|dh\d+|dl\d+)?/.exec(src.slice(pos));

        pos += dm[0].length;
        const n = clamp(parseInt(dm[1] || '1', 10) || 1, 1, cap);
        const faces = clamp(parseInt(dm[2], 10) || 6, 1, 1000);
        const keep = dm[3] || '';
        if (faces === 66 && n === 1) {
          const a = 1 + Math.floor(rnd() * 6);
          const b = 1 + Math.floor(rnd() * 6);
          const total = a * 10 + b;
          return { value: total, detail: 'd66(' + a + ',' + b + ')' };
        }
        const rolls = [];
        for (let i = 0; i < n; i++) rolls.push(1 + Math.floor(rnd() * faces));

          const k = clamp(parseInt(keep.slice(2), 10) || 1, 1, n);

            value: r.total,

      }
      fail();
    }

      const v = parseExpression();
      if (pos < len) return null;
      const total = Math.round(v.value * 100) / 100;

        total: total,

  /** 表所在的分组路径，如「NPC 人物 / 名字组件」；用于同名表提示 */
  function folderPathOf(table) {

    if (!set || !Array.isArray(set.folders) || !table.folderId) return '';

    set.folders.forEach(function (f) { byId[f.id] = f; });
    const parts = [];
    let cur = byId[table.folderId];
    let guard = 0;
    while (cur && guard++ < 20) {

    if (!text) return '';

      if (!t) return full;

      const dice = RT.rollDice(table.dice, rand);

          return e.range && dice.total >= e.range[0] && dice.total <= e.range[1];

        let best = null;
        let bestDist = Infinity;

    for (let i = 0; i < n; i++) {

        return;
      }
      const t = tables.find(function (x) { return x.id === f.tableId; });
      if (!t) {

        warnings.push('字段「' + f.label + '」对应的表不存在');

      const used = [];
      const parts = [];
      for (let i = 0; i < n; i++) {
        const r = RT.rollEntry(t, tables, rand, 0, [t.id], warnings, used);
        if (r.entry) used.push(r.entry.id);
        parts.push(r.text);
      }
      values[f.label] = parts.join(f.sep === undefined ? '、' : f.sep);

      seed: seed,
      values: values,
      text: RT.renderComboText(combo, values),
      warnings: warnings,
    };

    parse: function (text) {

            if (src[i + 1] === '"') { cur += '"'; i++; }

          } else cur += c;
        } else if (c === '"') {
          quoted = true;
        } else if (c === ',' || c === '\t') {
          row.push(cur); cur = '';
        } else if (c === '\n') {
          row.push(cur); rows.push(row); row = []; cur = '';
        } else if (c !== '\r') {
          cur += c;
        }

      const first = rows[0].map(function (x) { return String(x).trim().toLowerCase(); });
      if (first[0] === '文本' || first[0] === 'text' || first[0] === '内容' || first[0] === '条目') start = 1;

      for (let i = start; i < rows.length; i++) {
        const r = rows[i];

(function (RT) {

  const memory = {};

    const probe = '__rt_probe__';

  } catch (e) {
    available = false;
  }

    available: available,

    get: function (key) {
      try {
        if (available) return window.localStorage.getItem(key);
      } catch (e) { /* ignore */ }
      return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
    },

    set: function (key, value) {
      memory[key] = value;
      try {
        if (available) {
          window.localStorage.setItem(key, value);
          return true;
        }
      } catch (e) {
        available = false;
        RT.toast && RT.toast('本地存储写入失败（可能已超出浏览器限额），请立即导出备份', 'warn');
      }
      return false;
    },

    del: function (key) {
      delete memory[key];
      try { if (available) window.localStorage.removeItem(key); } catch (e) { /* ignore */ }
    },
  };

})(window.RT = window.RT || {});

      RT.toast(flag ? '已收起全部分组' : '已展开全部分组');
    },

    /** 某分组的所有后代分组 id（不含自身） */
    folderDescendants: function (id) {
      const out = [];
      const queue = [id];
      while (queue.length) {
        const cur = queue.shift();
        S.set.folders.forEach(function (f) {
          if (f.parentId === cur) {
            out.push(f.id);
            queue.push(f.id);
          }
        });
      }
      return out;
    },

    /** 把分组挂到新父级下；会拒绝挂到自己或自己的后代里 */
    moveFolder: function (folderId, parentId) {
      const f = S.set.folders.find(function (x) { return x.id === folderId; });
      if (!f) return false;
      const target = parentId || null;
      if (target === folderId) {
        RT.toast('不能把分组移到自己里面', 'warn');
        return false;
      }
      if (target && RT.actions.folderDescendants(folderId).indexOf(target) >= 0) {
        RT.toast('不能把分组移到自己的子分组里', 'warn');
        return false;
      }
      if (target && !S.set.folders.some(function (x) { return x.id === target; })) return false;
      f.parentId = target;
      if (target) {
        const p = S.set.folders.find(function (x) { return x.id === target; });
        if (p) p.collapsed = false;
      }
      touch();
      refresh('all');
      return true;
    },

    moveTable: function (tableId, folderId) {
      const t = findTable(tableId);
      if (!t) return;
      t.folderId = folderId && S.set.folders.some(function (f) { return f.id === folderId; }) ? folderId : null;
      if (t.folderId) {
        const f = S.set.folders.find(function (x) { return x.id === t.folderId; });
        if (f) {
          // 展开目标分组及其所有祖先，避免拖进去后"看不见"
          let cur = f;
          let guard = 0;
          while (cur && guard++ < 50) {
            cur.collapsed = false;
            cur = cur.parentId ? S.set.folders.find(function (x) { return x.id === cur.parentId; }) : null;
          }
        }
      }
      touch();
      refresh('all');
    },

    deleteFolder: function (id, mode) {
      const f = S.set.folders.find(function (x) { return x.id === id; });
      if (!f) return;
      const kids = RT.actions.folderDescendants(id);
      const allIds = [id].concat(kids);
      const affectedTables = S.set.tables.filter(function (t) { return allIds.indexOf(t.folderId) >= 0; });
      RT.snapshots.push('删除分组：' + f.name);

      if (mode === 'delete') {
        S.set.tables = S.set.tables.filter(function (t) { return allIds.indexOf(t.folderId) < 0; });
        S.set.folders = S.set.folders.filter(function (x) { return allIds.indexOf(x.id) < 0; });
        if (affectedTables.some(function (t) { return t.id === S.ui.tableId; })) {
          S.ui.tableId = S.set.tables[0] ? S.set.tables[0].id : null;
        }
      } else {
        affectedTables.forEach(function (t) { t.folderId = f.parentId || null; });
        S.set.folders.forEach(function (x) {
          if (x.parentId === id) x.parentId = f.parentId || null;
        });
        S.set.folders = S.set.folders.filter(function (x) { return x.id !== id; });
      }

      touch();
      refresh('all');
      RT.toast(mode === 'delete'
        ? '已删除分组「' + f.name + '」及其 ' + kids.length + ' 个子分组、' + affectedTables.length + ' 张表'
        : '已删除分组「' + f.name + '」，内容已移到上一级');
    },

    /* --- 表名唯一性 --- */
    tableNameTaken: function (name, exceptId) {
      const key = String(name == null ? '' : name).trim().toLowerCase();
      if (!key) return true;
      return S.set.tables.some(function (t) {
        return t.id !== exceptId && String(t.name).trim().toLowerCase() === key;
      });
    },

    uniqueTableName: function (base, exceptId) {
      const root = String(base == null ? '' : base).trim() || '新表';
      if (!RT.actions.tableNameTaken(root, exceptId)) return root;
      let i = 2;
      while (RT.actions.tableNameTaken(root + ' ' + i, exceptId)) i++;
      return root + ' ' + i;
    },

    /* --- 表的 CRUD --- */
    addTable: function (name, folderId) {
      const desired = name && String(name).trim()
        ? String(name).trim()
        : RT.actions.uniqueTableName('新表 ' + (S.set.tables.length + 1));
      if (RT.actions.tableNameTaken(desired)) {
        RT.toast('已有同名表「' + desired + '」，建表前请先改名', 'warn');
        return null;
      }
      const t = RT.table(desired, [], [RT.entry('', 1)]);
      t.folderId = folderId && S.set.folders.some(function (f) { return f.id === folderId; }) ? folderId : null;
      S.set.tables.unshift(t);
      S.ui.view = 'tables';
      S.ui.tableId = t.id;
      touch();
      refresh('all');
      return t;
    },

    updateTable: function (id, patch, opts) {
      const t = findTable(id);
      if (!t) return false;
      if (Object.prototype.hasOwnProperty.call(patch, 'name')) {
        const next = String(patch.name == null ? '' : patch.name).trim();
        if (RT.actions.tableNameTaken(next, id)) return false;
        patch = Object.assign({}, patch, { name: next });
      }
      Object.assign(t, patch);
      touch();
      if (!opts || opts.rerender !== false) refresh('sidebar');
      return true;
    },

    duplicateTable: function (id) {
      const t = findTable(id);
      if (!t) return;
      const copy = JSON.parse(JSON.stringify(t));
      copy.id = RT.uid('t');
      copy.name = RT.actions.uniqueTableName(t.name + ' 副本');
      copy.entries.forEach(function (e) { e.id = RT.uid('e'); });
      S.set.tables.unshift(copy);
      S.ui.tableId = copy.id;
      S.ui.view = 'tables';
      touch();
      refresh('all');
      RT.toast('已复制表「' + t.name + '」');
    },

    deleteTable: function (id) {
      const t = findTable(id);
      if (!t) return;
      RT.snapshots.push('删除表：' + t.name);
      S.set.tables = S.set.tables.filter(function (x) { return x.id !== id; });
      S.ui.tableId = S.set.tables[0] ? S.set.tables[0].id : null;
      touch();
      refresh('all');
      RT.toast('已删除表「' + t.name + '」');
    },

    /* --- 条目 CRUD --- */
    addEntry: function (tableId) {
      const t = findTable(tableId);
      if (!t) return null;
      const e = RT.entry('', 1);
      t.entries.push(e);
      touch();
      refresh('main');
      return e;
    },

    addEntries: function (tableId, entries) {
      const t = findTable(tableId);
      if (!t || !entries.length) return 0;
      t.entries = t.entries.concat(entries);
      touch();
      refresh('all');
      return entries.length;
    },

    updateEntry: function (tableId, entryId, patch) {
      const t = findTable(tableId);
      if (!t) return;
      const e = t.entries.find(function (x) { return x.id === entryId; });
      if (!e) return;
      Object.assign(e, patch);
      touch();
    },

    deleteEntry: function (tableId, entryId) {
      const t = findTable(tableId);
      if (!t) return;
      t.entries = t.entries.filter(function (x) { return x.id !== entryId; });
      touch();
      refresh('main');
    },

    moveEntry: function (tableId, entryId, dir) {
      const t = findTable(tableId);
      if (!t) return;
      const i = t.entries.findIndex(function (x) { return x.id === entryId; });
      const j = i + dir;
      if (i < 0 || j < 0 || j >= t.entries.length) return;
      const tmp = t.entries[i];
      t.entries[i] = t.entries[j];
      t.entries[j] = tmp;
      touch();
      refresh('main');
    },

    /* --- 组合 CRUD --- */
    addCombo: function () {
      const first = S.set.tables[0];
      const combo = {
        id: RT.uid('c'),
        name: '新组合 ' + (S.set.combos.length + 1),
        fields: first
          ? [{ id: RT.uid('f'), tableId: first.id, label: first.name, rolls: 1, sep: '、', locked: false, lockedValue: '' }]
          : [],
        template: '',
      };
      S.set.combos.unshift(combo);
      S.ui.view = 'combos';
      S.ui.comboId = combo.id;
      touch();
      refresh('all');
      return combo;
    },

    updateCombo: function (id, patch, opts) {

      touch();

    },

    deleteCombo: function (id) {
      const c = findCombo(id);
      if (!c) return;

      S.set.combos = S.set.combos.filter(function (x) { return x.id !== id; });
      S.ui.comboId = S.set.combos[0] ? S.set.combos[0].id : null;
      S.results.combo = null;
      touch();
      refresh('all');
      RT.toast('已删除组合「' + c.name + '」');
    },

    duplicateCombo: function (id) {
      const c = findCombo(id);

      copy.id = RT.uid('c');
      copy.name = c.name + ' 副本';
      copy.fields.forEach(function (f) { f.id = RT.uid('f'); });
      S.set.combos.unshift(copy);
      S.ui.comboId = copy.id;
      S.ui.view = 'combos';
      touch();
      refresh('all');
    },

    addField: function (comboId) {
      const c = findCombo(comboId);
      if (!c) return;
      const first = S.set.tables[0];
      c.fields.push({
        id: RT.uid('f'),
        tableId: first ? first.id : '',
        label: uniqueLabel(c, first ? first.name : '字段'),
        rolls: 1,
        sep: '、',
        locked: false,
        lockedValue: '',
      });
      touch();
      refresh('main');
    },

    updateField: function (comboId, fieldId, patch, opts) {
      const c = findCombo(comboId);
      if (!c) return;
      const f = c.fields.find(function (x) { return x.id === fieldId; });
      if (!f) return;
      Object.assign(f, patch);
      touch();
      if (!opts || opts.rerender !== false) refresh('main');
    },

    deleteField: function (comboId, fieldId) {
      const c = findCombo(comboId);
      if (!c) return;
      c.fields = c.fields.filter(function (x) { return x.id !== fieldId; });
      touch();
      refresh('main');
    },

    moveField: function (comboId, fieldId, dir) {
      const c = findCombo(comboId);
      if (!c) return;
      const i = c.fields.findIndex(function (x) { return x.id === fieldId; });
      const j = i + dir;
      if (i < 0 || j < 0 || j >= c.fields.length) return;
      const tmp = c.fields[i];
      c.fields[i] = c.fields[j];
      c.fields[j] = tmp;
      touch();
      refresh('main');
    },

    /* --- 掷 --- */
    rollTableNow: function (times) {
      const t = currentTable();
      if (!t) return;
      if (!t.entries.length) {
        RT.toast('这张表还是空的，先加几条吧', 'warn');
        return;
      }
      const n = Math.min(50, Math.max(1, Number(times || S.ui.tableTimes) || 1));
      const seed = RT.randomSeed();
      const res = RT.rollTable(t, S.set.tables, seed, n);
      S.results.table = {
        tableId: t.id,
        seed: seed,
        texts: res.texts,
        text: res.text,
        dice: res.dice,
        warnings: res.warnings,
        ts: Date.now(),
      };
      pushHistory({ kind: 'table', refId: t.id, label: t.name, seed: seed, text: res.text });
      touch();
      refresh('main');
    },

    rollComboNow: function () {
      const c = currentCombo();
      if (!c) return;
      if (!c.fields.length) {
        RT.toast('这个组合还没有字段', 'warn');
        return;
      }
      const preset = {};
      c.fields.forEach(function (f) {
        if (f.locked && f.lockedValue) preset[f.label] = f.lockedValue;
      });
      const seed = RT.randomSeed();
      const res = RT.rollCombo(c, S.set.tables, seed, preset);
      S.results.combo = {
        comboId: c.id,
        seed: seed,
        values: res.values,
        text: res.text,
        warnings: res.warnings,
        ts: Date.now(),
      };
      pushHistory({ kind: 'combo', refId: c.id, label: c.name, seed: seed, text: res.text });
      touch();
      refresh('main');
    },

    rerollField: function (comboId, fieldId) {
      const c = findCombo(comboId);
      const cur = S.results.combo;
      if (!c || !cur || cur.comboId !== c.id) return;
      const field = c.fields.find(function (f) { return f.id === fieldId; });
      if (!field) return;

      const preset = {};
      c.fields.forEach(function (f) {
        if (f.id !== fieldId && cur.values[f.label] !== undefined) preset[f.label] = cur.values[f.label];
      });
      const seed = RT.randomSeed();
      const res = RT.rollCombo(c, S.set.tables, seed, preset);
      if (field.locked) field.lockedValue = res.values[field.label] || '';
      S.results.combo = {
        comboId: c.id,
        seed: seed,
        values: res.values,
        text: res.text,
        warnings: res.warnings,
        ts: Date.now(),
      };
      pushHistory({ kind: 'combo', refId: c.id, label: c.name + '（单字段重掷）', seed: seed, text: res.text });
      touch();
      refresh('main');
    },

    toggleLock: function (comboId, fieldId) {
      const c = findCombo(comboId);
      const cur = S.results.combo;
      if (!c) return;
      const f = c.fields.find(function (x) { return x.id === fieldId; });
      if (!f) return;
      if (f.locked) {
        f.locked = false;
        f.lockedValue = '';
      } else {
        f.locked = true;
        f.lockedValue = cur && cur.comboId === c.id && cur.values[f.label] ? cur.values[f.label] : '';
      }
      touch();
      refresh('main');
    },

    unlockAll: function (comboId) {
      const c = findCombo(comboId);
      if (!c) return;
      c.fields.forEach(function (f) { f.locked = false; f.lockedValue = ''; });
      touch();
      refresh('main');
    },

    addFavorite: function (payload) {
      const p = payload || {};
      const fav = {
        id: RT.uid('fav'),
        comboId: p.comboId || '',
        sourceLabel: p.sourceLabel || '',
        text: String(p.text || ''),
        note: '',
        ts: Date.now(),
      };
      if (!fav.text) return null;
      S.set.favorites.unshift(fav);
      touch();
      refresh('main');
      RT.toast('已加入收藏，可在收藏夹写备注');
      return fav;
    },

    saveFavorite: function () {
      const cur = S.results.combo;
      if (!cur) return;
      const c = findCombo(cur.comboId);
      RT.actions.addFavorite({
        comboId: cur.comboId,
        sourceLabel: c ? c.name : '组合',
        text: cur.text,
      });
    },

    favoriteTableResult: function () {
      const cur = S.results.table;
      if (!cur) return;
      const t = findTable(cur.tableId);
      RT.actions.addFavorite({
        sourceLabel: t ? t.name : '随机表',
        text: cur.text,
      });
    },

    updateFavoriteNote: function (id, note) {
      const f = S.set.favorites.find(function (x) { return x.id === id; });
      if (!f) return;
      f.note = String(note == null ? '' : note);
      touch();
    },

    deleteFavorite: function (id) {
      S.set.favorites = S.set.favorites.filter(function (f) { return f.id !== id; });
      touch();
      refresh('main');
    },

    saveTextAsEntry: function (tableId, text) {
      const t = findTable(tableId);
      if (!t) return;
      t.entries.push(RT.entry(text, 1));
      touch();
      RT.toast('已存入表「' + t.name + '」');
    },

    replayHistory: function (id) {
      const h = S.set.history.find(function (x) { return x.id === id; });
      if (!h) return;
      if (h.kind === 'table') {
        const t = findTable(h.refId);
        if (!t) { RT.toast('原表已被删除', 'warn'); return; }
        S.ui.view = 'tables';
        S.ui.tableId = t.id;
        const res = RT.rollTable(t, S.set.tables, h.seed, 1);
        S.results.table = { tableId: t.id, seed: h.seed, texts: res.texts, text: res.text, dice: res.dice, warnings: res.warnings, ts: Date.now() };
      } else {
        const c = findCombo(h.refId);
        if (!c) { RT.toast('原组合已被删除', 'warn'); return; }
        S.ui.view = 'combos';
        S.ui.comboId = c.id;
        const res = RT.rollCombo(c, S.set.tables, h.seed, {});
        S.results.combo = { comboId: c.id, seed: h.seed, values: res.values, text: res.text, warnings: res.warnings, ts: Date.now() };
      }
      refresh('all');
    },

    clearHistory: function () {
      S.set.history = [];
      touch();
      refresh('main');
    },

    /* --- 导入导出 --- */
    exportJSON: function () {
      return JSON.stringify(S.set, null, 2);
    },

    importJSON: function (text, strategy) {
      let parsed;
      try {
        parsed = JSON.parse(text);
      } catch (e) {
        throw new Error('JSON 解析失败：' + e.message);
      }
      const incoming = RT.normalizeSet(parsed);
      RT.snapshots.push('导入前');
      if (strategy === 'replace') {
        S.set = incoming;
      } else if (strategy === 'new') {
        incoming.id = RT.uid('set');
        incoming.name = incoming.name + '（导入）';
        S.set = incoming;
      } else {
        RT.mergeSet(S.set, incoming);
      }
      S.ui.tableId = S.set.tables[0] ? S.set.tables[0].id : null;
      S.ui.comboId = S.set.combos[0] ? S.set.combos[0].id : null;
      S.results = { table: null, combo: null };
      touch();
      refresh('all');
      return { tables: incoming.tables.length, combos: incoming.combos.length };
    },

    exportCSV: function (tableId) {
      const t = findTable(tableId);
      if (!t) return '';
      return RT.csv.stringify(RT.csv.entriesToRows(t));
    },

    importCSV: function (tableId, text, replace) {
      const t = findTable(tableId);
      if (!t) return 0;
      const entries = RT.csv.rowsToEntries(RT.csv.parse(text));
      if (!entries.length) return 0;
      if (replace) {
        RT.snapshots.push('CSV 覆盖：' + t.name);
        t.entries = entries;
      } else {
        t.entries = t.entries.concat(entries);
      }
      touch();
      refresh('all');
      return entries.length;
    },

    /* --- 偏好 --- */
    setTheme: function (theme) {
      S.prefs.theme = theme;
      RT.storage.set(KEYS.prefs, JSON.stringify(S.prefs));
      if (RT.app) RT.app.applyTheme();
      refresh('all');
    },

    setFontScale: function (scale) {
      S.prefs.fontScale = Math.min(1.5, Math.max(0.85, Number(scale) || 1));
      RT.storage.set(KEYS.prefs, JSON.stringify(S.prefs));
      if (RT.app) RT.app.applyTheme();
    },
  };

  RT.currentTable = currentTable;
  RT.currentCombo = currentCombo;

})(window.RT = window.RT || {});

/* ============================================================
 * 06. 工作区：战役、模块注册表、按战役存储、工作区备份
 *     战役是容器；笔记 / 记录表（及以后新增的模块）都挂在战役下。
 *     规则速查与随机表是全局数据，不进战役。
 * ============================================================ */
(function (RT) {
  'use strict';

  const KEYS = {
    campaigns: 'trpg_rt_campaigns_v1',
    notes: 'trpg_rt_notes_v1',
    sheets: 'trpg_rt_sheets_v1',
    templates: 'trpg_rt_templates_v1',
    sheetTemplates: 'trpg_rt_sheet_templates_v1', // 旧 key，仅用于兼容导入
    dmBoard: 'trpg_rt_dm_board_v1',
    dmLib: 'trpg_rt_dm_lib_v1',
    rules: 'trpg_rt_rules_v1',
  };

  function uid(prefix) {
    return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }

  function read(key, fallback) {
    try {
      const raw = RT.storage.get(key);
      if (!raw) return fallback;
      const v = JSON.parse(raw);
      return v == null ? fallback : v;
    } catch (e) {
      return fallback;
    }
  }

  function write(key, val) {
    return RT.storage.set(key, JSON.stringify(val));
  }

  const ws = (RT.ws = {});
  ws.KEYS = KEYS;
  ws.uid = uid;
  ws.modules = [];

  /* ---------------- 战役 ---------------- */

  let campCache = null;

  function campState() {
    if (!campCache) {
      const v = read(KEYS.campaigns, null);
      campCache = v && Array.isArray(v.list) ? v : { activeId: null, list: [] };
      campCache.list = campCache.list.filter(function (c) {
        return c && typeof c.id === 'string' && c.id;
      });
      campCache.list.forEach(function (c) {
        if (!c.name) c.name = '未命名战役';
      });
      if (typeof campCache.activeId !== 'string') campCache.activeId = null;
    }
    return campCache;
  }

  ws.saveCampaigns = function () {
    write(KEYS.campaigns, campState());
  };

  ws.campaigns = function () {
    return campState().list;
  };

  ws.campaign = function (id) {
    return campState().list.filter(function (c) { return c.id === id; })[0] || null;
  };

  ws.activeCampaign = function () {
    const st = campState();
    let c = st.list.filter(function (x) { return x.id === st.activeId; })[0];
    if (!c && st.list.length) {
      c = st.list[0];
      st.activeId = c.id;
    }
    return c || null;
  };

  ws.setActiveCampaign = function (id) {
    const st = campState();
    st.activeId = id || null;
    ws.saveCampaigns();
  };

  ws.addCampaign = function (name, opts) {
    const st = campState();
    const now = new Date().toISOString();
    const c = {
      id: uid('cp'),
      name: String(name || '').trim() || '战役 ' + (st.list.length + 1),
      createdAt: now,
      updatedAt: now,
    };
    st.list.push(c);
    st.activeId = c.id;
    ws.saveCampaigns();
    if (opts && opts.seed === false) return c;
    ws.modules.forEach(function (m) {
      if (typeof m.seed === 'function') {
        try { m.seed(c.id); } catch (e) { console.warn('种子失败', m.id, e); }
      }
    });
    return c;
  };

  ws.renameCampaign = function (id, name) {
    const c = ws.campaign(id);
    if (!c) return false;
    const next = String(name || '').trim();
    if (!next) return false;
    c.name = next;
    c.updatedAt = new Date().toISOString();
    ws.saveCampaigns();
    return true;
  };

  ws.touchCampaign = function (id) {
    const c = ws.campaign(id);
    if (!c) return;
    c.updatedAt = new Date().toISOString();
    ws.saveCampaigns();
  };

  ws.removeCampaign = function (id) {
    const st = campState();
    const i = st.list.findIndex(function (c) { return c.id === id; });
    if (i < 0) return false;
    st.list.splice(i, 1);
    ws.modules.forEach(function (m) {
      if (m.key) deleteKeyData(m.key, id);
      if (typeof m.clear === 'function') {
        try { m.clear(id); } catch (e) { /* ignore */ }
      }
    });
    if (st.activeId === id) st.activeId = st.list[0] ? st.list[0].id : null;
    ws.saveCampaigns();
    return true;
  };

  /** 该战役在各模块下的数据量，用于删除前提示 */
  ws.campaignCounts = function (id) {
    const out = [];
    ws.modules.forEach(function (m) {
      if (typeof m.count !== 'function') return;
      let n = 0;
      try { n = m.count(id) || 0; } catch (e) { n = 0; }
      if (n) out.push({ id: m.id, name: m.name, n: n, unit: m.unit || '条' });
    });
    return out;
  };

  /* ---------------- 按战役存储 ---------------- */

  function readKeyData(key) {
    const v = read(key, {});
    return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  }
  function deleteKeyData(key, cid) {
    const all = readKeyData(key);
    if (!Object.prototype.hasOwnProperty.call(all, cid)) return;
    delete all[cid];
    write(key, all);
  }

  ws.store = function (key) {
    return {
      all: function () {
        return readKeyData(key);
      },
      get: function (cid) {
        return readKeyData(key)[cid] || null;
      },
      set: function (cid, val) {
        const all = readKeyData(key);
        all[cid] = val;
        return write(key, all);
      },
      del: function (cid) {
        deleteKeyData(key, cid);
      },
    };
  };

  /* ---------------- 全局：规则包 ---------------- */

  ws.rulesState = function () {
    const v = read(KEYS.rules, null);
    if (!v || !Array.isArray(v.packs)) return { activeId: null, packs: [] };
    v.packs = v.packs.filter(function (p) { return p && p.id && typeof p.name === 'string'; });
    return v;
  };

  ws.saveRules = function (st) {
    return write(KEYS.rules, st);
  };

  /* ---------------- 模块注册 ---------------- */

  ws.register = function (m) {
    if (!m || !m.id) return null;
    ws.modules.push(m);
    return m;
  };

  ws.module = function (id) {
    return ws.modules.filter(function (m) { return m.id === id; })[0] || null;
  };

  /* ---------------- 工作区备份 ---------------- */

  ws.exportWorkspace = function () {
    const mods = {};
    ws.modules.forEach(function (m) {
      if (m.key) mods[m.key] = readKeyData(m.key);
    });
    return JSON.stringify({
      kind: 'trpg-workspace',
      schemaVersion: 1,
      exportedAt: new Date().toISOString(),
      set: RT.state.set,
      campaigns: campState(),
      modules: mods,
      templates: RT.tpl ? RT.tpl.exportData() : { list: [] },
      dmLib: RT.dmLib ? RT.dmLib.read() : read(KEYS.dmLib, { items: [] }),
      rules: ws.rulesState(),
      prefs: { theme: RT.state.prefs.theme, fontScale: RT.state.prefs.fontScale },
    }, null, 2);
  };

  /** 判断一段 JSON 文本属于哪种文件 */
  ws.detectKind = function (parsed) {
    if (!parsed || typeof parsed !== 'object') return 'unknown';

    if (Array.isArray(parsed.packs) && !parsed.tables) return 'rules';
    if (Array.isArray(parsed.tables) || Array.isArray(parsed.combos)) return 'set';

  };

  ws.importWorkspace = function (text, strategy) {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      throw new Error('JSON 解析失败：' + e.message);
    }
    if (ws.detectKind(parsed) !== 'workspace') throw new Error('这不是工作区备份文件');

    RT.snapshots.push('导入工作区前');
    const replace = strategy === 'replace';
    const st = campState();
    if (replace) {
      st.list = [];
      st.activeId = null;
      ws.modules.forEach(function (m) { if (m.key) write(m.key, {}); });
    }

    // 表组
    if (parsed.set && (Array.isArray(parsed.set.tables) || Array.isArray(parsed.set.combos))) {
      const incoming = RT.normalizeSet(parsed.set);
      if (replace) {
        RT.state.set = incoming;
      } else if (RT.mergeSet) {
        RT.mergeSet(RT.state.set, incoming);
      }
    }

    // 战役
    const idMap = {};
    let addedCamp = 0;
    ((parsed.campaigns && parsed.campaigns.list) || []).forEach(function (c) {
      if (!c || !c.id) return;
      const exist = st.list.filter(function (x) { return x.id === c.id; })[0];
      if (exist) {
        if (!replace && c.name && c.name !== exist.name) exist.name = c.name + '（导入）';
        idMap[c.id] = exist.id;
        return;
      }
      const copy = {
        id: c.id,
        name: c.name || '导入的战役',
        createdAt: c.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };
      st.list.push(copy);
      idMap[c.id] = copy.id;
      addedCamp++;
    });
    if (parsed.campaigns && parsed.campaigns.activeId && idMap[parsed.campaigns.activeId]) {
      st.activeId = idMap[parsed.campaigns.activeId];
    } else if (!st.activeId && st.list[0]) {
      st.activeId = st.list[0].id;
    }
    ws.saveCampaigns();

    // 模块数据
    const mods = parsed.modules || {};
    Object.keys(mods).forEach(function (key) {
      const isModuleKey = ws.modules.some(function (m) { return m.key === key; });
      if (!isModuleKey) return;
      const src = mods[key] || {};
      const dst = replace ? {} : readKeyData(key);
      Object.keys(src).forEach(function (cid) {

        dst[target] = src[cid];
      });
      write(key, dst);
    });

    // 模板（记录表 + 卡片）：新格式直接并入；旧工作区的 sheetTemplates 现场转布局
    if (RT.tpl) {
      const incoming = [];
      if (parsed.templates && Array.isArray(parsed.templates.list)) {
        incoming.push.apply(incoming, parsed.templates.list);
      }
      if (parsed.sheetTemplates && Array.isArray(parsed.sheetTemplates.list)) {
        incoming.push.apply(incoming, parsed.sheetTemplates.list);
      }
      incoming.forEach(function (t) {
        if (!t || !t.name) return;
        const isCard = t.kind === 'card';
        const hasTree = t.layout && !Array.isArray(t.layout) && Array.isArray(t.layout.children);
        const layout = hasTree ? t.layout
          : Array.isArray(t.layout) ? RT.tpl.convertV1(t.layout) : null;
        if (!layout) return;
        const copy = JSON.parse(JSON.stringify(t));
        copy.id = uid('st');
        copy.name = t.name + '（导入）';
        copy.builtin = false;
        copy.version = 1;
        copy.layout = layout;
        copy.kind = isCard ? 'card' : 'sheet';
        copy.cardKind = isCard ? (t.cardKind === 'custom' || !t.cardKind ? 'special' : t.cardKind) : null;
        RT.tpl.save(copy);

    }

    // 规则包
    if (parsed.rules && Array.isArray(parsed.rules.packs)) {

      const seen = {};
      cur.packs.forEach(function (p) { seen[p.name] = true; });
      parsed.rules.packs.forEach(function (p) {

          cur.packs.push({
            id: uid('rp'),
            name: p.name,
            source: p.source || '',
            md: typeof p.md === 'string' ? p.md : '',

          });
        }
      });
      if (!cur.activeId && cur.packs[0]) cur.activeId = cur.packs[0].id;

    }

    // DM 库（全局）：按 库 + 名称 去重合并
    if (parsed.dmLib && Array.isArray(parsed.dmLib.items) && RT.dmLib) {
      const seen = {};
      RT.dmLib.read().items.forEach(function (it) { seen[it.lib + '/' + it.name] = true; });
      parsed.dmLib.items.forEach(function (it) {
        if (!it || !it.lib || !it.name) return;
        const key = it.lib + '/' + it.name;
        if (seen[key]) return;
        RT.dmLib.add({
          lib: it.lib,
          tplId: it.tplId || '',
          name: it.name,
          meta: it.meta && typeof it.meta === 'object' ? it.meta : {},
          values: it.values && typeof it.values === 'object' ? it.values : {},
        });
        seen[key] = true;
      });

    RT.touch && RT.touch();
    RT.refresh && RT.refresh('all');

  };

  /** 单个战役导出为 Markdown（按模块注册顺序拼接） */
  ws.exportCampaignMd = function (cid) {
    const c = ws.campaign(cid);
    if (!c) return '';
    const L = [];
    L.push('# ' + c.name);
    L.push('');
    L.push('> 导出时间：' + new Date().toLocaleString());
    ws.modules.forEach(function (m) {
      if (typeof m.exportMd !== 'function') return;
      let block = '';
      try { block = m.exportMd(cid) || ''; } catch (e) { block = ''; }
      if (!block.trim()) return;
      L.push('');
      L.push('## ' + m.name);
      L.push('');
      L.push(block.trim());
    });
    L.push('');
    return L.join('\n');
  };

  /* ---------------- 装表包（去重合并） ---------------- */

  ws.installPack = function (pack, opts) {
    const S = RT.state;
    const set = S.set;
    const report = { tables: 0, combos: 0, folders: 0, skippedTables: 0, skippedCombos: 0 };

    const tableByName = {};
    set.tables.forEach(function (t) { tableByName[String(t.name).trim()] = t.id; });
    const comboByName = {};
    set.combos.forEach(function (c) { comboByName[String(c.name).trim()] = c.id; });
    /* 只与「装包前已有的表」去重；包内不同分组允许同名（如 03/04 都有「状态」） */
    const presetTables = {};
    Object.keys(tableByName).forEach(function (k) { presetTables[k] = tableByName[k]; });

    const folderMap = {};
    const folderByName = {};
    set.folders.forEach(function (f) {
      folderByName[(f.parentId || '') + '/' + String(f.name).trim()] = f.id;
    });

    (pack.folders || []).forEach(function (f) {
      const parentKey = f.parentId ? (folderMap[f.parentId] || '') : '';
      const key = parentKey + '/' + String(f.name).trim();
      if (folderByName[key]) {
        folderMap[f.id] = folderByName[key];
        return;
      }
      const nf = {
        id: uid('fd'),
        name: String(f.name).trim(),
        parentId: parentKey || null,
        collapsed: false,
      };
      set.folders.push(nf);
      folderMap[f.id] = nf.id;
      folderByName[key] = nf.id;
      report.folders++;
    });

    const idMap = {};
    (pack.tables || []).forEach(function (t) {
      const name = String(t.name || '').trim();
      if (!name) return;
      if (presetTables[name]) {
        idMap[t.id] = presetTables[name];
        report.skippedTables++;
        return;
      }
      const rows = (t.entries || []).map(function (e) {
        return {
          id: uid('e'),
          text: String(e && e.text != null ? e.text : ''),
          weight: e && e.weight != null ? Number(e.weight) : 1,
          range: e && Array.isArray(e.range) && e.range.length === 2
            ? [Number(e.range[0]), Number(e.range[1])] : null,
        };
      }).filter(function (e) { return e.text.trim(); });

      /* 顺序表（1..N 各占一格且骰面数 = 条目数）：去掉区间，
         让编辑器显示干净，掷法等价于等概率抽一条 */
      let seq = rows.length > 1;
      rows.forEach(function (e, i) {
        if (!e.range || e.range[0] !== i + 1 || e.range[1] !== i + 1) seq = false;
      });
      const faces = (String(t.dice || '').match(/^\d*d(\d+)$/i) || [])[1];
      const dropDice = !!(seq && faces && Number(faces) === rows.length);
      if (dropDice) {
        rows.forEach(function (e) { e.range = null; });
      }

      const nt = {
        id: uid('t'),
        name: name,
        folderId: t.folderId ? (folderMap[t.folderId] || null) : null,
        tags: Array.isArray(t.tags) ? t.tags.slice() : [],
        dice: dropDice ? null : (t.dice || null),
        entries: rows,
      };
      set.tables.push(nt);
      idMap[t.id] = nt.id;
      tableByName[name] = nt.id;
      report.tables++;

    (pack.combos || []).forEach(function (c) {
      const name = String(c.name || '').trim();
      if (!name) return;
      if (comboByName[name]) {
        report.skippedCombos++;
        return;
      }
      const fields = (c.fields || []).map(function (f) {
        const tid = idMap[f.tableId] || null;
        if (!tid) return null;
        return {
          id: uid('f'),
          tableId: tid,
          label: String(f.label || '字段'),
          rolls: Math.min(20, Math.max(1, Number(f.rolls) || 1)),
          sep: typeof f.sep === 'string' ? f.sep : '、',
          locked: !!f.locked,
          lockedValue: '',
        };
      }).filter(Boolean);
      if (!fields.length) {
        report.skippedCombos++;
        return;
      }
      set.combos.push({
        id: uid('c'),
        name: name,
        fields: fields,
        template: typeof c.template === 'string' ? c.template : '',
      });
      comboByName[name] = true;

        '<div class="empty-actions"><button class="btn gold" data-act="new-combo">' + RT.icon('plus', 15) + ' 新建组合</button></div>' +
        '</div>'
      );
    }

    const tableOptions = function (selected) {
      if (!S.set.tables.length) return '<option value="">（先去建一张表）</option>';
      const opt = function (t) {
        return '<option value="' + t.id + '"' + (t.id === selected ? ' selected' : '') + '>' + RT.esc(t.name) + '</option>';
      };
      if (!S.set.folders.length) return S.set.tables.map(opt).join('');

      const out = [];
      const walk = function (parentId, prefix) {
        S.set.folders.filter(function (f) { return (f.parentId || null) === (parentId || null); }).forEach(function (f) {
          const label = prefix ? prefix + ' / ' + f.name : f.name;
          const items = S.set.tables.filter(function (t) { return t.folderId === f.id; });
          if (items.length) {
            out.push('<optgroup label="' + RT.esc(label) + '">' + items.map(opt).join('') + '</optgroup>');
          }
          walk(f.id, label);
        });
      };
      walk(null, '');

      const ungrouped = S.set.tables.filter(function (t) { return !t.folderId; });
      if (ungrouped.length) out.push('<optgroup label="未分组">' + ungrouped.map(opt).join('') + '</optgroup>');

        '<button class="mini" data-act="field-up" title="上移">' + RT.icon('up', 13) + '</button>' +
        '<button class="mini" data-act="field-down" title="下移">' + RT.icon('down', 13) + '</button>' +
        '<button class="mini danger" data-act="field-del" title="删除字段">' + RT.icon('trash', 13) + '</button>' +
        '</span></div>'
      );
    }).join('');

    const tokens = combo.fields.map(function (f) {
      return '<button class="token" data-act="insert-token" data-token="{'+ RT.attr(f.label) +'}">{' + RT.esc(f.label) + '}</button>';
    }).join('');

    return (
      '<div class="view">' +
      '<div class="view-head">' +
      '<div class="head-main">' +
      '<input class="title-input" data-act="combo-name" value="' + RT.attr(combo.name) + '" placeholder="组合名">' +
      '<div class="meta-row"><span class="count">' + combo.fields.length + ' 个字段 · ' + combo.fields.reduce(function (a, f) { return a + (Number(f.rolls) || 1); }, 0) + ' 次抽取</span></div>' +
      '</div>' +
      '<div class="head-actions">' +
      '<button class="btn ghost small" data-act="combo-duplicate">' + RT.icon('copy', 14) + ' 复制</button>' +
      '<button class="btn ghost small danger" data-act="combo-delete">' + RT.icon('trash', 14) + ' 删除</button>' +
      '</div></div>' +

      '<div class="split">' +
      '<div class="split-main">' +
      '<div class="panel">' +
      '<div class="panel-head"><strong>字段</strong><span class="dim">每个字段从一张表里取值</span></div>' +
      '<div class="field-list">' + (fieldRows || '<div class="dim pad">还没有字段</div>') + '</div>' +
      '<button class="btn ghost small" data-act="field-add">' + RT.icon('plus', 14) + ' 添加字段</button>' +

      '<div class="panel">' +

              })),
