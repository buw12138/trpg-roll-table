    if (comp === 'table') node.columns = [{ key: 'c1', label: '列 1', type: 'text' }];
    if (comp === 'repeat') {
      node.min = 1;
      node.itemLabel = '条目';
      node.fields = [{ id: RT.ws.uid('f'), type: 'text', label: '字段 1', width: 'half' }];
    }
    if (comp === 'chips' || comp === 'stats' || comp === 'pairs') {
      node.fields = [{ id: RT.ws.uid('f'), label: '字段 1' }];
    }
    if (comp === 'tracker') {
      node.max = 6;
      node.label = '计数';
    }
    return node;
  }

  function makeRow() {
    return { id: RT.ws.uid('r'), type: 'row', start: 1, span: 12, gap: 10, children: [] };
  }

  function makeGroup() {
    return { id: RT.ws.uid('g'), type: 'group', start: 1, span: 12, title: '分组', boxed: false, children: [] };
  }

  function makeNode(kind) {
    if (kind === 'row') return makeRow();
    if (kind === 'group') return makeGroup();
    return makeField(kind);
  }

  /* ---------------- 示例值 ---------------- */

  function demoField(node) {
    switch (node.comp) {
      case 'text': return node.placeholder || '示例文本';
      case 'textarea': return node.placeholder || '示例内容…';
      case 'number': return '0';
      case 'date': return '2026-01-01';
      case 'check': return false;
      case 'select': return (node.options && node.options[0]) || '';
      case 'table':
      case 'list':
      case 'repeat': return [];
      case 'chips': {
        const o = {};
        (node.fields || []).forEach(function (f) { o[f.id] = f.label === '位阶' ? '1' : '示例'; });
        return o;
      }
      case 'pairs': {
        const o = {};
        (node.fields || []).forEach(function (f) { o[f.id] = '值'; });
        return o;
      }
      case 'stats': {
        const o = {};
        (node.fields || []).forEach(function (f) { o[f.id] = '0'; });
        return o;
      }
      case 'tracker': return { max: Math.max(1, Number(node.max) || 6), marked: 0 };
      case 'counter': return { value: 0, max: Math.max(1, Number(node.max) || 6) };
      case 'dice': {
        const dual = node.mode === 'duality';
        return dual
          ? { mode: 'duality', expr: '2d12', last: { kind: 'duality', hope: 7, fear: 4, total: 11, outcome: '希望' } }
          : { mode: 'normal', expr: node.expr || '1d20', last: { kind: 'normal', total: 14, text: (node.expr || '1d20') + ' → 14 = 14' } };
      }
      case 'features': return [{ name: '特性名', type: '被动', desc: '示例描述，用来预览特性列表。', question: '示例问题？' }];
      case 'para': return '示例段落，用来预览卡片排版。';
      case 'note': return '';
      default: return '';
    }
  }

  function sampleValues() {
    const vals = {};
    T.walk(st.tpl.layout, function (n) { if (n.type === 'field') vals[n.id] = demoField(n); });
    const s = st.tpl.sample || {};
    Object.keys(s).forEach(function (k) {
      const a = vals[k];
      const b = s[k];
      if (a && typeof a === 'object' && !Array.isArray(a) && b && typeof b === 'object' && !Array.isArray(b)) {
        vals[k] = Object.assign({}, a, b);
      } else {
        vals[k] = b;
      }
    });
    return vals;
  }

  /* ---------------- 画布渲染 ---------------- */

  function fieldPreview(node) {
    const vals = sampleValues();
    const val = vals[node.id];
    if (st.tpl.kind === 'card' && RT.dmCard) {
      return RT.dmCard.renderField(node, node.id, val, { preview: true });
    }
    return T.renderSheetField(node, val, { preview: true });
  }

  function childrenHtml(list, path, emptyText) {
    if (!list || !list.length) return '<div class="tb-container-empty">' + emptyText + '</div>';
    return list.map(function (c, i) { return nodeHtml(c, path + '.' + i); }).join('');
  }

  function nodeHtml(node, path) {
    const b = T.box(node);
    const style = 'grid-column:' + b.start + ' / span ' + b.span;
    let inner;
    if (node.type === 'field') {
      inner = fieldPreview(node);
    } else if (node.type === 'row') {
      inner = '<div class="tb-row sx-grid12" style="gap:' + (Number(node.gap) || 10) + 'px">' +
        childrenHtml(node.children, path, '把组件拖进这一行') +
        '</div>';
    } else {
      inner = '<div class="tb-group-box' + (node.boxed ? ' boxed' : '') + '">' +
        '<div class="tb-group-title">' + esc(node.title || '分组') + '</div>' +
        '<div class="tb-group-body sx-grid12">' +
        childrenHtml(node.children, path, '把组件拖进这个分组') +
        '</div></div>';
    }
    return '<div class="tb-node tb-' + node.type + (st.sel === path ? ' selected' : '') +
      '" data-path="' + path + '" style="' + style + '">' +
      '<div class="tb-bar">' +
      '<span class="tb-grip" draggable="true" data-grip="' + path + '" title="按住拖动">⠿</span>' +
      '<span class="tb-bar-name">' + esc(nodeName(node)) + '</span>' +
      '<button class="tb-mini" data-tb="span-" data-path="' + path + '" title="减一列">−</button>' +
      '<span class="tb-span">' + b.span + '</span>' +
      '<button class="tb-mini" data-tb="span+" data-path="' + path + '" title="加一列">＋</button>' +
      '<button class="tb-mini" data-tb="dup" data-path="' + path + '" title="复制">⧉</button>' +
      (node.type === 'field' ? '' : '<button class="tb-mini" data-tb="add" data-path="' + path + '" title="往这里加组件">⊞</button>') +
      '<button class="tb-mini danger" data-tb="del" data-path="' + path + '" title="删除">×</button>' +
      '</div>' +
      '<div class="tb-inner">' + inner + '</div>' +
      '<span class="tb-resize" data-path="' + path + '" title="拖我改宽度"></span>' +
      '</div>';
  }

  function scrollState(el) {
    return el ? { top: el.scrollTop, left: el.scrollLeft } : null;
  }

  function restoreScroll(el, s) {
    if (!el || !s) return;
    el.scrollTop = s.top;
    el.scrollLeft = s.left;
  }

  function paintCanvas() {
    if (!st || !st.root) return;
    const host = st.root.querySelector('#tb-canvas');
    if (!host) return;
    const keep = scrollState(host);
    const body = st.root.querySelector('.modal-body');
    const keepBody = scrollState(body);
    const stage = st.root.querySelector('#tb-stage');
    if (stage) {
      stage.style.width = st.tpl.kind === 'card' ? Math.max(200, Math.min(520, Number(st.tpl.width) || 300)) + 'px' : '';
    }
    host.className = 'tb-canvas' + (st.preview ? ' tb-preview' : '');
    host.setAttribute('data-kind', st.tpl.kind || 'sheet');
    const gridCls = 'tb-grid ' + (st.tpl.kind === 'card' ? 'dc-grid12' : 'sx-grid12') +
      (st.tpl.responsive === 'stack' ? ' sx-stack' : '');
    const kids = rootChildren().map(function (n, i) { return nodeHtml(n, String(i)); }).join('');
    host.innerHTML =
      (kids ? '<div class="' + gridCls + '">' + kids + '</div>' : '') +
      (kids ? '' : '<div class="tb-empty">从左边拖组件进来，或点组件名加到画布。<br>' +
        '两个「单行文本」默认各占 6 列，会自动并排。<span class="dim">（窄屏按模板设置自动堆叠）</span></div>') +
      (st.preview ? '' : '<div class="tb-drop-tail">拖到画布空白处 = 加到最后</div>');
    restoreScroll(host, keep);
    restoreScroll(body, keepBody);
    requestAnimationFrame(function () {
      restoreScroll(host, keep);
      restoreScroll(body, keepBody);
    });
  }

  /* ---------------- 检查器 ---------------- */

  function textRow(label, key, val) {
    return '<label class="tb-ins-row"><span>' + esc(label) + '</span>' +
      '<input data-tb-field="' + key + '" value="' + RT.attr(val == null ? '' : val) + '"></label>';
  }

  function numRow(label, key, val) {
    return '<label class="tb-ins-row"><span>' + esc(label) + '</span>' +
      '<input type="number" data-tb-field="' + key + '" value="' + RT.attr(val == null ? '' : val) + '"></label>';
  }

  function boolRow(label, key, on) {
    return '<label class="tb-ins-check"><input type="checkbox" data-tb-field="' + key + '"' +
      (on ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
  }

  function selectRow(label, key, value, options) {
    return '<label class="tb-ins-row"><span>' + esc(label) + '</span>' +
      '<select data-tb-field="' + key + '">' +
      options.map(function (o) {
        return '<option value="' + o[0] + '"' + (String(value) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></label>';
  }

  function columnsEditor(n) {
    const cols = n.columns || (n.columns = []);
    return '<div class="tb-ins-sub">表格列</div>' +
      cols.map(function (c, i) {
        return '<div class="tb-ins-line">' +
          '<input data-tb-col="label" data-idx="' + i + '" value="' + RT.attr(c.label || '') + '" placeholder="列名">' +
          '<select data-tb-col="type" data-idx="' + i + '">' +
          ['text', 'number', 'check'].map(function (tp) {
            return '<option value="' + tp + '"' + (c.type === tp ? ' selected' : '') + '>' +
              (tp === 'text' ? '文本' : tp === 'number' ? '数字' : '勾选') + '</option>';
          }).join('') +
          '</select>' +
          '<button class="mini danger" data-tb="col-del" data-idx="' + i + '">' + RT.icon('x', 12) + '</button>' +
          '</div>';
      }).join('') +
      '<button class="btn ghost small" data-tb="col-add">' + RT.icon('plus', 12) + ' 加一列</button>';
  }

  function repeatFieldsEditor(n) {
    const fields = n.fields || (n.fields = []);
    return '<div class="tb-ins-sub">组内字段</div>' +
      fields.map(function (f, i) {
        return '<div class="tb-ins-line">' +
          '<input data-tb-repfield="label" data-idx="' + i + '" value="' + RT.attr(f.label || '') + '" placeholder="字段名">' +
          '<select data-tb-repfield="type" data-idx="' + i + '">' +
          ['text', 'textarea', 'number', 'date', 'check', 'select', 'list'].map(function (tp) {
            return '<option value="' + tp + '"' + (f.type === tp ? ' selected' : '') + '>' +
              (T.TYPE_NAME[tp] || tp) + '</option>';
          }).join('') +
          '</select>' +
          '<button class="mini" data-tb="repfield-width" data-idx="' + i + '" title="切换半宽 / 整行">' +
          (f.width === 'half' ? '半宽' : '整行') + '</button>' +
          '<button class="mini danger" data-tb="repfield-del" data-idx="' + i + '">' + RT.icon('x', 12) + '</button>' +
          '</div>';
      }).join('') +
      '<button class="btn ghost small" data-tb="repfield-add">' + RT.icon('plus', 12) + ' 加一个字段</button>';
  }

  function subFieldsEditor(n) {
    const fields = n.fields || (n.fields = []);
    return '<div class="tb-ins-sub">字段</div>' +
      fields.map(function (f, i) {
        return '<div class="tb-ins-line">' +
          '<input data-tb-subfield="label" data-idx="' + i + '" value="' + RT.attr(f.label || '') + '" placeholder="字段名">' +
          '<button class="mini danger" data-tb="subfield-del" data-idx="' + i + '">' + RT.icon('x', 12) + '</button>' +
          '</div>';
      }).join('') +
      '<button class="btn ghost small" data-tb="subfield-add">' + RT.icon('plus', 12) + ' 加一个字段</button>';
  }

  function optionsEditor(n) {
    return '<label class="tb-ins-row tb-ins-col"><span>下拉选项</span>' +
      '<textarea rows="3" data-tb-field="optionsText">' + esc((n.options || []).join('\n')) + '</textarea></label>';
  }

  function compInspector(n) {
    let html = '';
    switch (n.comp) {
      case 'text':
        html += textRow('占位提示', 'placeholder', n.placeholder || '');
        break;
      case 'textarea':
      case 'note':
        html += textRow('占位提示', 'placeholder', n.placeholder || '');
        html += numRow('行数', 'rows', n.rows == null ? 2 : n.rows);
        break;
      case 'number':
        html += textRow('占位提示', 'placeholder', n.placeholder || '');
        html += numRow('步长', 'step', n.step == null ? 1 : n.step);
        break;
      case 'select':
        html += optionsEditor(n);
        break;
      case 'para':
        html += boolRow('斜体段落', 'italic', !!n.italic);
        break;
      case 'table':
        html += columnsEditor(n);
        break;
      case 'repeat':
        html += numRow('至少几组', 'min', n.min == null ? 1 : n.min);
        html += textRow('条目称呼', 'itemLabel', n.itemLabel || '');
        html += repeatFieldsEditor(n);
        break;
      case 'chips':
      case 'stats':
      case 'pairs':
        html += subFieldsEditor(n);
        break;
      case 'tracker':
        html += numRow('默认格数', 'max', n.max == null ? 6 : n.max);
        break;
      case 'counter':
        html += numRow('默认上限', 'max', n.max == null ? 6 : n.max);
        break;
      case 'dice':
        html += selectRow('骰子类型', 'mode', n.mode === 'duality' ? 'duality' : 'normal', [
          ['normal', '通用骰'],
          ['duality', '二元骰（2d12 希望 / 恐惧）'],
        ]);
        html += textRow('默认骰式', 'expr', n.expr || '1d20');
        break;
      default:
        break;
    }
    return html;
  }

  function tplRow(label, key, val, type) {
    return '<label class="tb-ins-row"><span>' + esc(label) + '</span>' +
      '<input ' + (type ? 'type="' + type + '" ' : '') + 'data-tpl-field="' + key +
      '" value="' + RT.attr(val == null ? '' : val) + '"></label>';
  }

  function tplInspector() {
    const t = st.tpl;
    let html = '<div class="tb-ins-head"><span>模板设置</span></div>' +
      tplRow('模板名', 'name', t.name) +
      '<p class="tb-ins-note">种类：' + esc(T.kindName(t)) + '。画布里点任意组件可编辑它的属性。</p>' +
      '<div class="tb-ins-row"><span>窄屏</span><select data-tpl-field="responsive">' +
      '<option value="stack"' + (t.responsive !== 'keep' ? ' selected' : '') + '>自动堆成一列</option>' +
      '<option value="keep"' + (t.responsive === 'keep' ? ' selected' : '') + '>保持栅格</option>' +
      '</select></div>';
    if (t.kind === 'card') {
      html += tplRow('卡片宽度', 'width', Math.max(200, Math.min(520, Number(t.width) || 300)), 'number');
      html += '<div class="tb-ins-row"><span>强调色</span><select data-tpl-field="accent">' +
        [['', '默认'], ['gold', '金'], ['danger', '赤'], ['info', '青'], ['muted', '灰']].map(function (p) {
          return '<option value="' + p[0] + '"' + ((t.accent || '') === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
        }).join('') + '</select></div>';
    }
    html += '<p class="tb-ins-note">两个短组件各占 6 列就会自动并排；想更自由就改「起始列」。' +
      '容器最多套两层。</p>';
    return html;
  }

  const CONTAINER_DESC = {
    row: '横向容器：把几个短组件并排放，比如「场次 + 日期」或三个属性。窄屏会按模板设置自动堆成一列。',
    group: '分区容器：带标题，把相关组件框在一起，比如「世界的六条真相」。分组里还能放行，最多套两层。',
  };

  function compDesc(type) {
    const c = T.COMPONENTS.filter(function (x) { return x.type === type; })[0];
    return c ? (c.desc || '') : '';
  }

  function helpHtml(text) {
    return text ? '<p class="tb-ins-help">' + esc(text) + '</p>' : '';
  }

  function paintInspector() {
    if (!st || !st.root) return;
    const host = st.root.querySelector('#tb-inspector');
    if (!host) return;
    const keep = scrollState(host);
    const body = st.root.querySelector('.modal-body');
    const keepBody = scrollState(body);
    if (!st.sel) {
      host.innerHTML = tplInspector();
      restoreScroll(host, keep);
      restoreScroll(body, keepBody);
      return;
    }
    const loc = locate(st.sel);
    if (!loc) {
      st.sel = null;
      host.innerHTML = tplInspector();
      restoreScroll(host, keep);
      restoreScroll(body, keepBody);
      return;
    }
    const n = loc.node;
    let html = '<div class="tb-ins-head"><span>' + esc(nodeName(n)) + '</span>' +
      '<button class="mini" data-tb="sel-close" title="取消选择">' + RT.icon('x', 12) + '</button></div>';
    if (n.type === 'row') {
      html += helpHtml(CONTAINER_DESC.row);
      html += numRow('列间距', 'gap', n.gap == null ? 10 : n.gap);
    } else if (n.type === 'group') {
      html += helpHtml(CONTAINER_DESC.group);
      html += textRow('分区标题', 'title', n.title || '');
      html += boolRow('显示外框', 'boxed', !!n.boxed);
    } else {
      html += helpHtml(compDesc(n.comp));
      if (n.comp !== 'heading') html += textRow('标签', 'label', n.label || '');
      html += compInspector(n);
    }
    html += '<div class="tb-ins-sub">位置</div>' +
      numRow('起始列', 'start', T.box(n).start) +
      numRow('跨列', 'span', T.box(n).span);
    host.innerHTML = html;
    restoreScroll(host, keep);
    restoreScroll(body, keepBody);
  }

  /* ---------------- 顶部 / 外壳 ---------------- */

  function paletteHtml() {
    const isCard = st.tpl.kind === 'card';
    const comps = T.compsFor(isCard ? 'card' : 'sheet');
    return '<div class="tb-pal-head">容器</div>' +
      '<button class="tb-chip" draggable="true" data-comp="row" title="' + RT.attr(CONTAINER_DESC.row) + '">行</button>' +
      '<button class="tb-chip" draggable="true" data-comp="group" title="' + RT.attr(CONTAINER_DESC.group) + '">分组</button>' +
      '<div class="tb-pal-head">组件</div>' +
      comps.map(function (c) {
        return '<button class="tb-chip" draggable="true" data-comp="' + c.type + '" title="' +
          RT.attr(c.desc || c.name) + '">' + esc(c.name) + '</button>';
      }).join('') +
      '<p class="tb-pal-tip">拖进画布任意位置；单击加到选中容器，没选中就加到最后。选中组件后右侧会显示它的用途说明。</p>';
  }

  function shell() {
    return '<div class="tb-wrap">' +
      '<div class="tb-top">' +
      '<label class="dim">模板名</label>' +
      '<input id="tb-name" class="grow" value="' + RT.attr(st.tpl.name || '') + '" autocomplete="off">' +
      '<span class="tb-kind">' + esc(T.kindName(st.tpl)) + '</span>' +
      '<button class="btn ghost small" data-tb="undo">撤销</button>' +
      '<button class="btn ghost small" data-tb="redo">重做</button>' +
      '<button class="btn ghost small" data-tb="preview">成品预览</button>' +
      '<button class="btn ghost small" data-tb="discard">丢弃草稿</button>' +
      '<button class="btn gold small" data-tb="save">保存</button>' +
      '<button class="btn ghost small" data-tb="save-close">保存并关闭</button>' +
      '<button class="btn ghost small" data-tb="cancel">取消</button>' +
      '</div>' +
      '<div class="tb-main">' +
      '<div class="tb-palette">' + paletteHtml() + '</div>' +
      '<div class="tb-stage">' +
      '<div class="tb-stage-inner" id="tb-stage"><div class="tb-canvas" id="tb-canvas"></div></div>' +
      '<div class="tb-stage-foot">拖 ⠿ 移动 · 拖右边缘改宽度 · Delete 删除 · Ctrl+Z 撤销 · 输入框里填的是示例值</div>' +
      '</div>' +
      '<div class="tb-inspector" id="tb-inspector"></div>' +
      '</div></div>';
  }

  function syncName() {
    if (!st || !st.root) return;
    const inp = st.root.querySelector('#tb-name');
    if (inp && inp.value !== st.tpl.name) inp.value = st.tpl.name || '';
  }

  function updateButtons() {
    if (!st || !st.root) return;
    const undo = st.root.querySelector('[data-tb="undo"]');
    const redo = st.root.querySelector('[data-tb="redo"]');
    const prev = st.root.querySelector('[data-tb="preview"]');
    if (undo) undo.disabled = !st.undo.length;
    if (redo) redo.disabled = !st.redo.length;
    if (prev) prev.classList.toggle('active', !!st.preview);
  }

  function refreshAll() {
    paintCanvas();
    paintInspector();
    syncName();
    updateButtons();
    saveDraft();
  }

  function refreshCanvas() {
    paintCanvas();
    updateButtons();
    saveDraft();
  }

  /* ---------------- 撤销 / 草稿 ---------------- */

  function snapshot() {
    return clone({
      layout: st.tpl.layout,
      name: st.tpl.name,
      sample: st.tpl.sample || {},
      width: st.tpl.width,
      accent: st.tpl.accent,
      responsive: st.tpl.responsive,
    });
  }

  function pushUndo() {
    st.undo.push(snapshot());
    if (st.undo.length > 60) st.undo.shift();
    st.redo.length = 0;
  }

  function applySnapshot(s) {
    st.tpl.layout = clone(s.layout);
    st.tpl.name = s.name;
    st.tpl.sample = clone(s.sample || {});
    if (s.width != null) st.tpl.width = s.width;
    if (s.accent != null) st.tpl.accent = s.accent;
    if (s.responsive) st.tpl.responsive = s.responsive;
    st.sel = null;
    refreshAll();
  }

  function undo() {
    if (!st.undo.length) return;
    st.redo.push(snapshot());
    applySnapshot(st.undo.pop());
  }

  function redo() {
    if (!st.redo.length) return;
    st.undo.push(snapshot());
    applySnapshot(st.redo.pop());
  }

  function saveDraft() {
    if (!st) return;
    if (draftTimer) clearTimeout(draftTimer);
    draftTimer = setTimeout(function () {
      if (!st) return;
      try {
        RT.storage.set(DRAFT_KEY, JSON.stringify({ id: st.tpl.id, tpl: st.tpl, ts: Date.now() }));
      } catch (e) { /* 超限就算了 */ }
    }, 400);
  }

  function clearDraft() {
    if (draftTimer) { clearTimeout(draftTimer); draftTimer = null; }
    try { RT.storage.del(DRAFT_KEY); } catch (e) { /* ignore */ }
  }

  function loadDraft(id) {
    try {
      const raw = RT.storage.get(DRAFT_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (d && d.id === id && d.tpl) return d.tpl;
    } catch (e) { /* ignore */ }
    return null;
  }

  /* ---------------- 添加 / 删除 / 复制 ---------------- */

  function insertionTarget() {
    if (!st.sel) {
      return { arr: rootChildren(), index: rootChildren().length, depth: 0 };
    }
    const loc = locate(st.sel);
    if (!loc) return { arr: rootChildren(), index: rootChildren().length, depth: 0 };
    if (loc.node.type !== 'field') {
      const arr = loc.node.children || (loc.node.children = []);
      return { arr: arr, index: arr.length, depth: loc.depth + 1, container: loc.node };
    }
    return { arr: loc.arr, index: loc.idx + 1, depth: loc.depth };
  }

  function addComp(kind) {
    const target = insertionTarget();
    const node = makeNode(kind);
    if (node.type !== 'field' && target.depth > MAX_CONTAINER_DEPTH) {
      RT.toast('容器最多套两层', 'warn');
      return;
    }
    pushUndo();
    target.arr.splice(target.index, 0, node);
    st.sel = findPath(node);
    refreshAll();
  }

  function deleteNode(path) {
    const loc = locate(path);
    if (!loc) return;
    pushUndo();
    loc.arr.splice(loc.idx, 1);
    st.sel = null;
    refreshAll();
  }

  function duplicateNode(path) {
    const loc = locate(path);
    if (!loc) return;
    pushUndo();
    const copy = clone(loc.node);
    copy.id = loc.node.type === 'field' ? RT.ws.uid('c') : RT.ws.uid(loc.node.type === 'row' ? 'r' : 'g');
    (function renew(n) {
      if (n.type === 'field') {
        if (n.comp === 'table') {
          (n.columns || []).forEach(function (c) { c.key = RT.ws.uid('k'); });
        }
        if (n.comp === 'repeat') {
          (n.fields || []).forEach(function (f) { f.id = RT.ws.uid('f'); });
        }
        if (n.comp === 'chips' || n.comp === 'stats' || n.comp === 'pairs') {
          (n.fields || []).forEach(function (f) { f.id = RT.ws.uid('f'); });
        }
      }
      (n.children || []).forEach(renew);
    })(copy);
    loc.arr.splice(loc.idx + 1, 0, copy);
    st.sel = findPath(copy);
    refreshAll();
  }

  function changeSpan(path, delta) {
    const loc = locate(path);
    if (!loc) return;
    pushUndo();
    const b = T.box(loc.node);
    loc.node.span = Math.max(1, Math.min(12, b.span + delta));
    st.sel = path;
    refreshAll();
  }

  /* ---------------- 拖拽 ---------------- */

  let dragPayload = null;

  function payloadFromEvent(e) {
    if (dragPayload) return dragPayload;
    const raw = e.dataTransfer ? e.dataTransfer.getData('text/plain') : '';
    if (!raw) return null;
    if (raw.indexOf('comp:') === 0) return { kind: 'comp', comp: raw.slice(5) };
    if (raw.indexOf('node:') === 0) return { kind: 'node', path: raw.slice(5) };
    return null;
  }

  function containerDepthFor(target) {
    if (!target) return 99;
    if (target.mode === 'root') return 0;
    if (target.mode === 'inside') {
      const loc = locate(target.containerPath);
      return loc ? loc.depth + 1 : 99;
    }
    const loc = locate(target.path);
    return loc ? loc.depth : 99;
  }

  function findTarget(e) {
    if (!st || !st.root) return null;
    const canvas = st.root.querySelector('#tb-canvas');
    if (!canvas) return null;
    const grid = canvas.querySelector('.tb-grid');
    const nodeEl = e.target.closest ? e.target.closest('.tb-node') : null;
    if (!nodeEl) {
      return { mode: 'root', nodeEl: null, arr: rootChildren(), index: rootChildren().length };
    }
    const path = nodeEl.getAttribute('data-path');
    const loc = locate(path);
    if (!loc) return null;
    /* 指到容器内部的空白/间距时算“放进容器”：
       closest('.tb-node') 会命中容器自身，要排除的是它下面真正的子节点 */
    const inner = nodeEl.querySelector('.tb-inner');
    const hitNode = e.target.closest ? e.target.closest('.tb-node') : null;
    const overInner = !!(inner && inner.contains(e.target) && (!hitNode || hitNode === nodeEl));
    if (loc.node.type !== 'field' && overInner) {
      return { mode: 'inside', containerPath: path, nodeEl: nodeEl, arr: null, index: -1 };
    }
    const parentLoc = locate(parentPath(path));
    const horizontal = parentLoc && parentLoc.node.type === 'row';
    const rect = nodeEl.getBoundingClientRect();
    const mid = horizontal ? rect.left + rect.width / 2 : rect.top + rect.height / 2;
    const before = horizontal ? e.clientX < mid : e.clientY < mid;
    return {
      mode: before ? 'before' : 'after',
      path: path,
      nodeEl: nodeEl,
      arr: loc.arr,
      index: loc.idx + (before ? 0 : 1),
    };
  }

  function dropAllowed(payload, target) {
    if (!payload || !target) return false;
    let isContainer = false;
    if (payload.kind === 'comp') {
      isContainer = payload.comp === 'row' || payload.comp === 'group';
    } else {
      const src = locate(payload.path);
      if (!src) return false;
      isContainer = src.node.type !== 'field';
      if (target.mode === 'inside') {
        if (target.containerPath === payload.path ||
          String(target.containerPath).indexOf(payload.path + '.') === 0) return false;
      }
      if (target.mode !== 'inside' && target.path === payload.path) return false;
    }
    if (!isContainer) return true;
    return containerDepthFor(target) <= MAX_CONTAINER_DEPTH;
  }

  function clearDropMarks() {
    if (!st || !st.root) return;
    st.root.querySelectorAll('.tb-drop-before, .tb-drop-after, .tb-drop-inside, .tb-drop-end')
      .forEach(function (el) {
        el.classList.remove('tb-drop-before', 'tb-drop-after', 'tb-drop-inside', 'tb-drop-end');
      });
  }

  function markDrop(target) {
    clearDropMarks();
    if (!target || !st.root) return;
    if (target.nodeEl) {
      target.nodeEl.classList.add(target.mode === 'inside'
        ? 'tb-drop-inside'
        : target.mode === 'before' ? 'tb-drop-before' : 'tb-drop-after');
    } else {
      const grid = st.root.querySelector('#tb-canvas .tb-grid');
      if (grid) grid.classList.add('tb-drop-end');
    }
  }

  function performDrop(payload, target) {
    if (!dropAllowed(payload, target)) return;
    let node = null;
    let src = null;
    if (payload.kind === 'comp') {
      node = makeNode(payload.comp);
    } else {
      src = locate(payload.path);
      if (!src) return;
      node = src.node;
    }
    pushUndo();
    let arr = null;
    let index = 0;
    if (target.mode === 'root') {
      arr = rootChildren();
      index = arr.length;
    } else if (target.mode === 'inside') {
      const loc = locate(target.containerPath);
      if (!loc) return;
      arr = loc.node.children || (loc.node.children = []);
      index = arr.length;
    } else {
      const loc = locate(target.path);
      if (!loc) return;
      arr = loc.arr;
      index = loc.idx + (target.mode === 'after' ? 1 : 0);
    }
    if (src) {
      if (src.arr === arr && src.idx < index) index--;
      src.arr.splice(src.idx, 1);
    }
    index = Math.max(0, Math.min(arr.length, index));
    arr.splice(index, 0, node);
    clearDropMarks();
    st.sel = findPath(node);
    refreshAll();
  }

  function bindDrag() {
    const root = st.root;

    root.addEventListener('dragstart', function (e) {
      const chip = e.target.closest('[data-comp]');
      if (chip) {
        dragPayload = { kind: 'comp', comp: chip.getAttribute('data-comp') };
        e.dataTransfer.setData('text/plain', 'comp:' + dragPayload.comp);
        e.dataTransfer.effectAllowed = 'copy';
        return;
      }
      const grip = e.target.closest('[data-grip]');
      if (grip) {
        dragPayload = { kind: 'node', path: grip.getAttribute('data-grip') };
        e.dataTransfer.setData('text/plain', 'node:' + dragPayload.path);
        e.dataTransfer.effectAllowed = 'move';
        const nodeEl = grip.closest('.tb-node');
        if (nodeEl) nodeEl.classList.add('tb-dragging');
        return;
      }
      e.preventDefault();
    });

    root.addEventListener('dragend', function () {
      dragPayload = null;
      clearDropMarks();
      root.querySelectorAll('.tb-dragging').forEach(function (x) { x.classList.remove('tb-dragging'); });
    });

    root.addEventListener('dragover', function (e) {
      if (!dragPayload) return;
      const overCanvas = e.target.closest && e.target.closest('#tb-canvas');
      if (!overCanvas) { clearDropMarks(); return; }
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = dragPayload.kind === 'comp' ? 'copy' : 'move';
      const target = findTarget(e);
      if (dropAllowed(dragPayload, target)) markDrop(target);
      else clearDropMarks();
    });

    root.addEventListener('drop', function (e) {
      const overCanvas = e.target.closest && e.target.closest('#tb-canvas');
      if (!overCanvas) return;
      e.preventDefault();
      e.stopPropagation();
      const payload = payloadFromEvent(e);
      const target = findTarget(e);
      dragPayload = null;
      performDrop(payload, target);
    });
  }

  /* ---------------- 检查器输入 ---------------- */

  function setSample(path, val) {
    if (!st.tpl.sample) st.tpl.sample = {};
    const parts = String(path).split('.');
    if (parts.length === 1) {
      st.tpl.sample[parts[0]] = val;
      return;
    }
    const id = parts[0];
    const field = parts[1];
    if (!st.tpl.sample[id] || typeof st.tpl.sample[id] !== 'object') st.tpl.sample[id] = {};
    st.tpl.sample[id][field] = val;
  }

  function bindInputs() {
    const root = st.root;

    root.addEventListener('input', function (e) {
      const el = e.target;

      if (el.id === 'tb-name') {
        st.tpl.name = el.value;
        saveDraft();
        return;
      }

      if (el.hasAttribute('data-tpl-field')) {
        const key = el.getAttribute('data-tpl-field');
        if (key === 'width') st.tpl.width = Math.max(200, Math.min(520, Number(el.value) || 300));
        else st.tpl[key] = el.value;
        if (key !== 'name') paintCanvas();
        saveDraft();
        return;
      }

      if (el.hasAttribute('data-tb-sample')) {
        setSample(el.getAttribute('data-tb-sample'), el.value);
        saveDraft();
        return;
      }
      if (el.hasAttribute('data-tb-sample-check')) {
        setSample(el.getAttribute('data-tb-sample-check'), !!el.checked);
        saveDraft();
        return;
      }

      if (!st.sel) return;
      const loc = locate(st.sel);
      if (!loc) return;
      const n = loc.node;

      if (el.hasAttribute('data-tb-field')) {
        const key = el.getAttribute('data-tb-field');
        if (key === 'optionsText') {
          n.options = el.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
        } else if (key === 'start' || key === 'span' || key === 'gap' || key === 'rows' ||
          key === 'min' || key === 'max' || key === 'step') {
          n[key] = Number(el.value);
          paintCanvas();
        } else if (key === 'boxed' || key === 'italic') {
          n[key] = !!el.checked;
          paintCanvas();
        } else {
          n[key] = el.value;
          paintCanvas();
        }
        saveDraft();
        return;
      }

      if (el.hasAttribute('data-tb-col')) {
        const i = Number(el.getAttribute('data-idx'));
        if (!n.columns) n.columns = [];
        if (!n.columns[i]) n.columns[i] = { key: RT.ws.uid('k'), label: '', type: 'text' };
        n.columns[i].label = el.value;
        paintCanvas();
        saveDraft();
        return;
      }

      if (el.hasAttribute('data-tb-repfield')) {
        const i = Number(el.getAttribute('data-idx'));
        if (!n.fields) n.fields = [];
        if (!n.fields[i]) n.fields[i] = { id: RT.ws.uid('f'), label: '', type: 'text', width: 'half' };
        n.fields[i].label = el.value;
        paintCanvas();
        saveDraft();
        return;
      }

      if (el.hasAttribute('data-tb-subfield')) {
        const i = Number(el.getAttribute('data-idx'));
        if (!n.fields) n.fields = [];
        if (!n.fields[i]) n.fields[i] = { id: RT.ws.uid('f'), label: '' };
        n.fields[i].label = el.value;
        paintCanvas();
        saveDraft();
      }
    });

    root.addEventListener('change', function (e) {
      const el = e.target;
      if (el.hasAttribute('data-tb-col') && el.tagName === 'SELECT') {
        const loc = st.sel && locate(st.sel);
        if (!loc) return;
        loc.node.columns[Number(el.getAttribute('data-idx'))].type = el.value;
        paintCanvas();
        saveDraft();
      } else if (el.hasAttribute('data-tb-repfield') && el.tagName === 'SELECT') {
        const loc = st.sel && locate(st.sel);
        if (!loc) return;
        loc.node.fields[Number(el.getAttribute('data-idx'))].type = el.value;
        paintCanvas();
        saveDraft();
      } else if (el.hasAttribute('data-tpl-field')) {
        st.tpl[el.getAttribute('data-tpl-field')] = el.value;
        paintCanvas();
        saveDraft();
      } else if (el.hasAttribute('data-tb-field')) {
        const loc = st.sel && locate(st.sel);
        if (!loc) return;
        const key = el.getAttribute('data-tb-field');
        loc.node[key] = el.type === 'checkbox' ? !!el.checked : el.value;
        paintCanvas();
        saveDraft();
      }
    });
  }

  /* ---------------- 点击 ---------------- */

  function bindClicks() {
    const root = st.root;

    root.addEventListener('click', function (e) {
      const step = e.target.closest('[data-tb-counter-step]');
      if (step) {
        if (!st.tpl.sample || typeof st.tpl.sample !== 'object') st.tpl.sample = {};
        const raw = step.getAttribute('data-tb-counter-step').split(':');
        const id = raw[0];
        const d = Number(raw[1]) || 1;
        const loc = locate(findPathById(id));
        const node = loc && loc.node;
        const cur = st.tpl.sample[id] && typeof st.tpl.sample[id] === 'object'
          ? st.tpl.sample[id]
          : { value: 0, max: (node && Number(node.max)) || 6 };
        const max = Math.max(1, Number(cur.max) || 6);
        const value = Math.max(0, Math.min(max, Number(cur.value) || 0) + d);
        st.tpl.sample[id] = { value: value, max: max };
        paintCanvas();
        saveDraft();
        return;
      }

      const box = e.target.closest('[data-tb-sample-box]');
      if (box) {
        if (!st.tpl.sample || typeof st.tpl.sample !== 'object') st.tpl.sample = {};
        const raw = box.getAttribute('data-tb-sample-box').split(':');
        const id = raw[0];
        const i = Number(raw[1]);
        const loc = locate(findPathById(id));
        const cur = (st.tpl.sample[id] && typeof st.tpl.sample[id] === 'object')
          ? st.tpl.sample[id]
          : { max: (loc && Number(loc.node.max)) || 6, marked: 0 };
        const marked = Number(cur.marked) || 0;
        st.tpl.sample[id] = { max: cur.max || (loc && Number(loc.node.max)) || 6, marked: i < marked ? i : i + 1 };
        paintCanvas();
        saveDraft();
        return;
      }

      const chip = e.target.closest('.tb-chip');
      if (chip) {
        e.preventDefault();
        addComp(chip.getAttribute('data-comp'));
        return;
      }

      const btn = e.target.closest('[data-tb]');
      if (btn) {
        e.preventDefault();
        const act = btn.getAttribute('data-tb');
        const path = btn.getAttribute('data-path');
        switch (act) {
          case 'undo': undo(); return;
          case 'redo': redo(); return;
          case 'preview':
            st.preview = !st.preview;
            paintCanvas();
            updateButtons();
            return;
          case 'discard':
            RT.dialogs.confirm('丢弃草稿', '会把画布恢复成上次保存的版本，未保存的改动全部丢掉。', function () {
              st.tpl = clone(st.base);
              st.sel = null;
              clearDraft();
              refreshAll();
            }, true);
            return;
          case 'save': save(false); return;
          case 'save-close': save(true); return;
          case 'cancel': cancel(); return;
          case 'sel-close': st.sel = null; paintCanvas(); paintInspector(); return;
          case 'span-': changeSpan(path, -1); return;
          case 'span+': changeSpan(path, 1); return;
          case 'dup': duplicateNode(path); return;
          case 'del': deleteNode(path); return;
          case 'add':
            st.sel = path;
            paintCanvas();
            paintInspector();
            RT.toast('已选中这个容器，点左边组件加进来');
            return;
          case 'col-add': {
            const loc = locate(st.sel);
            if (!loc) return;
            pushUndo();
            const cols = loc.node.columns || (loc.node.columns = []);
            cols.push({ key: RT.ws.uid('k'), label: '列 ' + (cols.length + 1), type: 'text' });
            refreshAll();
            return;
          }
          case 'col-del': {
            const loc = locate(st.sel);
            if (!loc) return;
            pushUndo();
            loc.node.columns.splice(Number(btn.getAttribute('data-idx')), 1);
            refreshAll();
            return;
          }
          case 'repfield-add': {
            const loc = locate(st.sel);
            if (!loc) return;
            pushUndo();
            const fields = loc.node.fields || (loc.node.fields = []);
            fields.push({ id: RT.ws.uid('f'), type: 'text', label: '字段 ' + (fields.length + 1), width: 'half' });
            refreshAll();
            return;
          }
          case 'repfield-del': {
            const loc = locate(st.sel);
            if (!loc) return;
            pushUndo();
            loc.node.fields.splice(Number(btn.getAttribute('data-idx')), 1);
            refreshAll();
            return;
          }
          case 'repfield-width': {
            const loc = locate(st.sel);
            if (!loc) return;
            pushUndo();
            const f = loc.node.fields[Number(btn.getAttribute('data-idx'))];
            f.width = f.width === 'half' ? 'full' : 'half';
            refreshAll();
            return;
          }
          case 'subfield-add': {
            const loc = locate(st.sel);
            if (!loc) return;
            pushUndo();
            const fields = loc.node.fields || (loc.node.fields = []);
            fields.push({ id: RT.ws.uid('f'), label: '字段 ' + (fields.length + 1) });
            refreshAll();
            return;
          }
          case 'subfield-del': {
            const loc = locate(st.sel);
            if (!loc) return;
            pushUndo();
            loc.node.fields.splice(Number(btn.getAttribute('data-idx')), 1);
            refreshAll();
            return;
          }
          default:
            return;
        }
      }

      const nodeEl = e.target.closest('.tb-node');
      if (nodeEl && root.contains(nodeEl)) {
        const path = nodeEl.getAttribute('data-path');
        if (st.sel !== path) {
          st.sel = path;
          /* 点输入框只是选中，不能重画画布，否则焦点会丢 */
          if (e.target.closest('input,textarea,select')) {
            root.querySelectorAll('.tb-node.selected').forEach(function (x) { x.classList.remove('selected'); });
            nodeEl.classList.add('selected');
            paintInspector();
            updateButtons();
          } else {
            paintCanvas();
            paintInspector();
          }
        }
        return;
      }

      if (e.target.closest('#tb-canvas')) {
        if (st.sel) {
          st.sel = null;
          paintCanvas();
          paintInspector();
        }
      }
    });
  }

  function findPathById(id) {
    let out = null;
    T.walk(st.tpl.layout, function (node) {
      if (node.type === 'field' && node.id === id) out = findPath(node);
    });
    return out;
  }

  /* ---------------- 容器宽度拖拽 ---------------- */

  function bindResize() {
    st.root.addEventListener('pointerdown', function (e) {
      const handle = e.target.closest('.tb-resize');
      if (!handle) return;
      e.preventDefault();
      e.stopPropagation();
      const path = handle.getAttribute('data-path');
      const loc = locate(path);
      if (!loc) return;
      const nodeEl = handle.closest('.tb-node');
      const grid = st.root.querySelector('#tb-canvas .tb-grid');
      const gridW = grid ? grid.getBoundingClientRect().width : 600;
      const colW = gridW / 12;
      const startX = e.clientX;
      const startSpan = T.box(loc.node).span;
      let changed = false;

      function move(ev) {
        const span = Math.max(2, Math.min(12, Math.round(startSpan + (ev.clientX - startX) / colW)));
        if (span === T.box(loc.node).span) return;
        loc.node.span = span;
        const b = T.box(loc.node);
        if (nodeEl) nodeEl.style.gridColumn = b.start + ' / span ' + b.span;
        const spanEl = nodeEl && nodeEl.querySelector('.tb-span');
        if (spanEl) spanEl.textContent = b.span;
        changed = true;
      }
      function up() {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        if (changed) {
          saveDraft();
          paintInspector();
        }
      }
      pushUndo();
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  }

  /* ---------------- 保存 / 取消 ---------------- */

  function isDirty() {
    try {
      return JSON.stringify(st.tpl) !== JSON.stringify(st.base);
    } catch (e) {
      return true;
    }
  }

  /* 哪些组件必须有标签；chips / pairs / para / features / heading 允许留空 */
  const LABEL_REQUIRED = {
    text: 1, textarea: 1, number: 1, date: 1, select: 1, check: 1,
    list: 1, table: 1, repeat: 1, tracker: 1, note: 1,
  };

  function save(close) {
    const nameEl = st.root.querySelector('#tb-name');
    if (nameEl) st.tpl.name = nameEl.value.trim();
    if (!st.tpl.name) {
      RT.toast('先给模板起个名字', 'warn');
      if (nameEl) nameEl.focus();
      return;
    }
    const bad = [];
    T.walk(st.tpl.layout, function (n) {
      if (n.type === 'field' && LABEL_REQUIRED[n.comp] && !String(n.label || '').trim()) bad.push(n);
    });
    if (bad.length) {
      RT.toast('还有 ' + bad.length + ' 个组件没填标签', 'warn');
      return;
    }
    st.tpl.version = (Number(st.tpl.version) || 0) + 1;
    const clean = T.save(st.tpl);
    st.tpl = clone(clean);
    st.base = clone(clean);
    clearDraft();
    RT.toast('模板已保存');
    RT.rerender('all');
    if (close) {
      RT.dialogs.close();
      st = null;
    } else {
      updateButtons();
    }
  }

  function cancel() {
    if (isDirty()) {
      RT.dialogs.confirm('放弃未保存的改动', '画布上的改动还没保存，确定离开？', function () {
        clearDraft();
        RT.dialogs.close();
        st = null;
      }, true);
      return;
    }

/* ============================================================
 * 21. 战役模块：DM 追踪面板（白板）
 *     左侧敌人库 / 右侧环境库，中间是可缩放、可平移、完全自由摆放的白板。
 *     白板内容按战役存；库与卡片模板是全局的。
 * ============================================================ */
(function (RT) {
  'use strict';

  const esc = RT.esc;
  const KEY = RT.ws.KEYS.dmBoard;
  const store = RT.ws.store(KEY);
  const cache = {};

  const ZOOM_MIN = 0.4;
  const ZOOM_MAX = 2;

  /* ---------------- 数据 ---------------- */

  function uid(p) { return RT.ws.uid(p || 'dmb'); }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function num(v, d) {
    const n = Number(v);
    return isFinite(n) ? n : d;
  }

  function normalize(d) {
    const b = d && typeof d === 'object' ? d : {};
    if (!Array.isArray(b.items)) b.items = [];
    b.items = b.items.filter(function (it) { return it && it.id && (it.type === 'card' || it.type === 'counter'); });
    if (!b.view || typeof b.view !== 'object') b.view = {};
    const v = b.view;
    v.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, num(v.zoom, 1)));
    v.scrollX = Math.max(0, num(v.scrollX, 0));
    v.scrollY = Math.max(0, num(v.scrollY, 0));
    if (!v.panels || typeof v.panels !== 'object') v.panels = { left: true };
    if (typeof v.panels.left !== 'boolean') v.panels.left = true;
    delete v.libs;
    delete v.panels.right;
    /* v1 面板默认卡宽 280 偏大；只迁移那个旧默认值，用户自己调过的不动 */
    if (!b.v) {
      if (num(b.cardWidth, 0) === 280) b.cardWidth = 220;
      b.v = 2;
    }
    b.cardWidth = Math.min(520, Math.max(150, num(b.cardWidth, 220)));
    if (!b.dice || typeof b.dice !== 'object') b.dice = { mode: 'normal', expr: '1d20', adv: 'normal', mod: 0, last: null };
    if (b.dice.mode !== 'duality') b.dice.mode = 'normal';
    if (['normal', 'adv', 'dis'].indexOf(b.dice.adv) < 0) b.dice.adv = 'normal';
    if (!isFinite(Number(b.dice.mod))) b.dice.mod = 0;
    b.dice.mod = Math.max(-999, Math.min(999, Number(b.dice.mod) || 0));
    if (typeof b.dice.expr !== 'string' || !b.dice.expr.trim()) b.dice.expr = '1d20';
    b.items.forEach(function (it) {
      it.x = Math.max(0, num(it.x, 40));
      it.y = Math.max(0, num(it.y, 40));
      it.z = num(it.z, 1);
      if (it.type === 'card') {
        it.w = Math.min(520, Math.max(150, num(it.w, b.cardWidth)));

    const nz = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, oldZ * factor));
    if (Math.abs(nz - oldZ) < 0.001) return;

    const cy = py == null ? r.height / 2 : py;

      arr = arr.filter(function (it) {

    if (filter.source) arr = arr.filter(function (it) { return (it.meta || {}).source === filter.source; });
    if (filter.tier) arr = arr.filter(function (it) { return String((it.meta || {}).tier || '') === filter.tier; });
    if (filter.kind) arr = arr.filter(function (it) { return (it.meta || {}).kind === filter.kind; });
    const sort = filter.sort || 'name';
    arr = arr.slice().sort(function (a, b) {
      if (sort === 'lib') return String(LIB_LABEL[a.lib] || '').localeCompare(String(LIB_LABEL[b.lib] || ''), 'zh') || a.name.localeCompare(b.name, 'zh');
      if (sort === 'tier') return (num((a.meta || {}).tier, 99) - num((b.meta || {}).tier, 99)) || a.name.localeCompare(b.name, 'zh');
      if (sort === 'kind') return String((a.meta || {}).kind || '').localeCompare(String((b.meta || {}).kind || ''), 'zh') || a.name.localeCompare(b.name, 'zh');
      if (sort === 'source') return String((a.meta || {}).source || '').localeCompare(String((b.meta || {}).source || ''), 'zh') || a.name.localeCompare(b.name, 'zh');
      return a.name.localeCompare(b.name, 'zh');
    });
    return arr;
  }

  function optionsOf(field) {
    const seen = {};
    RT.dmLib.all().forEach(function (it) {
      const v = String((it.meta || {})[field] || '').trim();
      if (v) seen[v] = true;
    });
    return Object.keys(seen).sort(function (a, b) {
      return field === 'tier' ? num(a, 99) - num(b, 99) : a.localeCompare(b, 'zh');
    });
  }

      tplId: tpl.id,

      w: b.cardWidth,

      ts: Date.now(),

    persist(cid);
    repaintCanvas(cid);

  /* ---------------- 菜单 ---------------- */

  let menuEl = null;

  function closeMenu() {
    if (menuEl) { menuEl.remove(); menuEl = null; }
  }

  function openMenu(anchor, items) {
    closeMenu();
    const el = document.createElement('div');
    el.className = 'menu-pop';
    el.innerHTML = items.map(function (it, i) {
      if (it.sep) return '<div class="menu-sep"></div>';
      return '<button class="menu-item' + (it.danger ? ' danger' : '') + '" data-mi="' + i + '">' +
        (it.icon ? RT.icon(it.icon, 14) : '<span class="mi-dot"></span>') +
        '<span class="mi-label">' + esc(it.label) + '</span>' +
        (it.active ? RT.icon('check', 13) : '') + '</button>';
    }).join('');
    document.body.appendChild(el);
    const rect = anchor.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    let left = Math.min(rect.left, window.innerWidth - w - 10);
    let top = rect.bottom + 6;
    if (top + h > window.innerHeight - 10) top = Math.max(10, rect.top - h - 6);
    el.style.left = Math.max(10, left) + 'px';
    el.style.top = top + 'px';
    el.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-mi]');
      if (!btn) return;
      const item = items[Number(btn.getAttribute('data-mi'))];
      closeMenu();
      if (item && item.onClick) item.onClick();
    });
    menuEl = el;
  }

  document.addEventListener('click', function (e) {
    if (!menuEl) return;
    if (e.target.closest('.menu-pop')) return;
    closeMenu();
  }, true);

  document.addEventListener('dblclick', function (e) {
    const t = e.target.closest && e.target.closest('[data-dm-rename]');
    if (!t) return;
    const cid = viewCid();
    if (!cid) return;
    const b = data(cid);
    const it = itemById(b, t.getAttribute('data-dm-rename'));
    if (it) renameItem(cid, b, it);
  });

  /* ---------------- 卡片 / 计数编辑 ---------------- */

  function pathSet(obj, path, val) {
    const parts = String(path).split('.');
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      const k = parts[i];
      if (cur[k] == null || typeof cur[k] !== 'object') cur[k] = {};
      cur = cur[k];
    }
    cur[parts[parts.length - 1]] = val;
  }

  function cardOf(el) {
    const cardEl = el.closest('.dmb-card');
    const cid = viewCid();
    if (!cardEl || !cid) return null;
    const b = data(cid);
    const it = itemById(b, cardEl.getAttribute('data-dmid'));
    if (!it) return null;
    return { cid: cid, b: b, item: it, el: cardEl };
  }

  function editCardValues(el) {
    const ctx = cardOf(el);
    if (!ctx) return;
    const tpl = templateOf(ctx.item);
    if (!tpl) { RT.toast('模板已删除，无法编辑', 'warn'); return; }
    RT.dmCard.editDialog(tpl, ctx.item.values || {}, function (values) {
      ctx.item.values = values;
      persist(ctx.cid);
      repaintCanvas(ctx.cid);
    }, { title: ctx.item.title || '卡片' });
  }

  function renameItem(cid, b, it) {
    const current = it.type === 'counter' ? (it.label || '') : (it.title || '');
    RT.dialogs.prompt('重命名', current, function (name) {
      if (it.type === 'counter') it.label = name;
      else it.title = name;

  function updateCounterDom(it, skipEl) {
    const el = document.querySelector('.dmb-card[data-dmid="' + it.id + '"]');
    if (!el) return;
    const val = el.querySelector('[data-act="dm-counter-val"]');
    if (val && val !== skipEl) val.value = it.value;
    const maxEl = el.querySelector('[data-act="dm-counter-max"]');
    if (maxEl && maxEl !== skipEl) maxEl.value = it.max;
    const bar = el.querySelector('.dmb-bar i');

  function importLibDialog() {
    RT.dialogs.open({
      title: '导入卡片库',
      wide: true,
      body:
        '<p class="modal-note">支持 敌人数据库.json / 环境数据库.json / 本工具导出的库文件，也支持每行一条的纯文本。' +
        '会按内容自动识别类型；同名条目会重复导入，可先删除旧的。</p>' +
        '<div class="file-row"><label class="btn ghost small file-btn">' + RT.icon('upload', 14) + ' 选择文件' +
        '<input type="file" id="dmb-lib-file" accept=".json,.txt,application/json,text/plain" hidden></label>' +
        '<span class="dim">也可以把文件拖进卡片库面板</span></div>' +
        '<textarea class="textarea mono" id="dmb-lib-text" rows="10" placeholder="粘贴 JSON 或文本"></textarea>' +

        const ta = modal.querySelector('#dmb-lib-text');
        modal.querySelector('#dmb-lib-file').addEventListener('change', function (e) {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = function () { ta.value = String(reader.result || ''); };
          reader.readAsText(f, 'utf-8');
        });
        modal.querySelector('[data-cancel]').addEventListener('click', function () { RT.dialogs.close(); });

          const text = ta.value.trim();

          try {
            const res = RT.dmLib.importText(text);
            RT.dialogs.close();
            RT.toast('已导入 ' + res.added + ' 条' + (res.skipped ? '，跳过 ' + res.skipped + ' 条' : ''));
            RT.rerender('all');

            RT.toast(err.message || '导入失败', 'warn');

  function exportLib(kind) {
    if (!RT.dmLib.count()) { RT.toast('卡片库还是空的', 'warn'); return; }
    if (kind === 'txt') {
      RT.download('卡片库-' + RT.dateStamp() + '.txt', RT.dmLib.exportAllTxt(), 'text/plain');
    } else {
      RT.download('卡片库-' + RT.dateStamp() + '.json', RT.dmLib.exportAllJson());
    }
  }

  function templatesForLib(lib) {
    const list = RT.tpl.list('card').filter(function (t) {
      return t.cardKind === lib;
    });
    if (!list.length) {
      const fallback = RT.tpl.get(RT.dmLib.libMeta(lib).tplId);
      return fallback ? [fallback] : [];
    }
    return list;
  }

  function openNewItemForm(lib, name, tplId) {
    const tpl = RT.tpl.get(tplId) || RT.tpl.get(RT.dmLib.libMeta(lib).tplId);
    if (!tpl) { RT.toast('模板不见了', 'warn'); return; }
    const values = RT.dmCard.defaultValues(tpl);
    RT.dmCard.editDialog(tpl, values, function (vals) {
      RT.dmLib.add({
        lib: lib,
        tplId: tpl.id,
        name: name,
        meta: vals.meta && typeof vals.meta === 'object' ? clone(vals.meta) : {},
        values: vals,
      });
      RT.toast('已加入卡片库');
      RT.rerender('all');
    }, { title: name });
  }

  function pickTemplateFor(lib, name) {
    const list = templatesForLib(lib);
    if (!list.length) { RT.toast('这一类还没有可用模板', 'warn'); return; }
    if (list.length === 1) {
      openNewItemForm(lib, name, list[0].id);
      return;
    }
    RT.dialogs.open({
      title: '用哪个模板',
      wide: true,
      body:
        '<p class="modal-note">同一类卡片可以有多个模板（内置的、复制的、自己搭的）。选一个开始填数据。</p>' +
        '<div class="tpl-pick">' + list.map(function (t) {
          return '<button class="tpl-card" data-pick="' + t.id + '">' +
            '<span class="tpl-name">' + esc(t.name) + '</span>' +
            '<span class="tpl-meta">' + RT.tpl.countFields(t.layout) + ' 个组件' +
            (t.builtin ? ' · 内置' : ' · 自定义') + '</span></button>';
        }).join('') + '</div>' +
        '<div class="modal-actions right"><button class="btn ghost" data-cancel="1">取消</button></div>',
      onMount: function (m) {
        m.querySelectorAll('[data-pick]').forEach(function (b) {
          b.addEventListener('click', function () {
            RT.dialogs.close();
            openNewItemForm(lib, name, b.getAttribute('data-pick'));
          });
        });

    });
  }

  function exportBoard() {
    const cid = viewCid() || cur();
    if (!cid) return;
    const b = data(cid);
    if (!b.items.length) { RT.toast('面板还是空的', 'warn'); return; }
    const payload = {

  }

  function importBoardDialog() {
    RT.dialogs.open({
      title: '导入追踪面板',
      wide: true,
      body:
        '<p class="modal-note">导入会与当前面板合并（不会删掉现有卡片）。也支持本工具「导出」的面板文件。</p>' +
        '<div class="file-row"><label class="btn ghost small file-btn">' + RT.icon('upload', 14) + ' 选择文件' +
        '<input type="file" id="dmb-board-file" accept=".json,application/json" hidden></label></div>' +
        '<textarea class="textarea mono" id="dmb-board-text" rows="10" placeholder="粘贴面板 JSON"></textarea>' +
        '<div class="modal-actions right">' +
        '<button class="btn ghost" data-cancel="1">取消</button>' +
        '<button class="btn gold" data-ok="1">导入</button></div>',
      onMount: function (modal) {
        const ta = modal.querySelector('#dmb-board-text');
        modal.querySelector('#dmb-board-file').addEventListener('change', function (e) {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = function () { ta.value = String(reader.result || ''); };
          reader.readAsText(f, 'utf-8');
        });
        modal.querySelector('[data-cancel]').addEventListener('click', function () { RT.dialogs.close(); });
        modal.querySelector('[data-ok]').addEventListener('click', function () {
          const text = ta.value.trim();
          if (!text) { RT.toast('先粘贴内容或选文件', 'warn'); return; }
          const cid = viewCid() || cur();
          if (!cid) return;
          let parsed;
          try { parsed = JSON.parse(text); } catch (e) { RT.toast('JSON 解析失败', 'warn'); return; }
          const incoming = parsed && parsed.board ? parsed.board : parsed;
          if (!incoming || !Array.isArray(incoming.items)) { RT.toast('这不是面板文件', 'warn'); return; }
          const b = data(cid);
          let n = 0;
          incoming.items.forEach(function (raw) {
            if (!raw || (raw.type !== 'card' && raw.type !== 'counter')) return;
            const it = normalize({ items: [Object.assign({}, raw, { id: raw.id || uid('tmp') })] }).items[0];
            if (!it) return;
            it.id = uid(it.type === 'card' ? 'dmc' : 'dmk');
            it.x = Math.max(0, num(it.x, 40) + 40);
            it.y = Math.max(0, num(it.y, 40) + 40);
            it.z = nextZ(b);
            b.items.push(it);
            n++;
          });
          persist(cid);
          RT.dialogs.close();
          RT.toast('已合并 ' + n + ' 项');
          RT.rerender('all');
        });
      },
    });
  }

  RT.acts['dmb-counter-step'] = function (el) {
    const ctx = cardOf(el);
    if (!ctx || ctx.item.type !== 'counter') return;
    const it = ctx.item;
    const d = Number(el.getAttribute('data-d')) || 1;
    let v = num(it.value, 0) + d;
    if (it.kind === 'advanced') v = Math.max(0, Math.min(num(it.max, 6), v));
    else v = Math.max(0, v);
    it.value = v;
    updateCounterDom(it);
    persistSoon(ctx.cid);

  RT.acts['dmb-clear'] = function () {
    const cid = cur();
    if (!cid) return;
    const b = data(cid);
    if (!b.items.length) { RT.toast('面板已经是空的'); return; }
    RT.dialogs.confirm('清空面板', '会移除面板上的 ' + b.items.length + ' 项内容（卡片库里的条目不受影响）。', function () {
      b.items = [];
      persist(cid);
      RT.rerender('all');
    }, true);
  };

  RT.acts['dmb-dice-roll'] = function () {
    const cid = viewCid() || cur();
    if (!cid) return;
    const b = data(cid);
    const d = b.dice;
    const adv = d.adv === 'adv' ? 1 : d.adv === 'dis' ? -1 : 0;
    let last = null;
    if (d.mode === 'duality') {
      const hope = 1 + Math.floor(Math.random() * 12);
      const fear = 1 + Math.floor(Math.random() * 12);
      const mod = Number(d.mod) || 0;
      let bonus = 0;
      if (adv) {
        const die = 1 + Math.floor(Math.random() * 6);
        bonus = adv > 0 ? die : -die;
      }
      last = {
        kind: 'duality', hope: hope, fear: fear, bonus: bonus, mod: mod,
        total: hope + fear + bonus + mod,
        outcome: hope === fear ? '暴击' : hope > fear ? '希望' : '恐惧',
        ts: Date.now(),
      };
    } else {
      const r = RT.rollExpr(d.expr, Math.random, { advantage: adv });
      if (!r) { RT.toast('骰式看不懂，点右侧「?」看写法', 'warn'); return; }
      last = { kind: 'normal', total: r.total, text: r.detail, ts: Date.now() };
    }
    d.last = last;
    persist(cid);
    const host = document.getElementById('dmb-dice-result');
    if (host) host.innerHTML = diceResultHtml(last);
  };

  RT.acts['dmb-export'] = function () { exportBoard(); };

  function cardCounterState(it, block) {
    const v = it.values && it.values[block];
    if (!v || typeof v !== 'object') return { value: 0, max: 6 };
    return { value: Math.max(0, num(v.value, 0)), max: Math.max(1, Math.min(99, num(v.max, 6))) };
  }

  function updateCardCounterDom(el, block, st) {
    const wrap = el.closest('.dc-counter');
    if (!wrap) return;
    const val = wrap.querySelector('[data-act="dm-card-counter-val"]');
    if (val && val !== document.activeElement) val.value = st.value;
    const maxEl = wrap.querySelector('[data-act="dm-card-counter-max"]');
    if (maxEl && maxEl !== document.activeElement) maxEl.value = st.max;
    const bar = wrap.querySelector('.dc-counter-bar i');
    if (bar) bar.style.width = Math.max(0, Math.min(100, (st.value / st.max) * 100)) + '%';
  }

  RT.acts['dm-card-counter-step'] = function (el) {
    const ctx = cardOf(el);
    if (!ctx) return;
    const block = el.getAttribute('data-dm-block');
    const st = cardCounterState(ctx.item, block);
    const d = Number(el.getAttribute('data-d')) || 1;
    st.value = Math.max(0, Math.min(st.max, st.value + d));

  RT.inputActs['dm-card-counter-val'] = function (el) {

  /* ---------------- 指针：拖卡 / 改宽 / 平移 ---------------- */

  let gesture = null;

  function endGesture() {
    if (gesture) {
      gesture.cleanup();
      gesture = null;
    }
  }

  function bindDragOnce() {
    document.addEventListener('pointerdown', function (e) {
      const cid = viewCid();
      if (!cid) return;
      const b = data(cid);
      const stage = e.target.closest('#dmb-stage');

      /* 改宽 */
      const resize = e.target.closest('[data-dm-resize]');
      if (resize) {
        const item = itemById(b, resize.getAttribute('data-dm-resize'));
        if (!item || item.locked) return;
        e.preventDefault();
        const el = resize.closest('.dmb-card');
        const z = b.view.zoom;
        const startX = e.clientX;
        const startW = item.w;
        gesture = {
          cleanup: function () {
            document.removeEventListener('pointermove', move);
            document.removeEventListener('pointerup', up);
          },
        };
        function move(ev) {
          item.w = Math.min(560, Math.max(160, Math.round(startW + (ev.clientX - startX) / z)));
          el.style.width = item.w + 'px';
        }
        function up() {
          endGesture();
          persist(cid);
        }
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', up);
        return;
      }

      /* 拖卡 */
      const head = e.target.closest('[data-dm-drag]');
      if (head && !e.target.closest('input,textarea,button,select,label')) {
        const item = itemById(b, head.getAttribute('data-dm-drag'));
        if (!item || item.locked) return;
        e.preventDefault();
        const el = head.closest('.dmb-card');
        const z = b.view.zoom;
        const sx = e.clientX;
        const sy = e.clientY;
        const ox = item.x;
        const oy = item.y;
        if (item.z !== nextZ(b) - 1) {
          item.z = nextZ(b);
          el.style.zIndex = 100 + item.z;
        }
        gesture = {
          cleanup: function () {
            document.removeEventListener('pointermove', move);
            document.removeEventListener('pointerup', up);
          },
        };
        function move(ev) {
          item.x = Math.max(0, Math.round(ox + (ev.clientX - sx) / z));
          item.y = Math.max(0, Math.round(oy + (ev.clientY - sy) / z));
          el.style.left = item.x + 'px';
          el.style.top = item.y + 'px';
        }
        function up() {
          endGesture();
          persist(cid);
        }
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', up);
        return;
      }

      /* 平移 */
      if (!stage) return;
      const blank = e.target === stage || e.target.id === 'dmb-paper' ||
        e.target.id === 'dmb-canvas' || e.target.classList.contains('dmb-hint');
      if (!blank && e.button !== 1) return;
      e.preventDefault();
      const sl = stage.scrollLeft;
      const st = stage.scrollTop;
      const sx = e.clientX;
      const sy = e.clientY;
      gesture = {
        cleanup: function () {
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', up);
          b.view.scrollX = stage.scrollLeft;
          b.view.scrollY = stage.scrollTop;
          persist(cid);
        },
      };
      function move(ev) {
        stage.scrollLeft = sl - (ev.clientX - sx);
        stage.scrollTop = st - (ev.clientY - sy);
      }
      function up() { endGesture(); }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });

    document.addEventListener('wheel', function (e) {
      const stage = e.target.closest && e.target.closest('#dmb-stage');
      if (!stage) return;
      const cid = viewCid();
      if (!cid) return;
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      const b = data(cid);
      const r = stage.getBoundingClientRect();
      zoomAt(cid, e.deltaY < 0 ? 1.1 : 0.9, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    document.addEventListener('scroll', function (e) {
      if (e.target && e.target.id === 'dmb-stage') {
        const cid = viewCid();
        if (!cid) return;
        const b = data(cid);
        b.view.scrollX = e.target.scrollLeft;
        b.view.scrollY = e.target.scrollTop;
        persistSoon(cid);
      }
    }, true);

    /* 库 → 白板：拖放；拖文件进库面板 = 导入 */
    document.addEventListener('dragstart', function (e) {
      const row = e.target.closest && e.target.closest('.dmb-lib-row');
      if (!row) return;
      const id = row.getAttribute('data-id');
      if (!id) return;
      e.dataTransfer.setData('text/plain', 'dmlib:' + id);
      e.dataTransfer.effectAllowed = 'copy';
    });

    document.addEventListener('dragover', function (e) {
      const stage = e.target.closest && e.target.closest('#dmb-stage');
      if (stage) {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        return;
      }
      const panel = e.target.closest && e.target.closest('.dmb-lib-panel');
      if (panel && e.dataTransfer && e.dataTransfer.types) {
        const hasFile = Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0;
        if (hasFile) e.preventDefault();
      }
    });

    document.addEventListener('drop', function (e) {
      const cid = viewCid();
      if (!cid) return;
      const stage = e.target.closest && e.target.closest('#dmb-stage');
      if (stage) {
        const raw = e.dataTransfer ? e.dataTransfer.getData('text/plain') : '';
        if (!raw || raw.indexOf('dmlib:') !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        const b = data(cid);
        const r = stage.getBoundingClientRect();
        const z = b.view.zoom;
        const x = Math.max(0, Math.round((stage.scrollLeft + e.clientX - r.left) / z - b.cardWidth / 2));
        const y = Math.max(0, Math.round((stage.scrollTop + e.clientY - r.top) / z - 24));
        addCardFromLib(cid, raw.slice(6), { x: x, y: y });
        return;
      }
      const panel = e.target.closest && e.target.closest('.dmb-lib-panel');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!panel || !file) return;
      e.preventDefault();
      e.stopPropagation();
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const res = RT.dmLib.importText(String(reader.result || ''));
          RT.toast('已导入 ' + res.added + ' 条' + (res.skipped ? '，跳过 ' + res.skipped + ' 条' : ''));
          RT.rerender('all');
        } catch (err) {
          RT.toast(err.message || '导入失败', 'warn');
        }
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  function exportMd(cid) {
    const b = data(cid);
    if (!b.items.length) return '';
    const L = [];
    b.items.forEach(function (it) {
      if (it.type === 'counter') {
        L.push('### 计数：' + (it.label || '计数'));
        L.push('');
        L.push('- 数值：' + it.value + (it.kind === 'advanced' ? ' / ' + it.max : ''));
        if (it.note) L.push('- 备注：' + it.note);
        L.push('');
        return;
      }
      const tpl = templateOf(it);
      L.push('### ' + (it.title || (tpl ? tpl.name : '卡片')));
      if (tpl && Array.isArray(tpl.layout && tpl.layout.children)) {
        RT.tpl.walk(tpl.layout, function (n) {
          if (n.type !== 'field') return;
          const v = RT.tpl.getVal(it.values, n.id);
          if (n.comp === 'tracker') {
            const val = v && typeof v === 'object' ? v : { max: n.max, marked: 0 };
            L.push('- ' + (n.label || '计数') + '：' + (val.marked || 0) + '/' + (val.max || 0));
          } else if (n.comp === 'counter') {
            const val = v && typeof v === 'object' ? v : {};
            L.push('- ' + (n.label || '计数') + '：' + (val.value || 0) + '/' + (val.max || 0));
          } else if (n.comp === 'dice') {
            const val = v && typeof v === 'object' ? v : {};
            const last = val.last;
            if (last) {
              L.push('- ' + (n.label || '骰子') + '：' +
                (last.kind === 'duality'
                  ? ('希望 ' + last.hope + ' / 恐惧 ' + last.fear + ' → ' + last.outcome)
                  : (last.text || last.total)));
            }
          } else if (n.comp === 'stats' || n.comp === 'pairs' || n.comp === 'chips') {
            const obj = v && typeof v === 'object' ? v : {};
            const bits = (n.fields || []).filter(function (f) { return obj[f.id] != null && obj[f.id] !== ''; })
              .map(function (f) { return f.label + ' ' + obj[f.id]; });
            if (bits.length) L.push('- ' + (n.label ? n.label + '：' : '') + bits.join('，'));
          } else if (n.comp === 'note') {
            if (v) L.push('- 备注：' + v);
          } else if (n.comp === 'features') {
            (Array.isArray(v) ? v : []).forEach(function (f) {
              if (f && f.name) L.push('- ' + f.name + (f.type ? '（' + f.type + '）' : '') + (f.desc ? '：' + f.desc : ''));
            });
          }
        });
      }
      L.push('');
    });
    return L.join('\n');
  }

/* ============================================================

(function (RT) {

    return line.replace(/[#>*_`\-\[\]]/g, '').trim().slice(0, 30) || '规则摘录';

  function sectionText(id) {
    const head = document.getElementById(id);
    if (!head) return '';
    const m = /^H([1-6])$/.exec(head.tagName);
    const level = m ? Number(m[1]) : 2;
    const parts = [head.textContent.trim()];
    let el = head.nextElementSibling;
    while (el) {
      const hm = /^H([1-6])$/.exec(el.tagName);
      if (hm && Number(hm[1]) <= level) break;
      const t = el.textContent.trim();
      if (t) parts.push(t);
      el = el.nextElementSibling;

  }

  document.addEventListener('click', function (e) {
    if (!rulesMenu) return;

  // 大型规则文档可能有上千个标题；侧栏和正文会在同一次刷新中各取一次
  // 渲染结果。按规则包版本缓存，避免把整份 Markdown 重复解析两遍。
  const renderCache = Object.create(null);
  const renderCacheOrder = [];

  function renderedPack(pack) {
    if (!pack) return { html: '', toc: [], search: [] };
    const md = pack.md || '';
    const key = [pack.id, Number(pack.ts) || 0, md.length, md.slice(0, 48), md.slice(-48),
      Array.isArray(pack.blocks) ? pack.blocks.length : 0].join(':');
    if (!renderCache[key]) {
      renderCache[key] = RT.md.renderPack(pack);
      renderCacheOrder.push(key);
      while (renderCacheOrder.length > 4) delete renderCache[renderCacheOrder.shift()];
    }
    return renderCache[key];
  }

  function addPack(pack) {
    const st = state();
    let name = String(pack.name || '').trim() || '未命名规则包';
    if (st.packs.some(function (p) { return p.name === name; })) {
      name = name + '（导入）';
      let i = 2;
      while (st.packs.some(function (p) { return p.name === name; })) {
        name = pack.name + '（导入 ' + i + '）';
        i++;
      }
    }
    const np = {
      id: RT.ws.uid('rp'),
      name: name,
      source: pack.source || '手动导入',
      md: typeof pack.md === 'string' ? pack.md : '',
      blocks: Array.isArray(pack.blocks) ? pack.blocks : null,
      ts: Date.now(),
    };
    st.packs.push(np);
    st.activeId = np.id;
    saveState(st);
    RT.state.ui.rulesId = np.id;
    return np;
  }

  /* ---------------- 全文模糊搜索 ---------------- */

  function searchableChars(value) {
    const chars = [];
    const map = [];
    const text = String(value || '');
    for (let i = 0; i < text.length; i++) {
      const c = text.charAt(i).toLowerCase();
      if (/\s|[\-_—–·，。！？、；：,.!?;:'"“”‘’（）()\[\]{}<>《》]/.test(c)) continue;
      chars.push(c);
      map.push(i);
    }
    return { value: chars.join(''), map: map };
  }

  function fuzzyFind(hay, needle) {
    if (!needle || needle.length > hay.value.length) return null;

    const exactAt = hay.value.indexOf(needle);
    if (exactAt >= 0) {
      return {
        score: 10000 - exactAt,
        positions: hay.map.slice(exactAt, exactAt + needle.length),
      };
    }

    let best = null;
    for (let start = 0; start < hay.value.length; start++) {
      if (hay.value.charAt(start) !== needle.charAt(0)) continue;
      const positions = [hay.map[start]];
      let at = start + 1;
      let ni = 1;
      while (at < hay.value.length && ni < needle.length) {
        if (hay.value.charAt(at) === needle.charAt(ni)) {
          positions.push(hay.map[at]);
          ni++;
        }
        at++;
      }
      if (ni !== needle.length) continue;
      const span = positions[positions.length - 1] - positions[0] + 1;
      const density = needle.length / span;
      if (density < 0.45) continue;
      const candidate = { score: Math.round(density * 1000) - span, positions: positions };
      if (!best || candidate.score > best.score) best = candidate;
    }
    return best;
  }

  function snippetHtml(text, positions) {
    const value = String(text || '');
    if (!positions || !positions.length) return esc(value.slice(0, 110));
    const first = positions[0];
    const last = positions[positions.length - 1];
    const from = Math.max(0, first - 42);
    const to = Math.min(value.length, Math.max(last + 43, from + 110));
    const hits = {};
    positions.forEach(function (p) { hits[p] = true; });
    let html = from > 0 ? '…' : '';
    let marked = false;
    for (let i = from; i < to; i++) {
      if (hits[i] && !marked) { html += '<mark class="md-mark">'; marked = true; }
      if (!hits[i] && marked) { html += '</mark>'; marked = false; }
      html += esc(value.charAt(i));
    }
    if (marked) html += '</mark>';
    if (to < value.length) html += '…';
    return html;
  }

  function searchDocument(rendered, query) {
    const found = [];
    const needle = searchableChars(query).value;
    if (!needle) return found;
    (rendered.search || []).forEach(function (entry, index) {
      // 渲染结果会缓存；规范化文本也随索引缓存，连续输入时无需重复处理全文。
      entry._fuzzy = entry._fuzzy || searchableChars(entry.text);
      const match = fuzzyFind(entry._fuzzy, needle);
      if (match) found.push({ entry: entry, match: match, index: index });
    });
    found.sort(function (a, b) { return b.match.score - a.match.score || a.index - b.index; });
    return found;
  }

  function renderSearchResults(rendered, query) {
    const found = searchDocument(rendered, query);
    const shown = found.slice(0, 200);
    let html = '<aside class="rules-search-results" aria-label="搜索结果">' +
      '<div class="rules-results-head"><strong>搜索结果</strong><span>' + found.length + ' 条</span></div>';
    if (!shown.length) {
      html += '<div class="rules-results-empty">没有找到相近内容，试试更短的关键词。</div>';
    } else {
      html += '<div class="rules-results-list">' + shown.map(function (hit) {
        const e = hit.entry;
        return '<button class="rules-hit" data-act="rules-jump" data-id="' + e.id + '">' +

          '<span class="rules-hit-preview">' + snippetHtml(e.text, hit.match.positions) + '</span></button>';
      }).join('') + '</div>';
      if (found.length > shown.length) html += '<div class="rules-results-more">结果较多，仅显示最相关的前 200 条。</div>';
    }
    return html + '</aside>';
  }

  function tocButton(t) {
    return '<div class="side-toc-wrap">' +

  function tocTree(items) {
    const roots = [];
    const stack = [];
    items.forEach(function (item) {
      const node = { item: item, children: [] };
      while (stack.length && stack[stack.length - 1].item.level >= item.level) stack.pop();
      if (stack.length) stack[stack.length - 1].children.push(node);
      else roots.push(node);
      stack.push(node);
    });
    return roots;
  }

  function renderTocNodes(nodes, expanded) {
    return nodes.map(function (node) {
      const t = node.item;
      if (!node.children.length) return tocButton(t);
      return '<div class="side-toc-wrap">' +
        '<details class="side-toc-group lv' + t.level + '"' + (expanded ? ' open' : '') + '>' +
        '<summary class="side-toc lv' + t.level + '" data-act="rules-jump" data-id="' + t.id +
        '" title="' + RT.attr(t.text) + '">' + esc(t.text) + '</summary>' +
        '<div class="side-toc-children">' + renderTocNodes(node.children, expanded) + '</div></details>' +
        '<button class="side-toc-more" data-act="rules-toc-menu" data-id="' + t.id +
        '" title="加入收藏 / 文本卡库">＋</button>' +
        '</div>';
    }).join('');

          '<input id="prompt-input" class="grow" value="' + RT.attr(value || '') + '" autocomplete="off">' +
          '<div class="field-error" id="prompt-error" hidden></div>' +
          '<div class="modal-actions right">' +
          '<button class="btn ghost" data-cancel="1">取消</button>' +
          '<button class="btn gold" data-ok="1">确定</button>' +
          '</div>',
        onMount: function (modal) {
          const input = modal.querySelector('#prompt-input');
          const errEl = modal.querySelector('#prompt-error');
          const okBtn = modal.querySelector('[data-ok]');
          input.focus();
          input.select();

          const errorNow = function () {
            return validate ? (validate(input.value.trim()) || '') : '';
          };
          const sync = function () {
            const msg = errorNow();
            errEl.textContent = msg;
            errEl.hidden = !msg;
            okBtn.disabled = !!msg;
            input.classList.toggle('invalid', !!msg);
          };
          const close = function () { RT.dialogs.close(); };
          const ok = function () {
            if (errorNow()) { sync(); return; }
            const v = input.value.trim();
            RT.dialogs.close();
            if (v) onOk(v);
          };

          input.addEventListener('input', sync);
          modal.querySelector('[data-cancel]').addEventListener('click', close);
          okBtn.addEventListener('click', ok);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); ok(); }
          });
          sync();
        },
      });
    },

    folderDelete: function (folder, count, kidCount, onKeep, onDelete) {
      const extra = kidCount ? '，以及 ' + kidCount + ' 个子分组' : '';
      RT.dialogs.open({
        title: '删除分组「' + folder.name + '」',

            RT.dialogs.close();
            onKeep();
          });
          modal.querySelector('[data-del]').addEventListener('click', function () {
            RT.dialogs.close();
            onDelete();
          });
        },
      });
    },

    saveEntry: function (text) {
      const S = RT.state;
      if (!S.set.tables.length) {
        RT.toast('还没有表，先建一张', 'warn');
