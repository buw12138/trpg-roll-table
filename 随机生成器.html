<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="离线随机生成器：建随机表、分组管理、掷表、组合生成 NPC，结果可收藏并写备注。数据保存在本地，可导出导入。">
<title>随机生成器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171c22'/%3E%3Cpath d='M16 4l10 6v12l-10 6-10-6V10z' fill='none' stroke='%23d8a854' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23d8a854'/%3E%3C/svg%3E">

<style>
/* ============================================================
 * 随机生成器 · 样式（泛奇幻 / 暗亮双主题）
 * ============================================================ */

:root {
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Source Han Serif SC", "Noto Serif SC", serif;
  --font-body: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  --font-scale: 1;
  --radius: 10px;
}

[data-theme="dark"] {
  --bg: #0d1013;
  --bg-elev: #12161a;
  --panel: #171c22;
  --panel-2: #1d242b;
  --line: #2b343d;
  --line-soft: #222a32;
  --text: #e9e3d5;
  --text-dim: #98a2ac;
  --gold: #d8a854;
  --gold-strong: #f0c477;
  --gold-bg: rgba(216, 168, 84, 0.12);
  --danger: #d2705c;
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
  --ring: rgba(216, 168, 84, 0.18);
  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #f3eee3;
  --bg-elev: #faf6ec;
  --panel: #fffdf8;
  --panel-2: #f7f1e4;
  --line: #ddd2bc;
  --line-soft: #e8dfcd;
  --text: #241e15;
  --text-dim: #6f6455;
  --gold: #8f5f1d;
  --gold-strong: #a06d24;
  --gold-bg: rgba(143, 95, 29, 0.1);
  --danger: #a8452f;
  --shadow: 0 16px 34px rgba(80, 60, 30, 0.16);
  --ring: rgba(143, 95, 29, 0.16);
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(1100px 600px at 12% -10%, var(--gold-bg), transparent 60%),
    radial-gradient(900px 500px at 110% 110%, var(--gold-bg), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: calc(15px * var(--font-scale));
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body.modal-open { overflow: hidden; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

.icon { flex: none; vertical-align: -2px; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.01em; margin: 0; }

code {
  font-family: var(--font-mono);
  font-size: 0.9em;
  background: var(--panel-2);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  padding: 1px 5px;
}

kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  color: var(--text-dim);
  background: rgba(0, 0, 0, 0.14);
}

.dim { color: var(--text-dim); }
.grow { flex: 1 1 auto; min-width: 0; }
.right { margin-left: auto; }
.spacer { flex: 1 1 auto; }
.pre { white-space: pre-wrap; }

/* ---------------- 顶栏 ---------------- */

#app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
  height: 100dvh;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--bg-elev), var(--bg));
  z-index: 30;
}

.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }

.brand-mark {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 9px;
  color: var(--gold-strong);
  background: var(--gold-bg);
  border: 1px solid var(--line);
  flex: none;
}

.brand-text { display: flex; flex-direction: column; min-width: 0; }

.setname {
  background: transparent;
  border: 1px solid transparent;
  padding: 2px 6px;
  margin-left: -6px;
  font-family: var(--font-display);
  font-size: 1.12em;
  font-weight: 600;
  border-radius: 6px;
  width: 260px;
  max-width: 46vw;
}

.setname:hover { border-color: var(--line-soft); }
.setname:focus { background: var(--panel); border-color: var(--line); box-shadow: none; }

.tagline { font-size: 0.72em; color: var(--text-dim); padding-left: 2px; letter-spacing: 0.04em; }

.top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

.font-ctl {
  display: flex; align-items: center; gap: 2px;
  border: 1px solid var(--line-soft);
  border-radius: 9px;
  padding: 2px;
  color: var(--text-dim);
  font-size: 0.75em;
}

.font-ctl .icon-btn { width: 26px; height: 26px; font-size: 0.9em; }

/* ---------------- 按钮 ---------------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 13px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font: inherit;
  font-size: 0.92em;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.14s, color 0.14s, background 0.14s, transform 0.08s;
}

.btn:hover { border-color: var(--gold); color: var(--gold-strong); }
.btn:active { transform: translateY(1px); }
.btn.gold {
  background: linear-gradient(180deg, var(--gold-strong), var(--gold));
  border-color: transparent;
  color: #241a06;
  font-weight: 600;
  box-shadow: 0 6px 16px -8px var(--gold);
}
[data-theme="light"] .btn.gold { color: #fffdf6; }
.btn.gold:hover { filter: brightness(1.05); color: #241a06; }
[data-theme="light"] .btn.gold:hover { color: #fffdf6; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.danger-solid { background: var(--danger); border-color: transparent; color: #fff; }
.btn.small { padding: 6px 10px; font-size: 0.85em; border-radius: 8px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 34px; height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line-soft);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: 0.14s;
}
.icon-btn:hover { color: var(--gold-strong); border-color: var(--gold); }

.mini {
  display: inline-grid;
  place-items: center;
  width: 24px; height: 24px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0;
}
.mini:hover { color: var(--gold-strong); background: var(--panel-2); border-color: var(--line); }
.mini.danger:hover { color: var(--danger); border-color: var(--danger); }

.menu-btn { display: none; }

/* ---------------- 布局 ---------------- */

.layout {
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr);
  min-height: 0;
}

.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--line);
  background: var(--bg-elev);
}

.main {
  min-height: 0;
  overflow-y: auto;
  padding: 22px 26px 48px;
}

/* ---------------- 侧栏 ---------------- */

.side-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
  padding: 10px 10px 6px;
}

.side-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 2px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 0.7em;
  cursor: pointer;
  transition: 0.14s;
}
.side-tab:hover { color: var(--text); background: var(--panel); }
.side-tab.active { color: var(--gold-strong); background: var(--gold-bg); border-color: var(--line-soft); }

.side-search {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 6px 10px 8px;
  padding: 0 9px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text-dim);
}
.side-search input { border: none; background: transparent; padding: 7px 0; flex: 1; font-size: 0.88em; }
.side-search input:focus { box-shadow: none; }

.side-tree-bar {
  display: flex;
  gap: 5px;
  margin: 0 10px 6px;
}

.tree-btn {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--line-soft);
  background: var(--panel);
  color: var(--text-dim);
  font: inherit;
  font-size: 0.72em;
  line-height: 1.2;
  cursor: pointer;
  transition: 0.14s;
}
.tree-btn:hover { color: var(--text); border-color: var(--gold-strong); }
.tree-btn:active { transform: translateY(1px); }

.side-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 2px 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.side-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.9em;
  text-align: left;
  cursor: pointer;
}
.side-item:hover { background: var(--panel); }
.side-item.active { background: var(--gold-bg); border-color: var(--line-soft); color: var(--gold-strong); }

.side-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-meta { font-size: 0.72em; color: var(--text-dim); font-family: var(--font-mono); }
.side-item.active .side-meta { color: var(--gold); }

/* 表行（可拖动 + 更多操作） */
.side-row {
  display: flex;
  align-items: center;
  border-radius: 8px;
  border: 1px solid transparent;
  min-width: 0;
}
.side-row:hover { background: var(--panel); }
.side-row.active { background: var(--gold-bg); border-color: var(--line-soft); }
.side-row.dragging-row { opacity: 0.4; }

.side-main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 2px 7px 10px;
  border: none;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.9em;
  text-align: left;
  cursor: pointer;
}
.side-row.active .side-main { color: var(--gold-strong); }

.side-more { opacity: 0; flex: none; margin-right: 4px; }
.side-row:hover .side-more, .folder-head:hover .side-more { opacity: 1; }
@media (hover: none) { .side-more { opacity: 1; } }

/* 分组 */
.folder-block { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }

.folder-head {
  display: flex;
  align-items: center;
  gap: 2px;
  border-radius: 8px;
  border: 1px solid transparent;
}
.folder-head:hover { background: var(--panel); }
.folder-head.drop-hover { background: var(--gold-bg); border-color: var(--gold); }

.folder-toggle {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 4px 5px 8px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 0.76em;
  letter-spacing: 0.03em;
  text-align: left;
  cursor: pointer;
  border-radius: 7px;
}
.folder-toggle:hover { color: var(--text); }
.folder-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-count { margin-left: auto; font-family: var(--font-mono); font-size: 0.9em; opacity: 0.65; }

.folder-head.plain {
  display: flex;
  gap: 6px;
  padding: 6px 8px;
  font-size: 0.76em;
  color: var(--text-dim);
}

.folder-items {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-left: 11px;
  padding-left: 7px;
  border-left: 1px solid var(--line-soft);
}
.folder-children {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-left: 11px;
  padding-left: 7px;
  border-left: 1px solid var(--line-soft);
}
.folder-block.collapsed .folder-items,
.folder-block.collapsed .folder-children { display: none; }

.folder-head[draggable="true"] { cursor: grab; }
.folder-head.dragging-row { opacity: 0.4; }

.folder-empty {
  margin: 2px 0;
  padding: 7px 8px;
  border: 1px dashed var(--line-soft);
  border-radius: 7px;
  font-size: 0.72em;
  color: var(--text-dim);
}

.side-new-row { display: flex; gap: 6px; margin: 8px 10px 4px; }
.side-new-row .side-new { margin: 0; flex: 1 1 auto; }
.side-new.compact { flex: 0 0 auto; padding: 9px 10px; }

.side-empty, .side-summary, .side-tip { padding: 12px; font-size: 0.82em; color: var(--text-dim); }
.side-summary { padding: 8px 12px; }
.side-tip { line-height: 1.6; }

.side-new {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin: 8px 10px 4px;
  padding: 9px;
  border-radius: 9px;
  border: 1px dashed var(--line);
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 0.85em;
  cursor: pointer;
}
.side-new:hover { color: var(--gold-strong); border-color: var(--gold); background: var(--gold-bg); }

.side-foot { padding: 8px 14px 12px; font-size: 0.7em; }

/* ---------------- 通用视图 ---------------- */

.view { display: flex; flex-direction: column; gap: 14px; max-width: 1280px; }

.view-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.head-main { display: flex; flex-direction: column; gap: 6px; flex: 1 1 320px; min-width: 0; }
.head-actions { display: flex; gap: 6px; flex: none; padding-top: 4px; }

.title-input {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 3px 8px;
  margin-left: -8px;
  font-family: var(--font-display);
  font-size: 1.6em;
  font-weight: 600;
  width: 100%;
}
.title-input:hover { border-color: var(--line-soft); }
.title-input:focus { background: var(--panel); border-color: var(--line); box-shadow: none; }
.title-input.invalid { border-color: var(--danger); }

.field-error {
  color: var(--danger);
  font-size: 0.76em;
  padding: 2px 0 0 2px;
  line-height: 1.5;
}

.page-title { font-size: 1.5em; padding: 4px 0; }

.meta-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.82em; color: var(--text-dim); }
.meta-field { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.meta-field > span { flex: none; white-space: nowrap; }
.meta-field input { padding: 5px 8px; font-size: 0.95em; border-color: var(--line-soft); }
.meta-field select { padding: 5px 8px; font-size: 0.95em; border-color: var(--line-soft); max-width: 150px; }
.meta-field.grow { flex: 1 1 220px; min-width: 160px; }
.meta-field.grow input { width: 100%; }
.meta-field input[data-act="table-dice"] { width: 118px; }
.count { font-family: var(--font-mono); font-size: 0.9em; color: var(--text-dim); white-space: nowrap; }

.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.inline-field { display: flex; align-items: center; gap: 5px; font-size: 0.82em; color: var(--text-dim); }
.inline-field input { width: 54px; padding: 6px 8px; text-align: center; }

.hint { font-size: 0.78em; color: var(--text-dim); padding: 2px 2px 0; line-height: 1.7; }

.panel {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 12px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.panel-head { display: flex; align-items: baseline; gap: 10px; font-size: 0.88em; flex-wrap: wrap; }
.panel-head .dim { font-size: 0.86em; }
.pad { padding: 8px 2px; }

.split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.9fr); gap: 18px; align-items: start; }
.split-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.split-side { position: sticky; top: 0; min-width: 0; }

/* ---------------- 条目 ---------------- */

.entry-list {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.entry-row {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) 62px auto;
  align-items: center;
  gap: 7px;
  padding: 3px 6px;
  border-radius: 7px;
}
.entry-row:hover { background: var(--panel-2); }
.entry-row.data-dice { grid-template-columns: 26px minmax(0, 1fr) 62px auto auto; }

.entry-idx { font-family: var(--font-mono); font-size: 0.7em; color: var(--text-dim); text-align: center; }

.entry-row input { border-color: transparent; background: transparent; padding: 6px 8px; }
.entry-row input:hover { border-color: var(--line-soft); background: var(--bg-elev); }
.entry-row input:focus { background: var(--bg-elev); border-color: var(--gold); }

.entry-weight { text-align: center; font-family: var(--font-mono); font-size: 0.82em; color: var(--text-dim); }

.range-wrap { display: flex; align-items: center; gap: 2px; }
.entry-range { width: 48px; text-align: center; font-family: var(--font-mono); font-size: 0.8em; }
.dash { color: var(--text-dim); font-size: 0.8em; }

.row-actions { display: flex; gap: 1px; opacity: 0; transition: opacity 0.12s; }
.entry-row:hover .row-actions, .field-row:hover .row-actions { opacity: 1; }
@media (hover: none) { .row-actions { opacity: 1; } }

/* ---------------- 组合字段 ---------------- */

.field-list { display: flex; flex-direction: column; gap: 3px; }

.field-row {
  display: grid;
  grid-template-columns: 22px minmax(96px, 1.1fr) minmax(80px, 1fr) 52px 52px auto;
  gap: 6px;
  align-items: center;
  padding: 4px 5px;
  border-radius: 7px;
}
.field-row:hover { background: var(--panel-2); }
.field-row input, .field-row select { padding: 6px 8px; font-size: 0.88em; border-color: var(--line-soft); background: var(--bg-elev); }
.field-row .narrow { text-align: center; font-family: var(--font-mono); font-size: 0.82em; }
.field-idx { font-family: var(--font-mono); font-size: 0.7em; color: var(--text-dim); text-align: center; }

.tokens { display: flex; flex-wrap: wrap; gap: 5px; }
.token {
  padding: 3px 8px;
  border-radius: 20px;
  border: 1px solid var(--line-soft);
  background: var(--gold-bg);
  color: var(--gold-strong);
  font-family: var(--font-mono);
  font-size: 0.75em;
  cursor: pointer;
}
.token:hover { border-color: var(--gold); }

/* ---------------- 结果卡 ---------------- */

.result-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    linear-gradient(160deg, var(--gold-bg), transparent 42%),
    var(--panel);
  box-shadow: var(--shadow);
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 180px;
}
.result-card.placeholder { box-shadow: none; background: var(--panel); }

.result-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.result-title {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-display);
  font-size: 0.86em;
  letter-spacing: 0.08em;
  color: var(--gold-strong);
  text-transform: uppercase;
}
.seed { font-family: var(--font-mono); font-size: 0.68em; color: var(--text-dim); }

.result-body { min-height: 56px; display: flex; align-items: center; }
.result-text { font-size: 1.12em; line-height: 1.75; word-break: break-word; }
.result-text.pre { white-space: pre-wrap; }
.result-body:has(.result-list) { align-items: flex-start; }

.result-list { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; font-size: 1.02em; }
.result-list li::marker { color: var(--gold); font-family: var(--font-mono); font-size: 0.8em; }

.result-empty { color: var(--text-dim); font-size: 0.9em; line-height: 2; }

.dice-detail {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.74em;
  color: var(--text-dim);
  border-top: 1px dashed var(--line);
  padding-top: 8px;
}

.warnings { display: flex; flex-direction: column; gap: 4px; }
.warning {
  display: flex; align-items: flex-start; gap: 6px;
  font-size: 0.78em;
  color: var(--danger);
  background: rgba(210, 112, 92, 0.09);
  border: 1px solid rgba(210, 112, 92, 0.24);
  border-radius: 7px;
  padding: 5px 8px;
}

.result-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.result-actions.wrap { flex-wrap: wrap; }

.chips { display: flex; flex-direction: column; gap: 5px; }
.chip {
  display: grid;
  grid-template-columns: 58px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 5px 8px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: var(--bg-elev);
  font-size: 0.82em;
}
.chip.locked { border-color: var(--gold); background: var(--gold-bg); }
.chip-label { color: var(--text-dim); font-size: 0.9em; }
.chip-value { overflow-wrap: anywhere; }
.chip-actions { display: flex; gap: 1px; }

.save-entry { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 0.78em; padding-top: 4px; border-top: 1px dashed var(--line); }
.save-entry select { padding: 4px 8px; font-size: 0.95em; }

/* ---------------- 批量粘贴 ---------------- */

.bulk-panel {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 12px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.bulk-panel[data-open="false"] { display: none; }
.bulk-head { display: flex; align-items: baseline; gap: 10px; font-size: 0.82em; flex-wrap: wrap; }
.bulk-actions { display: flex; gap: 7px; }

.textarea {
  width: 100%;
  resize: vertical;
  font-family: var(--font-body);
  line-height: 1.7;
  min-height: 70px;
  background: var(--bg-elev);
}
.textarea.mono { font-family: var(--font-mono); font-size: 0.78em; line-height: 1.55; }

/* ---------------- 收藏 / 历史 ---------------- */

.fav-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.fav-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(160deg, var(--gold-bg), transparent 55%), var(--panel);
  padding: 13px 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.fav-text { font-size: 0.96em; line-height: 1.72; }
.fav-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.72em; color: var(--text-dim); }
.fav-actions { display: flex; gap: 5px; align-items: center; }

.fav-note {
  width: 100%;
  min-height: 2.6em;
  field-sizing: content;
  background: var(--bg-elev);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  padding: 7px 9px;
  font-size: 0.8em;
  line-height: 1.65;
  resize: vertical;
}
.fav-note:focus { border-color: var(--gold); }
.fav-note::placeholder { color: var(--text-dim); opacity: 0.75; }

.history-list { display: flex; flex-direction: column; gap: 7px; }
.history-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 11px;
  align-items: start;
  padding: 10px 12px;
  border: 1px solid var(--line-soft);
  border-radius: 9px;
  background: var(--panel);
}
.history-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.history-top { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; font-size: 0.86em; }
.history-text {
  font-size: 0.82em;
  color: var(--text-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.history-actions { display: flex; gap: 1px; }

.badge {
  font-size: 0.68em;
  padding: 2px 7px;
  border-radius: 20px;
  border: 1px solid var(--line);
  color: var(--text-dim);
  white-space: nowrap;
  margin-top: 2px;
}
.badge.combo { color: var(--gold-strong); border-color: var(--gold); background: var(--gold-bg); }

/* ---------------- 空状态 ---------------- */

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 12px;
  padding: 12vh 20px;
  color: var(--text-dim);
}
.empty-mark {
  width: 76px; height: 76px;
  display: grid; place-items: center;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--gold-bg);
  color: var(--gold-strong);
  margin-bottom: 4px;
}
.empty h2 { color: var(--text); font-size: 1.3em; }
.empty p { margin: 0; max-width: 30em; line-height: 1.8; font-size: 0.9em; }
.empty-actions { display: flex; gap: 9px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
.small-empty { padding: 32px 20px; border: 1px dashed var(--line); border-radius: var(--radius); }

/* ---------------- 弹窗 ---------------- */

#modal-root:empty { display: none; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(2px);
  z-index: 60;
}

.modal {
  position: fixed;
  z-index: 61;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 32px));
  max-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.modal.wide { width: min(720px, calc(100vw - 32px)); }

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line);
}
.modal-head h3 { font-size: 1.02em; }

.modal-body { padding: 14px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.modal-note { margin: 0; font-size: 0.85em; color: var(--text-dim); line-height: 1.75; }
.modal-note.pre { white-space: pre-wrap; color: var(--text); }
.modal-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.modal-actions.right { justify-content: flex-end; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 8px; flex-wrap: wrap; }
.tabs .tab {
  padding: 6px 13px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 0.86em;
  cursor: pointer;
}
.tabs .tab:hover { color: var(--text); background: var(--panel); }
.tabs .tab.active { color: var(--gold-strong); background: var(--gold-bg); border-color: var(--line-soft); }

.file-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.85em; }
.file-btn { position: relative; }
.radio-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.85em; color: var(--text-dim); }
.radio-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.radio-row input { accent-color: var(--gold); }

.snap-list { display: flex; flex-direction: column; gap: 6px; }
.snap-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  font-size: 0.82em;
}

/* ---------------- 命令面板 ---------------- */

.palette-root { position: fixed; inset: 0; z-index: 70; }
.palette-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); }

.palette {
  position: absolute;
  top: 12vh;
  left: 50%;
  transform: translateX(-50%);
  width: min(560px, calc(100vw - 28px));
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 13px;
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.palette-input {
  display: flex; align-items: center; gap: 9px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  color: var(--text-dim);
}
.palette-input input { flex: 1; border: none; background: transparent; padding: 2px 0; font-size: 1em; }
.palette-input input:focus { box-shadow: none; }

#palette-list { max-height: 52vh; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }

.palette-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.9em;
  text-align: left;
  cursor: pointer;
}
.palette-item:hover, .palette-item.active { background: var(--gold-bg); border-color: var(--line-soft); }
.pi-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi-sub { font-size: 0.78em; color: var(--text-dim); font-family: var(--font-mono); }

.palette-empty { padding: 18px; text-align: center; color: var(--text-dim); font-size: 0.85em; }
.palette-foot { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 0.72em; color: var(--text-dim); display: flex; gap: 5px; align-items: center; }

/* ---------------- 弹出菜单 ---------------- */

.menu-pop {
  position: fixed;
  z-index: 75;
  min-width: 184px;
  max-width: 260px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 5px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  max-height: 70vh;
  overflow-y: auto;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.85em;
  text-align: left;
  cursor: pointer;
}
.menu-item:hover { background: var(--gold-bg); color: var(--gold-strong); }
.menu-item.danger { color: var(--danger); }
.menu-item.danger:hover { background: rgba(210, 112, 92, 0.12); }
.mi-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi-dot { width: 14px; height: 14px; flex: none; }
.menu-sep { height: 1px; background: var(--line-soft); margin: 4px 2px; }

/* ---------------- 提示条 ---------------- */

#toast-root {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 7px;
  align-items: center;
  pointer-events: none;
}

.toast {
  padding: 9px 16px;
  border-radius: 9px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  font-size: 0.85em;
  opacity: 0;
  transform: translateY(8px);
  transition: 0.22s;
  max-width: 82vw;
}
.toast.in { opacity: 1; transform: none; }
.toast.warn { border-color: var(--danger); color: var(--danger); }

/* ---------------- 拖拽 ---------------- */

.dragging::after {
  content: "松开以导入表组 JSON";
  position: fixed;
  inset: 14px;
  z-index: 90;
  border: 2px dashed var(--gold);
  border-radius: 16px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 1.1em;
  color: var(--gold-strong);
  pointer-events: none;
}

/* ---------------- 移动端 ---------------- */

.mobile-tabs { display: none; }
.sidebar-backdrop { display: none; }

@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed;
    z-index: 55;
    top: 0; bottom: 0; left: 0;
    width: 278px;
    transform: translateX(-102%);
    transition: transform 0.22s ease;
    box-shadow: var(--shadow);
    padding-top: env(safe-area-inset-top);
  }
  body.sidebar-open .sidebar { transform: none; }
  body.sidebar-open .sidebar-backdrop {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 54;
    background: rgba(0, 0, 0, 0.45);
  }
  .menu-btn { display: inline-grid; }
  .main { padding: 16px 14px calc(84px + env(safe-area-inset-bottom)); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .split-side { position: static; }
  .mobile-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 45;
    background: color-mix(in srgb, var(--bg-elev) 94%, transparent);
    border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter: blur(8px);
  }
  .mtab {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 2px;
    border: none; background: transparent;
    color: var(--text-dim);
    font: inherit; font-size: 0.68em;
    cursor: pointer;
    border-radius: 8px;
  }
  .mtab.active { color: var(--gold-strong); }
  .top-actions .btn { padding: 7px 10px; }
  .tagline { display: none; }
  .entry-row { grid-template-columns: 22px minmax(0, 1fr) 54px auto; }
  .entry-row.data-dice { grid-template-columns: 22px minmax(0, 1fr) 50px auto; }
  .entry-row.data-dice .range-wrap { grid-column: 2 / 3; }
  .field-row { grid-template-columns: 18px minmax(0, 1fr) 46px 46px auto; }
  .field-row select { grid-column: 2 / -1; }
  .field-row input[data-act="field-label"] { grid-column: 2 / 3; }
  .font-ctl { display: none; }
  .title-input { font-size: 1.35em; }
}

@media (max-width: 560px) {
  .topbar { padding: 8px 10px; gap: 8px; }
  .setname { width: 44vw; font-size: 1em; }
  .brand-mark { display: none; }
  .top-actions { gap: 6px; }
  .top-actions > button[data-act="palette"] { display: none; }
  .top-actions .btn span { display: none; }
  .top-actions .btn { padding: 8px; }
  .toolbar { gap: 6px; }
  .btn { padding: 7px 11px; }
  .chip { grid-template-columns: 50px minmax(0, 1fr) auto; }
  .result-text { font-size: 1.04em; }
  .fav-list { grid-template-columns: 1fr; }
}

@media print {
  .topbar, .sidebar, .mobile-tabs, .toolbar, .head-actions, .side-foot, .result-actions, .save-entry, .bulk-panel, .menu-pop { display: none !important; }
  body { background: #fff; color: #000; overflow: visible; }
  #app { display: block; height: auto; }
  .layout { display: block; }
  .main { overflow: visible; padding: 0; }
  .split-side { position: static; }
  .result-card { box-shadow: none; border-color: #ccc; }
}

  <nav id="mobile-tabs" class="mobile-tabs"></nav>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ============================================================
 * 00. 随机数：可复现的种子随机（mulberry32）
 * ============================================================ */
(function (RT) {
  'use strict';

  RT.hashSeed = function (str) {
    let h = 2166136261 >>> 0;
    const s = String(str);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  };

  RT.mulberry32 = function (seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  RT.randomSeed = function () {
    if (window.crypto && window.crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] >>> 0;
    }
    return (Math.random() * 4294967296) >>> 0;
  };

  /** 按权重取下标；权重全 0 时退化为均匀分布 */
  RT.pickWeightedIndex = function (weights, rand) {
    const n = weights.length;
    if (!n) return -1;
    let total = 0;
    for (let i = 0; i < n; i++) {
      const w = Number(weights[i]);
      total += w > 0 ? w : 0;
    }
    if (total <= 0) return Math.floor(rand() * n);
    let r = rand() * total;
    for (let i = 0; i < n; i++) {
      const w = Number(weights[i]);
      if (w > 0) {
        r -= w;
        if (r < 0) return i;
      }
    }
    return n - 1;
  };

})(window.RT = window.RT || {});

/* ============================================================
 * 01. 数据模型、默认值、示例表组、导入校验
 * ============================================================ */
(function (RT) {
  'use strict';

  RT.SCHEMA_VERSION = 3;

  RT.uid = function (prefix) {
    return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  };

  RT.entry = function (text, weight, range) {
    return {
      id: RT.uid('e'),
      text: String(text == null ? '' : text),
      weight: weight == null ? 1 : Number(weight),
      range: range || null,
    };
  };

  RT.table = function (name, tags, entries, dice) {
    return {
      id: RT.uid('t'),
      name: name || '新表',
      folderId: null,
      tags: tags || [],
      dice: dice || null,
      entries: entries || [],
    };
  };

  RT.emptySet = function () {
    return {
      schemaVersion: RT.SCHEMA_VERSION,
      id: RT.uid('set'),
      name: '我的战役表组',
      updatedAt: new Date().toISOString(),
      contentVersion: null,
      folders: [],
      tables: [],
      combos: [],
      favorites: [],
      history: [],
    };
  };

  /* ---------------- 内置表包：即兴核心包（方案 A） ---------------- */

  /**
   * 首次打开、菜单「载入核心表包」、以及旧示例迁移都走这里。
   * 表内容全部定义在 01a-content.js（RT.contentSet），本文件只留接口。
   */
  RT.sampleSet = function () {
    return RT.contentSet();
  };

  /* ---------------- 导入校验 / 兼容 ---------------- */

  function num(v, dflt) {
    const n = Number(v);
    return isFinite(n) ? n : dflt;
  }

  RT.normalizeSet = function (raw) {
    if (!raw || typeof raw !== 'object') throw new Error('不是有效的 JSON 对象');
    if (!Array.isArray(raw.tables) && !Array.isArray(raw.combos)) {
      throw new Error('缺少 tables 字段，看来不是本工具导出的文件');
    }

    const set = RT.emptySet();
    set.schemaVersion = RT.SCHEMA_VERSION;
    set.id = typeof raw.id === 'string' && raw.id ? raw.id : set.id;
    set.name = typeof raw.name === 'string' && raw.name.trim() ? raw.name.trim() : '导入的表组';
    set.updatedAt = typeof raw.updatedAt === 'string' ? raw.updatedAt : new Date().toISOString();
    // 内容库版本：用于把旧版「示例表组」整包替换成即兴核心包（自定义表组不受影响）
    set.contentVersion = typeof raw.contentVersion === 'string' ? raw.contentVersion : null;

          input.focus();

          const errorNow = function () {
            return validate ? (validate(input.value.trim()) || '') : '';

            input.classList.toggle('invalid', !!msg);
          };
          const close = function () { RT.dialogs.close(); };
          const ok = function () {
            if (errorNow()) { sync(); return; }
            const v = input.value.trim();

          modal.querySelector('[data-cancel]').addEventListener('click', close);

    const tabs = qs('#mobile-tabs');
    if (tabs) {
      tabs.innerHTML = VIEWS.map(function (v) {
        return '<button class="mtab' + (S.ui.view === v[0] ? ' active' : '') + '" data-act="view" data-view="' + v[0] + '">' +
          RT.icon(v[2], 18) + '<span>' + v[1] + '</span></button>';
      }).join('');
    }
  };

  /* ---------------- 主区 ---------------- */

  function renderMain() {
    const main = qs('#main');
    if (!main) return;
    const view = S.ui.view;
    main.className = 'main view-' + view;
    if (view === 'tables') main.innerHTML = RT.viewTable();
    else if (view === 'combos') main.innerHTML = RT.viewCombo();
    else main.innerHTML = RT.viewLibrary();
  }

  app.rerender = function (scope) {
    if (scope === 'sidebar') { renderSideList(); return; }
    if (scope === 'main') { renderMain(); return; }
    app.renderSidebar();
    renderMain();
    app.applyTheme();
  };

  /* ---------------- 事件 ---------------- */

  function tableIdFrom(el) {
    return S.ui.tableId;
  }

  function onInput(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.getAttribute('data-act');
    const t = RT.currentTable();
    const c = RT.currentCombo();

    switch (act) {
      case 'search':
        RT.actions.setSearch(el.value);
        break;
      case 'table-name': {
        if (!t) break;
        const trimmed = el.value.trim();
        const conflict = !!trimmed && RT.actions.tableNameTaken(trimmed, t.id);
        const msg = !trimmed ? '表名不能为空' : conflict ? '已有同名表，请换一个名字' : '';
        setTableNameError(msg);
        el.classList.toggle('invalid', !!msg);
        if (!msg) {
          RT.actions.updateTable(t.id, { name: trimmed }, { rerender: false });
          RT.rerender('sidebar');
        }
        break;
      }
      case 'table-dice':
        if (t) RT.actions.updateTable(t.id, { dice: el.value });
        break;
      case 'table-tags':
        if (t) RT.actions.updateTable(t.id, {
          tags: el.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean),
        });
        break;
      case 'entry-text':
      case 'entry-weight':
      case 'entry-range-min':
      case 'entry-range-max': {        const row = el.closest('.entry-row');
        if (!t || !row) break;
        const eid = row.getAttribute('data-eid');
        const entry = t.entries.find(function (x) { return x.id === eid; });
        if (!entry) break;
        if (act === 'entry-text') RT.actions.updateEntry(t.id, eid, { text: el.value });
        else if (act === 'entry-weight') {
          const w = parseFloat(el.value);
          RT.actions.updateEntry(t.id, eid, { weight: isFinite(w) ? w : 1 });
        } else {
          const minEl = qs('[data-act="entry-range-min"]', row);
          const maxEl = qs('[data-act="entry-range-max"]', row);
          const min = minEl.value === '' ? NaN : Number(minEl.value);
          const max = maxEl.value === '' ? NaN : Number(maxEl.value);
          const range = isFinite(min) && isFinite(max) ? [min, max] : null;
          RT.actions.updateEntry(t.id, eid, { range: range });
        }
        break;
      }
      case 'table-times': {
        const n = Number(el.value);
        if (isFinite(n)) RT.actions.setTableTimes(n);
        break;
      }
      case 'bulk-text':
        break;
      case 'fav-note': {
        const id = el.getAttribute('data-id');
        if (id) RT.actions.updateFavoriteNote(id, el.value);
        break;
      }
      case 'combo-name':
        if (c) RT.actions.updateCombo(c.id, { name: el.value }, { rerender: false });
        break;
      case 'combo-template':
        if (c) RT.actions.updateCombo(c.id, { template: el.value }, { rerender: false });
        break;
      case 'field-label':
      case 'field-rolls':
      case 'field-sep': {
        const row = el.closest('.field-row');
        if (!c || !row) break;
        const fid = row.getAttribute('data-fid');
        if (act === 'field-label') RT.actions.updateField(c.id, fid, { label: el.value }, { rerender: false });
        else if (act === 'field-rolls') RT.actions.updateField(c.id, fid, { rolls: Math.min(20, Math.max(1, Number(el.value) || 1)) }, { rerender: false });
        else RT.actions.updateField(c.id, fid, { sep: el.value }, { rerender: false });
        break;
      }
      default:
        break;
    }
  }

  function onChange(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.getAttribute('data-act');
    if (act === 'table-dice') {
      RT.rerender('main');
    } else if (act === 'table-tags') {
      RT.rerender('sidebar');
    } else if (act === 'table-name') {
      const t = RT.currentTable();
      if (!t) return;
      const bad = RT.actions.tableNameTaken(el.value, t.id);
      if (bad) {
        el.value = t.name;
        el.classList.remove('invalid');
        setTableNameError('');
        RT.toast('表名不能为空或重名，已还原', 'warn');
      } else {
        el.value = t.name;
        el.classList.remove('invalid');
        setTableNameError('');
      }
    } else if (act === 'table-folder') {
      const t = RT.currentTable();
      if (t) RT.actions.moveTable(t.id, el.value || null);
    } else if (act === 'field-table') {
      const c = RT.currentCombo();
      const row = el.closest('.field-row');
      if (!c || !row) return;
      const fid = row.getAttribute('data-fid');
      const field = c.fields.find(function (f) { return f.id === fid; });
      const oldTable = field ? S.set.tables.find(function (t) { return t.id === field.tableId; }) : null;
      const newTable = S.set.tables.find(function (t) { return t.id === el.value; });
      const patch = { tableId: el.value };
      if (field && oldTable && newTable && field.label === oldTable.name) patch.label = newTable.name;
      RT.actions.updateField(c.id, fid, patch);
    } else if (act === 'entry-weight' || act === 'table-times') {
      /* 已在 input 里处理 */
    }
  }

  function parseBulk(text) {
    return String(text || '').split(/\r?\n/).map(function (line) {
      return line.trim();
    }).filter(Boolean).map(function (line) {
      const parts = line.split('|').map(function (s) { return s.trim(); });
      const body = parts[0];
      let weight = 1;
      let range = null;
      function takeRange(str) {
        const m = String(str).match(/^(-?\d+)\s*-\s*(-?\d+)$/);
        if (m) { range = [Number(m[1]), Number(m[2])]; return true; }
        return false;
      }
      if (parts[1] !== undefined && parts[1] !== '') {
        if (!takeRange(parts[1])) {
          const w = Number(parts[1]);
          if (isFinite(w)) weight = w;
        }
      }
      if (parts[2] !== undefined && parts[2] !== '') takeRange(parts[2]);
      return RT.entry(body, weight, range);
    });
  }

  /* ---------------- 命令面板 ---------------- */

  let paletteEl = null;
  let paletteIndex = 0;
  let paletteItems = [];

  function allItems() {
    const out = [];
    S.set.tables.forEach(function (t) {
      out.push({ kind: 'table', id: t.id, name: t.name, sub: t.entries.length + ' 条', icon: 'grid' });
    });
    S.set.combos.forEach(function (c) {
      out.push({ kind: 'combo', id: c.id, name: c.name, sub: c.fields.length + ' 个字段', icon: 'layers' });
    });
    return out;
  }

  function renderPaletteList(query) {
    const q = String(query || '').trim().toLowerCase();
    paletteItems = allItems().filter(function (it) {
      return !q || (it.name + ' ' + it.sub).toLowerCase().indexOf(q) >= 0;
    }).slice(0, 40);
    if (paletteIndex >= paletteItems.length) paletteIndex = 0;
    const list = qs('#palette-list');
    if (!list) return;
    list.innerHTML = paletteItems.length
      ? paletteItems.map(function (it, i) {
          return '<button class="palette-item' + (i === paletteIndex ? ' active' : '') + '" data-pi="' + i + '">' +
            RT.icon(it.icon, 15) +
            '<span class="pi-name">' + esc(it.name) + '</span>' +
            '<span class="pi-sub">' + esc(it.sub) + '</span></button>';
        }).join('')
      : '<div class="palette-empty">没有匹配项</div>';
  }

  function openPalette() {
    if (paletteEl) return;
    paletteEl = document.createElement('div');
    paletteEl.className = 'palette-root';
    paletteEl.innerHTML =
      '<div class="palette-backdrop" data-pclose="1"></div>' +
      '<div class="palette">' +
      '<div class="palette-input">' + RT.icon('search', 16) +
      '<input id="palette-input" placeholder="跳到表或组合…（回车打开）" autocomplete="off"></div>' +
      '<div id="palette-list"></div>' +
      '<div class="palette-foot"><kbd>↑</kbd><kbd>↓</kbd> 选择 · <kbd>Enter</kbd> 打开 · <kbd>Esc</kbd> 关闭</div>' +
      '</div>';
    document.body.appendChild(paletteEl);
    paletteIndex = 0;
    renderPaletteList('');

    const input = qs('#palette-input');
    input.focus();
    input.addEventListener('input', function () { paletteIndex = 0; renderPaletteList(input.value); });

    paletteEl.addEventListener('click', function (e) {
      if (e.target.closest('[data-pclose]')) { closePalette(); return; }
      const item = e.target.closest('[data-pi]');
      if (item) choosePalette(Number(item.getAttribute('data-pi')));
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); paletteIndex = Math.min(paletteItems.length - 1, paletteIndex + 1); renderPaletteList(input.value); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); paletteIndex = Math.max(0, paletteIndex - 1); renderPaletteList(input.value); }
      else if (e.key === 'Enter') { e.preventDefault(); choosePalette(paletteIndex); }
    });
  }

  function choosePalette(i) {
    const it = paletteItems[i];
    if (!it) return;
    closePalette();
    if (it.kind === 'table') RT.actions.selectTable(it.id);
    else RT.actions.selectCombo(it.id);
  }

  function closePalette() {
    if (!paletteEl) return;
    paletteEl.remove();
    paletteEl = null;
  }

  /* ---------------- 弹出菜单 ---------------- */

  let menuEl = null;

  function closeMenu() {
    if (menuEl) {
      menuEl.remove();
      menuEl = null;
    }
  }

  function openMenu(anchor, items) {
    closeMenu();
    const el = document.createElement('div');
    el.className = 'menu-pop';
    el.innerHTML = items.map(function (it, i) {
      if (it.sep) return '<div class="menu-sep"></div>';
      return '<button class="menu-item' + (it.danger ? ' danger' : '') + '" data-mi="' + i + '">' +
        (it.icon ? RT.icon(it.icon, 14) : '<span class="mi-dot"></span>') +
        '<span class="mi-label">' + esc(it.label) + '</span>' +
        (it.active ? RT.icon('check', 13) : '') +
        '</button>';
    }).join('');
    document.body.appendChild(el);

    const rect = anchor.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    let left = Math.min(rect.left, window.innerWidth - w - 10);
    let top = rect.bottom + 6;
    if (top + h > window.innerHeight - 10) top = Math.max(10, rect.top - h - 6);
    el.style.left = Math.max(10, left) + 'px';
    el.style.top = top + 'px';

    el.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-mi]');
      if (!btn) return;
      const it = items[Number(btn.getAttribute('data-mi'))];
      closeMenu();
      if (it && it.onClick) it.onClick();
    });
    menuEl = el;
  }

  function focusTableName() {
    setTimeout(function () {
      const inp = qs('[data-act="table-name"]');
      if (inp) { inp.focus(); inp.select(); }
    }, 40);
  }

  function setTableNameError(msg) {
    const el = qs('#table-name-error');
    if (!el) return;
    el.textContent = msg || '';
    el.hidden = !msg;
  }

  /** 新建表弹窗：默认名唯一，重名/空名时禁用确定 */
  function createTableDialog(folderId) {
    const folder = folderId ? S.set.folders.find(function (f) { return f.id === folderId; }) : null;
    const suggested = RT.actions.uniqueTableName('新表 ' + (S.set.tables.length + 1));
    RT.dialogs.prompt(
      '新建表',
      suggested,
      function (name) {
        const created = RT.actions.addTable(name, folderId || null);
        if (created) focusTableName();
      },
      folder ? '会放进「' + folder.name + '」里。表名不能与已有表重复。' : '表名不能与已有表重复。',
      function (name) {
        if (!name) return '表名不能为空';
        return RT.actions.tableNameTaken(name) ? '已有同名表「' + name + '」，请换一个名字' : '';
      }
    );
  }

  /* ---------------- 键盘 / 拖拽 ---------------- */

  function bindGlobal() {
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);

    document.addEventListener('click', function (e) {
      if (!menuEl) return;
      if (e.target.closest('.menu-pop')) return;
      closeMenu();
    }, true);

    /* 拖动表 / 分组到分组 */
    document.addEventListener('dragstart', function (e) {
      const el0 = e.target instanceof Element ? e.target : null;
      if (!el0) return;

      const folderEl = el0.closest('[data-drag-folder]');
      if (folderEl) {
        e.dataTransfer.setData('text/plain', 'folder:' + folderEl.getAttribute('data-drag-folder'));
        e.dataTransfer.effectAllowed = 'move';
        folderEl.classList.add('dragging-row');
        return;
      }

      const row = el0.closest('[data-drag-table]');
      if (!row) return;
      e.dataTransfer.setData('text/plain', 'table:' + row.getAttribute('data-drag-table'));
      e.dataTransfer.effectAllowed = 'move';
      row.classList.add('dragging-row');
    });

    document.addEventListener('dragend', function (e) {
      const el0 = e.target instanceof Element ? e.target : null;
      const row = el0 && (el0.closest('[data-drag-table]') || el0.closest('[data-drag-folder]'));
      if (row) row.classList.remove('dragging-row');
      qsa('.drop-hover').forEach(function (x) { x.classList.remove('drop-hover'); });
    });

    document.addEventListener('dragover', function (e) {
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) return;
      const el0 = e.target instanceof Element ? e.target : null;
      const head = el0 && el0.closest('[data-drop-folder]');
      if (!head) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (!head.classList.contains('drop-hover')) {
        qsa('.drop-hover').forEach(function (x) { x.classList.remove('drop-hover'); });
        head.classList.add('drop-hover');
      }
    });

    document.addEventListener('dragleave', function (e) {
      const el0 = e.target instanceof Element ? e.target : null;
      const head = el0 && el0.closest('[data-drop-folder]');
      if (head && !head.contains(e.relatedTarget)) head.classList.remove('drop-hover');
    });

    document.addEventListener('drop', function (e) {
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) return;
      const el0 = e.target instanceof Element ? e.target : null;
      const head = el0 && el0.closest('[data-drop-folder]');
      if (!head) return;
      e.preventDefault();
      e.stopPropagation();
      head.classList.remove('drop-hover');
      const payload = e.dataTransfer.getData('text/plain');
      if (!payload) return;
      const targetId = head.getAttribute('data-drop-folder') || null;
      if (payload.indexOf('folder:') === 0) {
        RT.actions.moveFolder(payload.slice(7), targetId);
      } else {
        RT.actions.moveTable(payload.replace(/^table:/, ''), targetId);
      }
    });

    document.addEventListener('keydown', function (e) {
      const target = e.target;
      const typing = target && (/^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName) || target.isContentEditable);

      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k') {
        e.preventDefault();
        openPalette();
        return;
      }
      if (e.key === 'Escape') {
        if (menuEl) { closeMenu(); return; }
        if (paletteEl) { closePalette(); return; }
        if (RT.dialogs.isOpen()) { RT.dialogs.close(); return; }
      }
      if (e.key === ' ' && !typing && !RT.dialogs.isOpen() && !paletteEl) {
        if (S.ui.view === 'tables') { e.preventDefault(); RT.actions.rollTableNow(); }
        else if (S.ui.view === 'combos') { e.preventDefault(); RT.actions.rollComboNow(); }
      }
    });

    let dragDepth = 0;

    function isFileDrag(e) {
      const dt = e.dataTransfer;
      if (!dt) return false;
      const types = dt.types;
      if (!types) return false;
      for (let i = 0; i < types.length; i++) {
        if (types[i] === 'Files') return true;
      }
      return false;
    }

    window.addEventListener('dragenter', function (e) {
      if (!isFileDrag(e)) return;
      dragDepth++;
      document.body.classList.add('dragging');
    });
    window.addEventListener('dragover', function (e) {
      // 只拦住文件拖拽，内部拖动表由分组标题自己处理
      if (isFileDrag(e)) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      }
    });
    window.addEventListener('dragleave', function () {
      if (dragDepth <= 0) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) document.body.classList.remove('dragging');
    });
    document.addEventListener('dragend', function () {
      dragDepth = 0;
      document.body.classList.remove('dragging');
    });
    window.addEventListener('drop', function (e) {
      dragDepth = 0;
      document.body.classList.remove('dragging');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      e.preventDefault();
      if (!/\.json$/i.test(file.name)) { RT.toast('只支持拖入 .json 表组文件', 'warn'); return; }
      const reader = new FileReader();
      reader.onload = function () {
        RT.dialogs.io('import', String(reader.result || ''));
        RT.toast('已读取「' + file.name + '」');
      };
      reader.readAsText(file, 'utf-8');
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (S.prefs.theme === 'system') app.applyTheme();
    });

    window.addEventListener('beforeunload', function () { RT.saveNow(); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') RT.saveNow();
    });
  }

  /* ---------------- 启动 ---------------- */

  app.init = function () {
    RT.loadState();
    app.applyTheme();
    const setname = qs('#setname');
    if (setname) {
      setname.value = S.set.name;
      setname.addEventListener('input', function () { RT.actions.renameSet(setname.value); });
    }

    const search = qs('#side-search-input');
    if (search) search.setAttribute('autocomplete', 'off');

    app.rerender('all');
    bindGlobal();

    if (S.firstRun) {
      setTimeout(function () {
        RT.toast('初次见面：已载入「即兴核心包」（' + S.set.tables.length + ' 张表 / ' + S.set.combos.length + ' 个组合），点侧栏「组合」试试一键生成 NPC');
      }, 600);
    }
    if (S.migratedFromSample) {
      setTimeout(function () {
        RT.toast('旧的内置示例表已清空，替换为「即兴核心包」；旧表在 导入/导出 → 备份 里可找回', 'warn');
      }, 600);
    }
    if (!RT.storage.available) {
      setTimeout(function () {
        RT.toast('浏览器禁止了本地存储，数据只在本次会话有效——记得先导出', 'warn');
      }, 1200);
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', app.init);
  } else {
    app.init();
  }

})(window.RT = window.RT || {});

</script>

</body>
</html>
